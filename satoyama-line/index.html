<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>里山線 · 平成乡间铁路</title>
<style>
:root{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;color:#f8f2df;background:#526454;--ink:#faf3df;--muted:#c7c9b6;--accent:#f5cea0;--panel:rgba(23,35,29,.88);--line:rgba(230,232,207,.22)}
*{box-sizing:border-box}
body{margin:0;overflow:hidden;min-height:100vh}
button,select,input{font:inherit;color:inherit}
button,select,input[type=number]{border:1px solid var(--line);background:#2c3a32;border-radius:7px}
button{cursor:pointer}
button:hover{background:#41534a}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button[aria-pressed=true]{background:#ead2a8;color:#28372d;border-color:#f3dcb5}
button[disabled]{opacity:.55;cursor:default}
[hidden]{display:none!important}
#stage,#scene,.vignette{position:fixed;inset:0;width:100%;height:100%}
#scene{display:block;touch-action:none;outline:none;cursor:grab}
#scene.dragging{cursor:grabbing}
#scene.picking{cursor:crosshair}
.vignette{pointer-events:none;background:linear-gradient(180deg,rgba(20,33,29,.32),transparent 24%,transparent 68%,rgba(21,33,25,.53)),radial-gradient(ellipse at 50% 44%,transparent 54%,rgba(21,31,24,.18));}
.hud{position:fixed;inset:0;pointer-events:none}
.hud button,.hud select,.hud input,.hud dialog,.map-card{pointer-events:auto}
.brand{position:absolute;top:max(26px,env(safe-area-inset-top));left:max(32px,env(safe-area-inset-left));display:flex;align-items:center;gap:14px;color:#fff8e5;text-shadow:0 2px 13px #182a24b5}
.brand-mark{position:relative;display:grid;place-items:center;width:45px;height:45px;border:1px solid #f6e6c1;border-radius:50%;color:#fff0c9;box-shadow:0 1px 7px #15241f6b}
.brand-mark span{width:24px;height:12px;border-top:1.5px solid;border-bottom:1.5px solid;transform:rotate(-34deg);display:block}
.brand-mark span::before,.brand-mark span::after{position:absolute;top:-4px;height:18px;width:1.5px;background:currentColor;content:"";left:7px}
.brand-mark span::after{left:16px}
.brand h1{font-family:"Noto Serif CJK SC","Songti SC",serif;font-weight:600;margin:0;font-size:40px;letter-spacing:.14em;line-height:1.1}
.brand p{margin:6px 0 0;font-size:11px;letter-spacing:.17em;color:#fff5dc;font-weight:500}
.top-actions{position:absolute;top:max(27px,env(safe-area-inset-top));right:max(32px,env(safe-area-inset-right));display:flex;gap:7px}
.top-actions button,.toggle-tools button{font-size:13px;padding:8px 13px;background:var(--panel);box-shadow:0 3px 12px #182a2428}
.top-actions button:hover,.toggle-tools button:hover{background:#384b40}
.top-actions button[aria-pressed=true]{background:#ead2a8}
.ride-card,.map-card,.view-menu,.editor,.fatal{background:var(--panel);border:1px solid var(--line);box-shadow:0 7px 26px #13251e42;border-radius:12px}
.ride-card{position:absolute;left:max(32px,env(safe-area-inset-left));bottom:max(33px,env(safe-area-inset-bottom));width:247px;padding:15px 16px 13px}
.service-line{display:flex;justify-content:space-between;gap:6px;align-items:center;white-space:nowrap;color:var(--muted);font-size:11px}
.service-line .indicator{display:inline-flex;align-items:center;gap:5px;color:#e8e7cd}
.indicator::before{content:"";width:6px;height:6px;border-radius:50%;background:#b5d698}
.ride-card[data-stopped=true] .indicator::before{background:#f5bc7b}
.ride-card[data-paused=true] .indicator::before{background:#bbc3b7}
.ride-card h2{font-size:21px;line-height:1.25;font-weight:650;letter-spacing:.01em;margin:9px 0 7px}
.ride-metrics{display:flex;align-items:baseline;justify-content:space-between;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
#speed{font-family:system-ui,sans-serif;font-size:27px;line-height:1;font-weight:530;color:var(--ink);letter-spacing:-.035em}
.progress{margin:9px 0 11px;height:3px;border-radius:4px;background:#647463;overflow:hidden}
#progress{display:block;height:100%;width:100%;transform:scaleX(0);transform-origin:left;background:#dfbd88;border-radius:4px}
.playback{display:flex;align-items:center;gap:5px}
.playback button{height:27px;font-size:11px;padding:0 7px;min-width:29px;border-color:#5c6b5c}
#play{font-size:12px;min-width:55px;margin-right:auto}
.view-dock{position:absolute;bottom:max(33px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:7px}
.view-menu{display:flex;gap:4px;padding:5px;border-radius:10px}
.view-menu button{border-color:transparent;white-space:nowrap;font-size:14px;background:transparent;padding:8px 10px;display:flex;align-items:center;gap:6px}
.view-menu button:hover{background:#41534a}
.view-menu button[aria-pressed=true]{background:#ead2a8}
kbd{font-family:system-ui,sans-serif;font-size:10px;line-height:14px;min-width:15px;height:15px;text-align:center;border:1px solid currentColor;border-radius:3px;opacity:.66}
#view-hint{font-size:11px;white-space:nowrap;color:#fcf1d9;text-shadow:0 1px 4px #16251e,0 2px 9px #16251e;min-height:16px}
.map-card{position:absolute;right:max(32px,env(safe-area-inset-right));bottom:max(33px,env(safe-area-inset-bottom));width:218px;padding:12px 12px 9px}
.map-header{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:650}
.map-header button{height:23px;width:26px;padding:0}
.map-layer{position:relative;height:127px;margin-top:3px}
#map{display:block;width:100%;height:100%}
.map-node{position:absolute;transform:translate(-50%,-50%);width:17px;height:17px;padding:0;border:1px solid #eae5c9;border-radius:50%;background:#2c4b3c;z-index:1}
.map-node::before{content:"";display:block;position:absolute;inset:4px;border-radius:inherit;background:#f7ebcb}
.map-node[aria-pressed=true]{border-color:#efc28b;background:#9d703f}
.map-label{position:absolute;pointer-events:none;left:50%;top:50%;white-space:nowrap;transform:translate(var(--dx),var(--dy));text-shadow:0 1px 3px #172d23;color:#f1ead3;font-size:11px}
.map-card.folded{width:113px}
.editor{position:fixed;right:max(32px,env(safe-area-inset-right));top:74px;width:292px;max-height:calc(100dvh - 165px);overflow:auto;padding:15px;pointer-events:auto}
.editor-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.editor h2{font-size:17px;margin:0}
.editor button{font-size:12px;padding:6px 10px}
.editor p{color:var(--muted);font-size:12px;margin:10px 0;line-height:1.55}
.editor label{display:block;color:#e5e1ce;font-size:12px}
.editor select{width:100%;padding:7px;margin:3px 0 7px;font-size:13px}
.editor-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:6px 0 10px}
.editor input{width:100%;padding:5px 7px;margin-top:3px;font-size:13px}
.editor-actions{display:flex;gap:7px}
.fatal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:15px;max-width:calc(100vw - 32px);width:400px;padding:20px}
.fatal p{margin:8px 0;line-height:1.55}
@media(max-width:1000px){
 .brand,.ride-card{left:max(17px,env(safe-area-inset-left))}
 .top-actions,.map-card,.editor{right:max(17px,env(safe-area-inset-right))}
 .brand h1{font-size:34px}
 .ride-card{width:186px;padding:12px}
 .ride-card h2{font-size:18px}
 .map-card{width:172px;padding:10px}
 .map-layer{height:108px}
 .view-menu button{padding:8px 7px}
}
@media(max-width:700px){
 .brand{top:max(15px,env(safe-area-inset-top));gap:8px}
 .brand h1{font-size:27px}
 .brand p{font-size:9px;letter-spacing:.05em}
 .brand-mark{height:33px;width:33px}
 .brand-mark span{width:19px;height:10px}
 .brand-mark span::before,.brand-mark span::after{height:15px;left:5px}
 .brand-mark span::after{left:12px}
 .top-actions{top:max(16px,env(safe-area-inset-top));gap:5px}
 .top-actions button{font-size:11px;padding:6px 8px}
 .view-dock{bottom:max(12px,env(safe-area-inset-bottom));gap:4px}
 .view-menu button{padding:8px 9px}
 .ride-card,.map-card{bottom:max(67px,calc(env(safe-area-inset-bottom) + 57px))}
 .editor{top:56px;max-height:calc(100dvh - 128px);width:min(278px,calc(100vw - 34px))}
}
@media(max-width:395px){
 .ride-card{width:166px}
 .service-line{font-size:10px}
 .map-card{width:141px}
 .map-card.folded{width:91px}
 .map-label{font-size:10px}
 .brand h1{font-size:25px}
 .brand p{max-width:115px;line-height:1.45}
}
@media(max-height:465px) and (min-width:701px){
 .brand,.top-actions{top:13px}
 .ride-card,.map-card,.view-dock{bottom:13px}
 .ride-card{padding:9px 11px}
 .map-layer{height:91px}
}
</style>
</head>
<body>
<div id="stage">
  <canvas id="scene" tabindex="0" aria-label="里山線三维场景"></canvas>
  <div class="vignette" aria-hidden="true"></div>
</div>
<div class="hud">
  <header class="brand">
    <span class="brand-mark" aria-hidden="true"><span></span></span>
    <div><h1 lang="ja">里山線</h1><p>平成十六年 · 乡间铁路</p></div>
  </header>
  <div class="top-actions">
    <button id="edit-toggle" type="button" aria-expanded="false" aria-controls="editor">场景编辑</button>
    <button id="fullscreen" type="button">全屏</button>
  </div>
  <section id="ride" class="ride-card" aria-label="列车运行状态">
    <div class="service-line"><span>普通列车 · 2 辆</span><span id="state" class="indicator">行驶中</span></div>
    <h2 id="destination">前往青穗站</h2>
    <div class="ride-metrics"><span><span id="speed">0</span> km/h</span><span id="countdown">—</span></div>
    <div class="progress" aria-hidden="true"><span id="progress"></span></div>
    <div class="playback" role="group" aria-label="模拟播放">
      <button id="play" type="button" title="暂停或继续（空格键）">暂停</button>
      <button type="button" data-rate="1" aria-pressed="true">1×</button>
      <button type="button" data-rate="2" aria-pressed="false">2×</button>
      <button type="button" data-rate="4" aria-pressed="false">4×</button>
    </div>
  </section>
  <nav class="view-dock" aria-label="观察视角">
    <div class="view-menu">
      <button type="button" data-view="overview" aria-pressed="false"><kbd>1</kbd>俯瞰</button>
      <button type="button" data-view="follow" aria-pressed="true"><kbd>2</kbd>跟车</button>
      <button type="button" data-view="interior" aria-pressed="false"><kbd>3</kbd>车厢</button>
      <button type="button" data-view="platform" aria-pressed="false"><kbd>4</kbd>站台</button>
    </div>
    <div id="view-hint">拖动旋转 · 滚轮缩放</div>
  </nav>
  <section id="map-card" class="map-card" aria-label="线路图">
    <div class="map-header"><span>里山线路图</span><button id="map-toggle" type="button" aria-label="收起线路图" aria-expanded="true">−</button></div>
    <div id="map-layer" class="map-layer"><canvas id="map" aria-hidden="true"></canvas></div>
  </section>
  <aside id="editor" class="editor" aria-label="场景编辑器" hidden>
    <div class="editor-head"><h2>场景编辑</h2><button id="edit-close" type="button" aria-label="关闭场景编辑">关闭</button></div>
    <label>类别<select id="object-category"><option value="train">列车</option><option value="building">建筑</option><option value="person">人物</option><option value="facility">设施</option></select></label>
    <label>对象<select id="object-select"></select></label>
    <div class="editor-grid">
      <label>X 偏移 (m)<input type="number" data-transform="x" step="0.25" min="-100" max="100"></label>
      <label>Z 偏移 (m)<input type="number" data-transform="z" step="0.25" min="-100" max="100"></label>
      <label>高度偏移 (m)<input type="number" data-transform="y" step="0.25" min="-20" max="40"></label>
      <label>朝向 (°)<input type="number" data-transform="rotation" step="5" min="-360" max="360"></label>
      <label>缩放<input type="number" data-transform="scale" step="0.05" min="0.25" max="4"></label>
    </div>
    <div class="editor-actions"><button id="focus-object" type="button">定位对象</button><button id="reset-object" type="button">还原对象</button></div>
    <p>可在场景中点选对象。编辑仅在当前页面有效。</p>
  </aside>
</div>
<noscript><div class="fatal">请启用 JavaScript 后重新打开这个 HTML。</div></noscript>
<div id="fatal" class="fatal" role="alert" hidden><strong>3D 场景无法启动</strong><p id="fatal-detail">请在启用了 WebGL 2 的浏览器中打开这个 HTML。</p><button id="retry" type="button">重试</button></div>

}

const scene = new T.Scene();

function group(parent, name, x = 0, y = 0, z = 0) {

}

  return palette.get(key);

const meshMaterial = source => source?.isMaterial ? source : mat(source);

  const key = [ratio, sides].join(',');
  if (!cylinderCache.has(key)) {
    cylinderCache.set(key, new T.CylinderGeometry(ratio, 1, 1, sides));
  }
  return cylinderCache.get(key);

  const part = new T.Mesh(geometry, meshMaterial(material));
  part.position.set(x, y, z);
  part.castShadow = cast;
  part.receiveShadow = receive;
  parent.add(part);
  return part;
}
function box(parent, width, height, depth, x, y, z, material, cast = true) {
  const part = mesh(parent, unitBox, material, x, y, z, cast);
  part.scale.set(width, height, depth);
  return part;
}
function ellipsoid(parent, width, height, depth, x, y, z, material, cast = true) {
  const part = mesh(parent, unitSphere, material, x, y, z, cast);
  part.scale.set(width, height, depth);
  return part;

  part.scale.set(bottom, height, bottom);

  node.name = label;
  const definition = { node, label, category, size, base: {
    position: node.position.clone(), rotation: node.rotation.y, scale: node.scale.clone()
  }};

function windMaterial(base, value, strength) {
  base.onBeforeCompile = shader => {
    shader.uniforms.uWindTime = weatherTime;
    shader.vertexShader = 'uniform float uWindTime;\n' + shader.vertexShader;
    shader.vertexShader = shader.vertexShader.replace('#include <begin_vertex>', `
      #include <begin_vertex>
      float moving = ${value};
      vec2 seed = position.xz;
      #ifdef USE_INSTANCING
        seed += instanceMatrix[3].xz;
      #endif
      transformed.x += sin(uWindTime * 2.1 + seed.x * .18 + seed.y * .10) * moving * ${strength};
      transformed.z += cos(uWindTime * 1.68 + seed.y * .16) * moving * ${strength * .43};
    `);
  };
  base.customProgramCacheKey = () => `${value}:${strength}`;
  return base;
}

function instanceParts(parent, name, geometry, material, specs, cast = true, receive = true) {
  const batch = new T.InstancedMesh(geometry, material, specs.length);
  batch.name = name;
  const m = new T.Matrix4();
  const q = new T.Quaternion();
  const identity = new T.Quaternion();
  for (const [i, spec] of specs.entries()) {
    m.compose(spec.position, spec.quaternion || (spec.yaw ? q.setFromAxisAngle(up, spec.yaw) : identity), spec.scale);
    batch.setMatrixAt(i, m);
    if (spec.color) batch.setColorAt(i, spec.color);
  }
  batch.castShadow = cast;
  batch.receiveShadow = receive;
  parent.add(batch);
  return batch;
}

const dwell = 8.85;
const maxSpeed = 13.25;
const accelerate = 1.55;
const brake = 1.86;
let loopTime = 0;
const schedule = stations.map((station,index) => {
  const stop = loopTime;
  const next = stations[(index+1)%stations.length];
  const distance = wrap(next.stop - station.stop,routeLength);
  const peak = Math.min(maxSpeed,Math.sqrt(2*distance/(1/accelerate+1/brake)));
  const rampUp = peak/accelerate;
  const rampDown = peak/brake;
  const accelDist = rampUp*peak*.5;
  const brakeDist = rampDown*peak*.5;
  const coast = Math.max(0,(distance-accelDist-brakeDist)/peak);
  const depart = stop+dwell;
  loopTime=depart+rampUp+coast+rampDown;
  return {station,next,stop,depart,end:loopTime,rampUp,rampDown,coast,peak,accelDist,distance};
});
const initialTime = loopTime - Math.sqrt(2*24.7/brake);
function sampleService(elapsed) {
  const t = wrap(elapsed,loopTime);
  const leg = schedule.find(section => t < section.end);
  const {station,next}=leg;
  if(t<leg.depart) {
    const phase=t-leg.stop;
    const opening=smooth(.56,1.55,phase);
    const closing=smooth(dwell-1.48,dwell-.45,phase);
    const status=phase<.56?'已到站':phase<1.55?'开门中':phase<dwell-1.48?'停站中':phase<dwell-.45?'关门中':'即将发车';
    return {distance:station.stop,speed:0,station,next,previous:station,phase,
      doors:opening*(1-closing), status, remaining:leg.depart-t, progress:1};
  }
  const travel=t-leg.depart;
  let distance,speed;
  let status='行驶中';
  if(travel<leg.rampUp) {
    speed=travel*accelerate;
    distance=.5*travel*speed;
    if(travel<3.2) status='发车中';
  } else if(travel<leg.rampUp+leg.coast) {
    speed=leg.peak;
    distance=leg.accelDist+leg.peak*(travel-leg.rampUp);
  } else {
    const remaining=leg.end-t;
    speed=remaining*brake;
    distance=leg.distance-.5*remaining*speed;
    status='进站减速';
  }
  return {distance:wrap(station.stop+distance,routeLength),speed,station:null,next,previous:station,
    phase:0,doors:0,status,remaining:leg.end-t,travel,progress:distance/leg.distance};
}
const leadFrame=frame();
const frontBogie=frame();
const rearBogie=frame();
const movingForward=V();
function animateCars(cars,service,time) {
  for(const [index,car] of cars.entries()) {
    const distance=service.distance-index*carGap;
    const f=trackFrame(distance,index===0?leadFrame:tempFrame);
    trackFrame(distance+5.48,frontBogie);
    trackFrame(distance-5.48,rearBogie);
    movingForward.subVectors(frontBogie.center,rearBogie.center);
    car.pivot.position.copy(f.center).setY(trainY);
    car.pivot.rotation.y=Math.atan2(movingForward.x,movingForward.z);
    for(const {leaf,closed,sign,side} of car.doors) {
      const open=side===-1?service.doors:0;
      leaf.position.z=closed+sign*.642*open;
      leaf.position.x=side*(1.358+.079*smooth(0,.29,open));
    }
    for(const axle of car.wheels) axle.rotation.x=wrap((service.distance+(service.distance<stations[0].stop?routeLength:0)-index*carGap+
      Math.floor((initialTime+time)/loopTime)*routeLength)/.347,TAU);

      if(entry.mode==='conductor') animatePerson(entry.actor,time,service.doors>.1?'wave':'idle',service.doors*.77);
      else animatePerson(entry.actor,time,'sit');

const transferPosition=V();
function animatePlatformActors(time,service,leadBody) {
  for (const station of stations) {
    const stopped=service.station===station;
    const justLeft=!service.station&&service.previous===station;
    const leavingDistance=justLeft?wrap(service.distance-station.stop,routeLength):Infinity;
    const waving=stopped?smooth(dwell-2,dwell-.65,service.phase):justLeft?1-smooth(14,25,leavingDistance):0;
    for (const {actor,action} of station.waiting) {
      if (action==='staff') {
        animatePerson(actor,time,waving>0?'wave':'idle',waving);
      } else if (action==='walk') {
        const stride = time*.19 + station.index*1.23;
        actor.mover.position.z=-17.2+Math.sin(stride)*2.43;
        actor.mover.rotation.y = Math.cos(stride)>0 ? 0 : Math.PI;
        animatePerson(actor,time,'walk');
      } else {
        animatePerson(actor,time,action);
      }
    }
    const phase=service.phase;
    const exiter=station.exiter;
    const boarder=station.boarder;
    exiter.mover.visible=(stopped&&phase>.92)||justLeft;
    boarder.mover.visible=stopped||justLeft;
    if(exiter.mover.visible) {
      if(stopped) {
        const x=mix(-.57,-3.71,smooth(1.31,4.13,phase));
        const z=doorLocations[0]-smooth(4.13,6.88,phase)*1.79;
        const stand=mix(floorTop,platformTop-trainY,smooth(1.39,1.80,-x));
        exiter.mover.position.copy(leadBody.localToWorld(transferPosition.set(x,stand,z)));
        exiter.mover.rotation.y=leadBody.parent.rotation.y-Math.PI/2-smooth(4,4.5,phase)*1.1;
        animatePerson(exiter,time,phase>1.31&&phase<6.88?'walk':'idle');
      } else {
        const leaving = smooth(0,6.3,service.travel);
        const z = 8.8+doorLocations[0]-1.79-6.5*leaving;
        exiter.mover.position.copy(station.node.localToWorld(transferPosition.set(-3.71-1.14*leaving,platformTop,z)));
        exiter.mover.rotation.y=station.frame.yaw-Math.PI*.94;

    if(boarder.mover.visible) {

}
function animateCrossing(crossing,service,time) {

  const down=Math.max(1-smooth(21,35,ahead),1-smooth(carGap+halfCar+1,carGap+halfCar+8,behind));

    if(pointers.size===0) {
      moved=0;
      panMode=event.shiftKey||event.button===2;
    } else moved=15;
    pointers.set(event.pointerId,{x:event.clientX,y:event.clientY});
    canvas.setPointerCapture(event.pointerId);
    canvas.classList.add('dragging');
  });
  canvas.addEventListener('pointermove',event=>{
    const previous=pointers.get(event.pointerId);
    if(!previous) return;
    const before=pointers.size===2?pointerDistance():0;
    const dx=event.clientX-previous.x;
    const dy=event.clientY-previous.y;
    moved+=Math.hypot(dx,dy);
    pointers.set(event.pointerId,{x:event.clientX,y:event.clientY});
    if(pointers.size===2) {
      if(before>3) zoom(before/Math.max(pointerDistance(),3));
      return;
    }
    const tuning=settings[view];
    const orbit=view==='overview'||view==='follow';
    if(view==='overview'&&panMode) {
      const scale=tuning.range*.002;
      north.x-=dx*Math.cos(tuning.yaw)*scale+dy*Math.sin(tuning.yaw)*scale;
      north.z+=dx*Math.sin(tuning.yaw)*scale-dy*Math.cos(tuning.yaw)*scale;
      north.x=clamp(north.x,-275,275);
      north.z=clamp(north.z,-275,275);
    } else {
      tuning.yaw -= dx*(orbit?.0051:.0060);
      tuning.pitch = clamp(tuning.pitch+dy*(orbit?.0047:-.0043),orbit?.065:-1.22,orbit?1.50:1.13);
    }
  });
  function stopPointer(event) {
    if(event.type==='pointerup'&&moved<6&&pointers.size===1&&!dom.editor.hidden) pickObject(event.clientX,event.clientY);
    pointers.delete(event.pointerId);
    if(pointers.size===0) canvas.classList.remove('dragging');
  }
  canvas.addEventListener('pointerup',stopPointer);
  canvas.addEventListener('pointercancel',stopPointer);
  canvas.addEventListener('lostpointercapture',stopPointer);
  canvas.addEventListener('contextmenu',event=>event.preventDefault());
  canvas.addEventListener('wheel',event=>{
    event.preventDefault();
    const motion=event.deltaY*(event.deltaMode===1?15:event.deltaMode===2?210:1);
    zoom(Math.exp(clamp(motion,-195,195)*.00153));
  },{passive:false});
  window.addEventListener('keydown',event=>{
    if(event.target.matches('input,select,textarea,[contenteditable]')||event.ctrlKey||event.metaKey||event.altKey) return;
    const key=event.key.toLowerCase();
    if(['w','a','s','d'].includes(key)) activeKeys.add(key);
    if(event.repeat) return;
    if(key===' '&&!event.target.matches('button')) {
      event.preventDefault();
      togglePlay();
    }
    if(['1','2','3','4'].includes(key)) chooseView(['overview','follow','interior','platform'][Number(key)-1]);
    if(key==='r') resetCamera();
    if(key==='escape'&&!dom.editor.hidden) toggleEditor(false);
  });
  window.addEventListener('keyup',event=>activeKeys.delete(event.key.toLowerCase()));
  window.addEventListener('blur',()=>activeKeys.clear());
  document.addEventListener('visibilitychange',()=>{lastFrame=0;});
  for(const button of dom.viewButtons) button.addEventListener('click',()=>chooseView(button.dataset.view));
  for(const button of dom.rateButtons) button.addEventListener('click',()=>{
    speedFactor=Number(button.dataset.rate);
    for(const other of dom.rateButtons) other.setAttribute('aria-pressed',String(other===button));
  });
  dom.play.addEventListener('click',togglePlay);
  $('map-toggle').addEventListener('click',()=>setMapCollapsed(!mapCollapsed));
  const fullscreen=$('fullscreen');
  fullscreen.hidden=!document.fullscreenEnabled;
  if(!fullscreen.hidden) {
    fullscreen.addEventListener('click',async()=>{
      try {
        if(document.fullscreenElement) await document.exitFullscreen();
        else await document.documentElement.requestFullscreen();
      } catch(err) {
        fullscreen.title='当前浏览器限制全屏。';
      }
    });
    document.addEventListener('fullscreenchange',()=>{fullscreen.textContent=document.fullscreenElement?'退出全屏':'全屏';});
  }

  function refreshObjectEditor() {
    const {node,base}=objects[selectedObject];
    const values={ x:node.position.x-base.position.x, y:node.position.y-base.position.y,
      z:node.position.z-base.position.z, rotation:(node.rotation.y-base.rotation)*180/Math.PI,
      scale:node.scale.x/base.scale.x };
    for(const input of dom.transforms) input.value=String(Number(values[input.dataset.transform].toFixed(2)));
    highlight.setFromObject(node);
    highlight.visible=!dom.editor.hidden&&node.parent.visible;
  }
  function refreshObjectList() {
    const entries=objects.map((object,index)=>({object,index})).filter(entry=>entry.object.category===dom.category.value);
    if(!entries.some(entry=>entry.index===selectedObject)) selectedObject=entries[0].index;
    dom.pick.replaceChildren(...entries.map(({object,index})=>new Option(object.label,String(index))));
    dom.pick.value=String(selectedObject);
    refreshObjectEditor();
  }
  function toggleEditor(show) {
    dom.editor.hidden=!show;
    $('edit-toggle').setAttribute('aria-expanded',String(show));
    $('edit-toggle').setAttribute('aria-pressed',String(show));
    canvas.classList.toggle('picking',show);
    if(show) refreshObjectList();
    else highlight.visible=false;
  }
  $('edit-toggle').addEventListener('click',()=>toggleEditor(dom.editor.hidden));
  $('edit-close').addEventListener('click',()=>toggleEditor(false));
  dom.category.addEventListener('change',refreshObjectList);
  dom.pick.addEventListener('change',()=>{
    selectedObject=Number(dom.pick.value);
    refreshObjectEditor();
  });
  for(const input of dom.transforms) input.addEventListener('change',()=>{
    const {node,base}=objects[selectedObject];
    if(input.value!==''&&Number.isFinite(input.valueAsNumber)) {
      const value=clamp(input.valueAsNumber,Number(input.min),Number(input.max));
      const field=input.dataset.transform;
      if(field==='scale') node.scale.copy(base.scale).multiplyScalar(value);
      else if(field==='rotation') node.rotation.y=base.rotation+radians(value);
      else node.position[field]=base.position[field]+value;
    }
    refreshObjectEditor();
  });
  $('reset-object').addEventListener('click',()=>{
    const {node,base}=objects[selectedObject];
    node.position.copy(base.position);
    node.rotation.y=base.rotation;
    node.scale.copy(base.scale);
    refreshObjectEditor();
  });
  $('focus-object').addEventListener('click',()=>{
    const {node,size}=objects[selectedObject];
    node.getWorldPosition(north);
    north.y+=Math.min(1.65,size*.45);
    settings.overview.range=Math.max(5.4,size*2.2);
    settings.overview.pitch=.51;
    chooseView('overview');
  });

  if(window.matchMedia('(max-width: 570px)').matches) setMapCollapsed(true);
  else layoutMap();
  window.addEventListener('resize',resize);
  resize();
  chooseView('follow');
  const mapObserver = new ResizeObserver(layoutMap);
  mapObserver.observe($('map-layer'));
  canvas.addEventListener('webglcontextlost',event=>{
    event.preventDefault();
    $('fatal-detail').textContent='浏览器中断了 WebGL 渲染。请重试，或用新的浏览器标签打开这个 HTML。';
    $('fatal').hidden=false;
  });
  canvas.addEventListener('webglcontextrestored',()=>$('fatal').hidden=true);
  $('retry').addEventListener('click',()=>location.reload());

  globalThis.railwayWorld={
    scene, camera, renderer, stations, chooseView,
    objects:objects.map(({node,category,label})=>({node,category,label})),
    getState:()=>({
      view, selectedStation, speedFactor, paused, renderer:softwareMode?'canvas':'webgl2', time:simulatedTime, cycleDuration:loopTime,
      position:currentService.distance, trackLength:routeLength, speed:currentService.speed,
      doors:currentService.doors, status:currentService.status,
      next:currentService.next.name, station:currentService.station?.name||null
    })
  };
  draw(performance.now());
}

try {
  run();
} catch(error) {
  console.error(error);
  $('fatal-detail').textContent='请尝试用最新版 Chrome 或 Edge 重新打开这个 HTML。';
  $('fatal').hidden=false;
  $('retry').onclick=()=>location.reload();
}
})();

</script>
</body>
</html>
