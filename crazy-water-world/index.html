function beginFishing(){if(hook){toast('先把钩爪收回来，再放下鱼竿。');return;}currentPanel='fishing';openPanel('海面之下，看准时机','等浮标游进绿色水域时收竿；普通收竿也有鱼，精准收竿会遇见稀有朋友。',`<div class="fish-game"><div class="fish-visual">${fishSVG(17)}</div><p>潮水一直在动。<br>让白色浮标落在绿区，带回不一样的收获。</p><div class="fish-track"><i class="fish-green" style="left:${50-fishWidth()/2}%;width:${fishWidth()}%"></i><i class="fish-needle" id="fishNeedle"></i></div><button class="big-btn" data-action="reel">现在收竿 · 空格</button><div class="action-row"><button class="small-btn" data-action="fishbook">鱼类图鉴</button><button class="small-btn" data-close>先收好鱼竿</button></div></div>`);fishSession={start:performance.now(),pos:.5};}
function reel(){if(!fishSession)return;let perfect=Math.abs(fishSession.pos-.5)<=fishWidth()/200;fishSession=null;state.stats.fishing++;if(perfect)state.stats.fishPerfect++;let n=state.stats.fishing,good=state.stats.fishPerfect,max=perfect?(n>=24&&good>=8?24:n>=10?23:16):8;let pool=F.slice(0,max),missing=pool.filter(f=>!state.fish[f.id]);let f;if(perfect&&missing.length&&(good%3===0||Math.random()<(state.buddies.includes(4)?.83:.66)))f=pick(missing);else f=pick(pool);let isNew=!state.fish[f.id];state.fish[f.id]=(state.fish[f.id]||0)+1;let reward={food:perfect?4:2,shell:perfect?2:1};addRes(reward);checkAch();updateUI();save();sfx('collect');openPanel(perfect?'精准收竿，漂亮！':'鱼竿的另一头，也有收获',`${f.rarity} · ${isNew?'新图鉴':'已捕获 '+state.fish[f.id]+' 条'} · 绿区收竿更容易获得稀有鱼`, `<div class="hero-result">${fishSVG(f.id)}<h3>${f.name}</h3><p>${f.desc}<br>${costText(reward)}</p><div class="action-row"><button class="big-btn" data-action="fish">再抛一竿</button><button class="small-btn" data-action="fishbook">查看图鉴</button><button class="small-btn" data-close>回到甲板</button></div></div>`);}
function showFish(){fishSession=null;currentPanel='fishbook';openPanel('鱼类图鉴',`${Object.keys(state.fish).length} / 24 种 · 精准收竿 ${state.stats.fishPerfect} 次 · 传说彩虹鱼需要经验与好手感`, `<div class="info-note">普通收竿遇见浅海鱼。精准收竿解锁稀有与珍奇鱼；累计垂钓 24 次并精准收竿 8 次后，彩虹鱼进入海域。连续练习精准操作，会优先遇到尚未收集的种类。</div><div class="fish-grid">${F.map(f=>`<div class="fish-card ${state.fish[f.id]?'':'locked'} ${f.rarity==='传说'?'legend':''}"><span class="fish-count">${state.fish[f.id]?'×'+state.fish[f.id]:''}</span>${fishSVG(f.id)}<h4>${state.fish[f.id]?f.name:'尚未邂逅'}</h4><small>${f.rarity}${f.id===23?' · 彩虹鱼':''}</small></div>`).join('')}</div><div class="action-row"><button class="big-btn" data-action="fish">带上鱼竿出发</button></div>`);}
function showBuddies(){currentPanel='buddies';openPanel('这艘船，有了家人',`${state.buddies.length} / 7 位入住 · 继续打捞，留意漂来的浴缸 · 无需准备床位`, `<div class="buddy-grid">${buddies.map((b,i)=>`<article class="buddy-card ${state.buddies.includes(i)?'':'locked-buddy'}">${portrait(i)}<div><h3>${b.name}</h3><span class="role">${b.role}</span><p>“${state.buddies.includes(i)?b.line:'还在另一段海流上，继续打捞就会遇见。'}”</p><span class="badge">${state.buddies.includes(i)?b.bonus:'打捞 '+b.at+' 件后出现'}</span></div></article>`).join('')}</div>`);}
function showLetters(){currentPanel='letters';openPanel('漂流信箱',`${state.letters.length} / 16 封 · 沉船水域更容易找到绿色玻璃瓶`, `<div class="letters">${letters.map(([name],i)=>`<button class="letter ${state.letters.includes(i)?'':'locked'}" data-letter="${i}" ${state.letters.includes(i)?'':'disabled'}>${icon('mail')}<h4>${state.letters.includes(i)?name:'另一片海的故事'}</h4><small>NO. ${String(i+1).padStart(2,'0')}</small></button>`).join('')}</div>`);}

function showAchievements(){currentPanel='ach';openPanel('船长的勋章',`${state.ach.length} / 24 个成就 · 当前称号：${title()} · 每项成就赠送 3 贝壳`, `<div class="titlepath">${titles.map(([n,v])=>`<span class="${state.ach.length>=v?'earned':''}" title="需 ${v} 个成就">${n}</span>`).join('')}</div><div class="ach-grid">${ACH.map(([n,d],i)=>`<div class="ach-card ${state.ach.includes(i)?'done':''}">${icon(state.ach.includes(i)?'trophy':'star','medal')}<div><h4>${n}</h4><p>${d}${state.ach.includes(i)?' · 已达成':''}</p></div></div>`).join('')}</div>`);}
function showStock(){let r=rates();currentPanel='stock';openPanel('随船仓库','建造需要材料，远航消耗食物和清水。日常不会饥饿、口渴或损失进度。',`<div class="stat-grid"><div class="stat"><b>${state.stats.casts?Math.round(state.stats.hits/state.stats.casts*100):0}%</b><small>抛钩命中率</small></div><div class="stat"><b>${state.stats.perfect}</b><small>次精准抛钩</small></div><div class="stat"><b>${state.stats.bestCombo}</b><small>件单钩最高收获</small></div></div><div class="stock">${Object.keys(names).map(k=>`<div class="stock-item">${icon(k)}<h4>${names[k]}</h4><b>${fmt(state.res[k])}</b><p>自动生产 +${r[k].toFixed(1)} / 分钟</p></div>`).join('')}</div>`);}
function showVoyage(){currentPanel='voyage';let owned=has('boat');openPanel('有准备的远航','远航需探索小船与补给。选完航线立即结算，没有等待倒计时。', `<div class="hero-result"><img src="${thumbnail('boat')}" alt="探索小船"><h3>${owned?'准备好了，再驶远一点。':'先为远航，造一艘小船。'}</h3><p>${owned?'每次消耗清水 6、食物 6；不同目的地带回不同资源。<br>布局好净水与种植，才能稳定支持远航。':'建造探索小船需要 2 级钩爪图纸。<br>'+costText(byId.boat.cost)}</p>${owned?'<div class="action-row"><button class="big-btn" data-sail="supply">沙洲补给 · 木板 / 绳索</button><button class="big-btn" data-sail="wreck">沉船探查 · 金属 / 来信</button></div>':'<div class="action-row"><button class="big-btn" data-build="boat">建造探索小船</button><button class="small-btn" data-action="workshop">升级钩爪</button></div>'}</div>`);}
function sail(destination){if(!has('boat'))return;let cost={water:6,food:6};if(!pay(cost)){toast('这次远航需要清水 6、食物 6。钓鱼与生产可以补充；普通掌舵航行仍然免费。');return;}let mul=state.buddies.includes(6)?1.5:1,reward=destination==='wreck'?{metal:Math.round(7*mul),shell:Math.round(4*mul),rope:Math.round(3*mul)}:{wood:Math.round(9*mul),rope:Math.round(5*mul),plastic:Math.round(5*mul)};addRes(reward);let letter=null;if(destination==='wreck'){let unread=letters.map((_,i)=>i).filter(i=>!state.letters.includes(i));if(unread.length){letter=unread[0];state.letters.push(letter);}}state.stats.voyages++;if(!state.events.includes('voyage'))state.events.push('voyage');eventState={id:'voyage',elapsed:0};closePanel();toast('小船归航 · '+costText(reward)+(letter!==null?' · 新来信《'+letters[letter][0]+'》':''),true);checkAch();updateUI();save();}
function startEvent(id,automatic=false){if(id==='voyage'){showVoyage();return;}if(!automatic&&(state.lastEventSector??-3)+3>state.sector){toast('海上小事件随航程出现。再航行 '+((state.lastEventSector||0)+3-state.sector)+' 段，就有新的邂逅。');return;}state.lastEventSector=state.sector;eventState={id,elapsed:0};if(!state.events.includes(id))state.events.push(id);if(id==='shark'){addRes({wood:2,shell:1});toast('阿飞来串门，推来一小块浮木。它不伤木筏。',true);}if(id==='meteor'){state.night=true;addRes({joy:8});toast('流星掠过。许下一个愿望，幸福 +8。',true);}if(id==='storm'){if(state.field.items.length<7){let c=centerOfRaft();state.field.items.push({id:'storm-'+state.sector,type:'barrel',x:c[0]+3.8,z:c[2]+1.9,phase:1});}toast('阵雨带来一只木桶，需要你亲手捞回来。甲板很安全。',true);}if(id==='rainbow'){addRes({joy:8});state.night=false;toast('雨后彩虹，给这一天加一点颜色。幸福 +8。',true);}if(id==='gull'){addRes({shell:2});toast('海鸥歇脚，留下两枚小贝壳。',true);}if(id==='picnic'){addRes({joy:10});toast('甲板野餐开席啦，幸福 +10。',true);}checkAch();updateUI();save();}
function showEvents(){currentPanel='events';openPanel('海风日历','海上小事件随航程发生，每隔 3 个航段也可主动邂逅一次。',`<div class="info-note">事件会添一点故事，不会替你填满仓库。暴风雨只会带来可打捞的木桶，没有伤害或倒计时惩罚。</div>${events.map(e=>`<div class="event-card">${icon(e.icon)}<div><h4>${e.name}${state.events.includes(e.id)?' · 已经历':''}</h4><p>${e.desc}</p></div><button class="small-btn" data-event="${e.id}">${e.id==='voyage'?'准备远航':'邂逅'}</button></div>`).join('')}`);}
function showHelp(){currentPanel='help';openPanel('这次，亲自当船长','操作、选择与布局会改变收获。失手可以重试，不扣材料、不毁建筑。',`<div class="intro-points"><div>${icon('fish')}<h4>看路线，再出钩</h4><p>按住海面瞄准，绿区松手。<br>礁石会挡钩，重箱需升级。<br>点空甲板可以换站位。</p></div><div>${icon('boat')}<h4>选方向，不等刷新</h4><p>每段海流只有少量浮物。<br>木料、金属、宝箱分布不同。<br>随时掌舵，驶向下一段。</p></div><div>${icon('hammer')}<h4>让布局有意义</h4><p>种植箱靠净水器 +40%。<br>烧烤架靠种植箱 +25%。<br>风车让四邻建筑 +20%。</p></div></div><div class="info-note">钓鱼：白色浮标进入绿区时收竿，稀有鱼取决于手感与鱼竿等级。<br>远航：消耗食物与清水，选择目的地，立即带回定向资源与新故事。<br>键盘：空格按住瞄准 / 松开抛钩，方向键调整目标，WASD 换站位；B 建造，E 扩建，M 海图，U 工坊，F 钓鱼，I 仓库。滚轮缩放，右侧按钮转动视角。<br>保留自动存档、离线生产与全部收集。没有充值、联机、死亡、掉档或强制等待。</div><div class="action-row"><button class="big-btn" data-close>去试试第一钩</button></div>`);}
function showOrders(){currentPanel='orders';const orders=[{n:'阿禾的育苗补给',cost:{water:8},reward:{wood:4,rope:3},desc:'用稳定生产的清水，换一批扩建材料。'},{n:'大勇的午餐篮',cost:{food:8},reward:{metal:3,plastic:4},desc:'用钓鱼和料理攒下的食物，换回稀缺零件。'},{n:'修理匠的零件交换',cost:{metal:5,rope:3},reward:{wood:9,shell:3},desc:'多余的金属与绳索，也能变成扩建木料。'}];openPanel('漂流补给委托','每航段每份委托可完成一次。材料充裕时做交换，短缺时先保留给建造或远航。',`<div class="zone-grid">${orders.map((o,i)=>{let done=(state.orders||[]).includes(state.sector+'-'+i);return `<article class="zone-card"><small>补给交换 · ${done?'本航段已交付':'可选委托'}</small><h3>${o.n}</h3><p>${o.desc}<br>交付：${costText(o.cost)}<br>换取：${costText(o.reward)}</p><button class="big-btn" data-order="${i}" ${done?'disabled':''}>${done?'已交付':'交付补给'}</button></article>`;}).join('')}</div>`);}
function fillOrder(i){const specs=[[{water:8},{wood:4,rope:3}],[{food:8},{metal:3,plastic:4}],[{metal:5,rope:3},{wood:9,shell:3}]];if(!specs[i])return;let key=state.sector+'-'+i;if((state.orders||[]).includes(key))return;let[cost,reward]=specs[i];if(!pay(cost)){toast('委托需要 '+costText(cost)+'。先留给自己的小岛，也完全可以。');return;}addRes(reward);state.orders=(state.orders||[]).filter(v=>v.startsWith(state.sector+'-'));state.orders.push(key);toast('委托交付 · '+costText(reward),true);save();updateUI();showOrders();}
function showSettings(){currentPanel='settings';openPanel('航海设置','单文件 · 纯单机 · 所有模型和代码都在本页，不依赖网络',`<div class="settings-row"><div><h4>昼夜与海风</h4><p>天色由你决定，夜晚也能清楚操作。</p></div><button class="small-btn" data-action="light">切换到${state.night?'白天':'夜晚'}</button></div><div class="settings-row"><div><h4>自然音效</h4><p>轻柔海浪与抛钩、收获的声音。</p></div><button class="small-btn" data-action="sound">${state.sound?'已开启':'已关闭'}</button></div><div class="settings-row"><div><h4>减少动态</h4><p>放缓水面与漂浮，保留抛钩和钓鱼所需反馈。</p></div><button class="small-btn" data-action="motion">${state.reduced?'已开启':'已关闭'}</button></div><div class="settings-row"><div><h4>随身携带这座岛</h4><p>${storageOK?'当前浏览器自动存档正常。':'当前浏览器不允许自动存档，请手动导出。'}<br>更换浏览器或 HTML 存放位置前，可以导出备份。支持导入上一版存档。</p></div><div class="settings-actions"><button class="small-btn gold" data-action="export">导出存档</button><button class="small-btn" data-action="import">导入存档</button></div></div><div class="settings-row"><div><h4>操作与布局</h4><p>看准路线、换站位、升级工具，让操作与选择决定收获。</p></div><button class="small-btn" data-action="help">查看说明</button></div><div class="info-note" style="margin-top:19px">无充值、无联机、无死亡与资源损失惩罚。<br>建造即时完成，海流与远航即时切换；离线生产继续积累。<br>独立同人小游戏，非官方作品。</div>`);}
function exportSave(){settle();save();let url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='乘风木筏-存档-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('存档已导出。');}
async function importSave(file){if(!file)return;try{if(file.size>2e6)throw Error();let data=JSON.parse(await file.text());if(!validSave(data))throw Error();let incoming=normalize(data);openPanel('让熟悉的小岛靠岸','确认后替换当前进度。可先导出备份，也兼容第一版存档。',`<div class="hero-result">${icon('book')}<h3>${incoming.tiles.length} 块甲板，${incoming.buddies.length} 位伙伴。</h3><p>${Object.keys(incoming.fish).length} 种鱼 · ${incoming.letters.length} 封信<br>已有的资源、建筑与收藏都会保留。</p><div class="action-row"><button class="small-btn" data-action="export">先导出现有进度</button><button class="big-btn" id="confirmImport">使用这份存档</button><button class="small-btn" data-close>先不替换</button></div></div>`);$('confirmImport').onclick=()=>{state=incoming;hook=null;fishSession=null;aim=null;setMode(null);let secs=Math.max(0,(Date.now()-state.last)/1000);produce(secs);economicLast=Date.now();rebuild();if(!state.field)makeField(state.zone,false);fitFieldLayout();checkAch();updateUI();save();closePanel();toast('小岛已靠岸，进度与收藏完整保留。',true);};}catch{toast('文件不是有效存档，当前进度没有改变。');}$('importFile').value='';}
function toggleSound(){state.sound=!state.sound;if(state.sound){try{if(!audio){audio=new(window.AudioContext||window.webkitAudioContext)();let count=audio.sampleRate*3,buf=audio.createBuffer(1,count,audio.sampleRate),arr=buf.getChannelData(0),prev=0;for(let i=0;i<count;i++){prev=(prev+Math.random()*.055-.0275)*.985;arr[i]=prev*.5;}let src=audio.createBufferSource(),filter=audio.createBiquadFilter(),gain=audio.createGain();src.buffer=buf;src.loop=true;filter.type='lowpass';filter.frequency.value=550;gain.gain.value=.24;src.connect(filter);filter.connect(gain);gain.connect(audio.destination);src.start();}audio.resume();}catch{state.sound=false;toast('当前浏览器暂时无法开启音效。');}}else audio?.suspend();updateUI();save();if(currentPanel==='settings')showSettings();}
function sfx(type){if(!audio||!state.sound)return;let osc=audio.createOscillator(),gain=audio.createGain(),t=audio.currentTime;osc.frequency.setValueAtTime(type==='hook'?460:type==='collect'?710:360,t);osc.frequency.exponentialRampToValueAtTime(type==='hook'?260:820,t+.13);gain.gain.setValueAtTime(.045,t);gain.gain.exponentialRampToValueAtTime(.0001,t+.21);osc.connect(gain);gain.connect(audio.destination);osc.start();osc.stop(t+.22);}
function action(a){if(a==='build')showBuild();else if(a==='expand'){if(hook){toast('收回钩爪后再扩建甲板。');return;}closePanel();setMode(mode?.type==='expand'?null:{type:'expand'});}else if(a==='chart')showChart();else if(a==='workshop')showWorkshop();else if(a==='fish')beginFishing();else if(a==='reel')reel();else if(a==='fishbook')showFish();else if(a==='buddies')showBuddies();else if(a==='letters')showLetters();else if(a==='ach')showAchievements();else if(a==='events')showEvents();else if(a==='stock')showStock();else if(a==='voyage')showVoyage();else if(a==='settings')showSettings();else if(a==='orders')showOrders();else if(a==='help')showHelp();else if(a==='export')exportSave();else if(a==='import')$('importFile').click();else if(a==='sound')toggleSound();else if(a==='light'){state.night=!state.night;updateUI();save();if(currentPanel==='settings')showSettings();}else if(a==='motion'){state.reduced=!state.reduced;save();showSettings();}else if(a==='zoomIn'||a==='zoomOut'){viewZoom=clamp(viewZoom*(a==='zoomIn'?1.15:1/1.15),.72,1.7);updateCamera();}else if(a==='camera'){azimuth+=Math.PI/4;updateCamera();}}
$('dock').innerHTML=[['chart','boat','掌舵航行','M','primary'],['build','hammer','建造','B',''],['expand','expand','扩建','E',''],['fish','fish','钓鱼','F',''],['workshop','settings','工坊','U',''],['stock','chest','仓库','I','']].map(([a,i,n,key,c])=>`<button class="${c}" data-action="${a}">${icon(i)}${n}<kbd>${key}</kbd></button>`).join('');
$('sidenav').innerHTML=[['fishbook','fish','鱼类图鉴'],['buddies','people','海上伙伴'],['letters','mail','漂流来信'],['ach','trophy','船长勋章'],['events','sun','海风日历']].map(([a,i,n])=>`<button data-action="${a}" aria-label="${n}"><span class="tool">${icon(i)}</span><span>${n}</span></button>`).join('');
document.addEventListener('click',e=>{let el=e.target.closest('[data-action],[data-build],[data-cat],[data-zone],[data-upgrade],[data-letter],[data-event],[data-order],[data-sail],[data-move],[data-recycle],[data-close]');if(!el)return;let d=el.dataset;if('action'in d)action(d.action);else if('build'in d)selectBuild(d.build);else if('cat'in d)showBuild(d.cat);else if('zone'in d){if(makeField(+d.zone)){closePanel();setMode(null);if(state.sector%3===0)startEvent(pick(['shark','gull','storm','meteor','rainbow','picnic']),true);}}else if('upgrade'in d)upgrade(d.upgrade);else if('letter'in d)openLetter(+d.letter);else if('event'in d){if(d.event==='voyage')showVoyage();else{closePanel();startEvent(d.event);}}else if('order'in d)fillOrder(+d.order);else if('sail'in d)sail(d.sail);else if('move'in d){let[x,y]=d.move.split(',').map(Number),t=tile(x,y);closePanel();setMode({type:'move',id:t.b,from:{x,y}});}else if('recycle'in d){let[x,y]=d.recycle.split(',').map(Number),t=tile(x,y);if(t?.b){addRes(byId[t.b].cost);toast('收起了 '+byId[t.b].name+'，材料全额返还。');t.b=null;closePanel();updateUI();save();}}else if('close'in d)closePanel();});
$('soundBtn').onclick=toggleSound;$('lightBtn').onclick=()=>action('light');$('settingsBtn').onclick=showSettings;$('avatars').onclick=showBuddies;$('closePanel').onclick=closePanel;$('endMode').onclick=()=>setMode(null);$('overlay').onclick=e=>{if(e.target===$('overlay'))closePanel();};$('importFile').onchange=e=>importSave(e.target.files[0]);
// The workshop also contains resource exchange contracts rather than an unlimited gift button.
const originalWorkshop=showWorkshop;showWorkshop=function(){originalWorkshop();$('panelBody').insertAdjacentHTML('beforeend','<div class="action-row"><button class="small-btn" data-action="orders">查看漂流补给委托</button></div>');};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('overlay').classList.contains('open'))closePanel();else setMode(null);return;}if($('overlay').classList.contains('open')){if(e.code==='Space'&&fishSession){e.preventDefault();reel();return;}if(e.key==='Tab'){let list=[...$('overlay').querySelectorAll('button:not(:disabled),input')].filter(n=>n.offsetParent!==null),first=list[0],last=list.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}return;}if(e.ctrlKey||e.metaKey||e.altKey||['INPUT','TEXTAREA'].includes(e.target.tagName))return;let key=e.key.toLowerCase();if(e.code==='Space'){e.preventDefault();if(!e.repeat&&!hook&&!mode){aim={start:performance.now()};$('castbar').classList.add('visible');}return;}if(e.key.startsWith('Arrow')){e.preventDefault();pointer.x=clamp(pointer.x+(e.key==='ArrowLeft'?-18:e.key==='ArrowRight'?18:0),10,W-10);pointer.y=clamp(pointer.y+(e.key==='ArrowUp'?-18:e.key==='ArrowDown'?18:0),120,H-100);return;}if('wasd'.includes(key)&&key.length===1){let p=state.hero||{x:0,y:0},dx=key==='a'?-1:key==='d'?1:0,dy=key==='w'?-1:key==='s'?1:0,t=tile(p.x+dx,p.y+dy);if(t&&!t.b){state.hero={x:t.x,y:t.y};save();}return;}let keys={b:'build',e:'expand',m:'chart',u:'workshop',f:'fish',i:'stock'};if(keys[key]){e.preventDefault();action(keys[key]);}});
document.addEventListener('keyup',e=>{if(e.code==='Space'&&aim&&!aim.deck){e.preventDefault();let a=aim;aim=null;let p=.5+.5*Math.sin((performance.now()-a.start)/1000*4.8-Math.PI/2);fire(pointer,p>=.58&&p<=.81);$('castbar').classList.remove('visible');}});
let economicLast=Date.now(),saveTick=0;function settle(){let n=Date.now(),seconds=Math.max(0,(n-economicLast)/1000);economicLast=n;produce(seconds);state.stats.play+=Math.min(seconds,3);}
setInterval(()=>{settle();checkAch();if(!$('overlay').classList.contains('open'))updateUI();if(++saveTick%5===0)save();},1000);
window.addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{settle();save();if(document.hidden){aim=null;$('castbar').classList.remove('visible');}});window.addEventListener('pagehide',()=>{settle();save();});window.addEventListener('pageshow',()=>{settle();updateUI();});
try{renderer=createRenderer(world);if(!renderer)throw Error('WebGL');}catch(e){console.error('3D renderer:',e.message);$('hints').innerHTML='<h2>浏览器的 3D 加速没有开启</h2><p>请使用支持 WebGL 的浏览器，并开启硬件加速后重新打开。</p>';}
rebuild();resize();if(!state.field)makeField(state.zone,false);state.sound=false;checkAch();updateUI();save();if(renderer)requestAnimationFrame(tick);
if(offline){let mins=Math.floor(offline.secs/60),label=mins<60?mins+' 分钟':(mins/60).toFixed(1)+' 小时';openPanel('离线时，工坊也没停','你离开了 '+label+'。资源来自已有建筑与布局加成。',`<div class="hero-result">${icon('windmill')}<h3>积累带回来，海还等你去闯。</h3><p>${Object.entries(offline.inc).filter(([k,n])=>n>=1).map(([k,n])=>names[k]+' +'+fmt(n)).join('　')||'阳光已经晒暖甲板。'}</p><div class="action-row"><button class="big-btn" data-close>收下，继续航行</button></div></div>`);offline=null;}else if(!state.intro){state.intro=true;save();showHelp();}
window.RaftWorld={version:2,counts:{buildings:B.length,fish:F.length,buddies:buddies.length,letters:letters.length,achievements:ACH.length,zones:ZONES.length},validateSave:validSave};
})();
