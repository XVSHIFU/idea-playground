window.addEventListener('pointermove',e=>{if(drag){moveDrag(e);return;}if(e.target!==renderer.domElement)return;hoverSlot=slotAt(groundPoint(e.clientX,e.clientY));if(press&&Math.hypot(e.clientX-press.x,e.clientY-press.y)>8){press.moved=true;clearTimeout(longPressTimer);}});
window.addEventListener('pointerup',e=>{clearTimeout(longPressTimer);if(drag){endDrag(e);press=null;return;}if(!press)return;const p=press;press=null;if(p.moved||p.deleted||e.button!==0)return;const n=pickNode(e.clientX,e.clientY);if(n?.type==='source'){beginSimulation([n.id]);return;}if(n){setStatus({delay:'延迟蘑菇：信号停留一整拍后继续前行。',invert:'反相苔藓：当前拍没有输入，下一拍发射；有输入则静默。',and:'与门藤：两拍内，两个不同源头从不同邻居抵达才会通过。',target:'目标花苞：收到任何信号就会开花。'}[n.type]);return;}if(selected&&!won)placeNode(selected,slotAt(groundPoint(e.clientX,e.clientY)));});
window.addEventListener('pointercancel',()=>{clearTimeout(longPressTimer);cancelDrag();press=null;});renderer.domElement.addEventListener('pointerdown',e=>{if(e.button!==0)return;press={x:e.clientX,y:e.clientY,moved:false,deleted:false};if(e.pointerType!=='mouse'){const n=pickNode(e.clientX,e.clientY);longPressTimer=setTimeout(()=>{if(press&&!press.moved){press.deleted=true;removeNode(n);}},550);}});renderer.domElement.addEventListener('pointerleave',()=>{if(!drag)hoverSlot=-1;});renderer.domElement.addEventListener('contextmenu',e=>{e.preventDefault();removeNode(pickNode(e.clientX,e.clientY));});window.addEventListener('blur',()=>{clearTimeout(longPressTimer);cancelDrag();press=null;});
// 控制面板与唯一浮层
function showOverlay(html){$('#modal').innerHTML=html;$('#overlay').hidden=false;}function hideOverlay(){$('#overlay').hidden=true;}
$('#help').onclick=()=>{showOverlay('<div class="stamp">A LITTLE GUIDE</div><h1>种下逻辑。<br>等待花开。</h1><p>拖动植物到苔藓印记上。上下左右相邻的植物自动长出藤蔓；对角不连接。</p><ul><li><b>脉冲花：</b>点击发射；右上角按钮同时触发所有源头。</li><li><b>延迟蘑菇：</b>收到信号后等待一拍，再发送。</li><li><b>反相苔藓：</b>本拍没有输入则下一拍发送，有输入则静默。</li><li><b>与门藤：</b>两个不同源头，从不同入口在两拍窗口内到达才输出。同源分叉不算双源。</li><li><b>白色花苞：</b>收到信号开花；所有花苞开放即通关。</li></ul><p>单颗信号不重复经过访问过的节点。每轮观察 24 拍，可无限重试。原有植物不能删除，新植物可右键或长按删除。</p><p>空格重置 · R 更换装饰 · 拖动空地旋转<br>先选卡片再点空地，也可以快捷种植。</p><button id="closeHelp" class="primary" style="width:100%">回到花园 →</button>');$('#closeHelp').onclick=hideOverlay;};
$('#overlay').addEventListener('pointerdown',e=>{if(e.target===$('#overlay')&&!won)hideOverlay();});$('#fold').onclick=()=>$('#controls').classList.toggle('collapsed');if(innerWidth<700)$('#controls').classList.add('collapsed');
$('#outline').onclick=()=>{outlinesEnabled=!outlinesEnabled;outlines.forEach(o=>o.visible=outlinesEnabled);if(drag)drag.mesh.children.forEach(o=>o.visible=false);$('#outline').textContent='描边：'+(outlinesEnabled?'开':'关');$('#outline').setAttribute('aria-pressed',outlinesEnabled);};$('#rotate').onclick=()=>{controls.autoRotate=!controls.autoRotate;$('#rotate').textContent=controls.autoRotate?'缓慢自转':'固定视角';$('#rotate').setAttribute('aria-pressed',controls.autoRotate);};$('#sound').onclick=()=>{audioEnabled=!audioEnabled;if(audioEnabled)unlockAudio();$('#sound').textContent='音效：'+(audioEnabled?'开':'关');$('#sound').setAttribute('aria-pressed',audioEnabled);};$('#sun').oninput=e=>{const t=+e.target.value/100;sun.position.set(Math.cos(t*Math.PI)*9,4+Math.sin(t*Math.PI)*8,5);sun.color.setHSL(.09+t*.025,.16+Math.abs(t-.5)*.32,.92);$('#sunText').textContent=t<.25?'清晨':t>.75?'暮色':'午后';};$('#speed').oninput=e=>{simSpeed=+e.target.value;$('#speedText').textContent=simSpeed.toFixed(1)+'×';};$('#run').onclick=()=>beginSimulation([...nodes.values()].filter(n=>n.type==='source').map(n=>n.id));$('#reset').onclick=()=>loadLevel(levelIndex);
function reseed(){cancelDrag();stopSimulation(true);hideOverlay();seed=(Math.imul(seed,1664525)+1013904223)>>>0;buildTerrain();buildDecor();for(const n of nodes.values()){n.motion.target.copy(slotPosition(n.id));n.motion.p.copy(n.motion.target);}refreshEdges();introTime=0;setStatus('花园装饰已更新，植物电路保留。SEED / '+seed);}$('#reseed').onclick=reseed;
LEVELS.forEach((l,i)=>{const b=document.createElement('button');b.className='level-dot';b.title=l.name;b.setAttribute('aria-label',l.name);b.onclick=()=>loadLevel(i);$('#levelDots').appendChild(b);});window.addEventListener('keydown',e=>{if(document.activeElement?.tagName==='INPUT')return;if(e.code==='Space'&&document.activeElement?.tagName!=='BUTTON'){e.preventDefault();loadLevel(levelIndex);}if(e.key.toLowerCase()==='r')reseed();if(e.key==='Escape'){if(!won)hideOverlay();cancelDrag();selected=null;document.querySelectorAll('.card').forEach(b=>b.classList.remove('selected'));}});
// 弹簧放置；命中反馈直接由 tick 驱动
function spring(p,v,target,dt){v.x+=(target.x-p.x)*420*dt;v.y+=(target.y-p.y)*420*dt;v.z+=(target.z-p.z)*420*dt;v.multiplyScalar(Math.exp(-25*dt));p.addScaledVector(v,dt);}
flowerPetals.frustumCulled=flowerCenters.frustumCulled=false;
function animateNodes(dt){let petals=0,centers=0;for(const n of nodes.values()){const m=n.motion,age=worldTime-n.state.hit;m.age+=dt;if(m.age<1.4){spring(m.p,m.v,m.target,dt);if(m.age>=.18&&!m.dusted){m.dusted=true;puff(m.target.clone().add(new Vector3(0,.05,0)));}}else m.p.copy(m.target);n.mesh.position.copy(m.p);const squash=age>=0&&age<.24?Math.sin(Math.min(1,age/.08)*Math.PI/2)*Math.exp(-age*12)*.24:0,stretch=m.age<.45?Math.sin(m.age*23)*Math.exp(-m.age*8)*.16:0;n.mesh.scale.set(1+squash*.45-stretch*.5,1-squash+stretch,1+squash*.45-stretch*.5);if(n.type==='invert')n.mesh.material=worldTime-n.state.grey<.23?greyMaterial:colored;if(n.type==='target'&&n.state.lit){n.state.bloom=Math.min(1,n.state.bloom+dt*3.5);const b=1-Math.pow(1-n.state.bloom,3);for(let j=0;j<5;j++){const a=j*Math.PI*2/5;dummy.position.set(m.target.x+Math.cos(a)*.28*b,m.target.y+.53,m.target.z+Math.sin(a)*.28*b);dummy.rotation.set(0,-a,Math.PI*.25*b);dummy.scale.set(1.4*b,.35+.2*(1-b),.85*b);dummy.updateMatrix();flowerPetals.setMatrixAt(petals++,dummy.matrix);}dummy.position.copy(m.target).add(new Vector3(0,.57,0));dummy.rotation.set(0,0,0);dummy.scale.setScalar(b);dummy.updateMatrix();flowerCenters.setMatrixAt(centers++,dummy.matrix);}}flowerPetals.count=petals;flowerCenters.count=centers;if(petals)flowerPetals.instanceMatrix.needsUpdate=true;if(centers)flowerCenters.instanceMatrix.needsUpdate=true;}
function animateSignals(){const now=sim.tick+sim.phase;travelers=travelers.filter(t=>now-t.start<1);let count=0;for(const t of travelers){let p=THREE.MathUtils.clamp(now-t.start,0,1);if(t.reverse)p=1-p;t.edge.curve.getPointAt(p,signalScratch);dummy.position.copy(signalScratch);dummy.position.y+=.052;dummy.rotation.set(p*8,0,0);dummy.scale.setScalar(1);dummy.updateMatrix();signalMesh.setMatrixAt(count++,dummy.matrix);}signalMesh.count=count;if(count)signalMesh.instanceMatrix.needsUpdate=true;}
function animatePointer(dt){const wanted=hoverSlot>=0&&!won;hoverAlpha+=((wanted?1:0)-hoverAlpha)*(1-Math.exp(-dt/.045));cursor.visible=hoverAlpha>.01;if(wanted){cursor.position.copy(slotPosition(hoverSlot));cursor.position.y+=.025;cursor.scale.setScalar(1+Math.sin(worldTime*4)*.035);cursorMaterial.color.setHex(nodes.has(hoverSlot)&&drag?0x8d8b7f:C.red);}cursorMaterial.opacity=hoverAlpha*.55;if(drag){ghostShadow.position.set(drag.mesh.position.x,height(drag.mesh.position.x,drag.mesh.position.z)+.02,drag.mesh.position.z);const s=Math.max(.45,1-(drag.mesh.position.y-ghostShadow.position.y)*.45);ghostShadow.scale.set(s,.012,s);}}
let lastFrame=performance.now(),showedWin=false,hidden=false;function resize(){const w=innerWidth,h=innerHeight,a=w/h,frustum=a<1.2?13.2:11.8;renderer.setSize(w,h);camera.top=frustum/2;camera.bottom=-frustum/2;camera.left=-frustum*a/2;camera.right=frustum*a/2;if(a<.8){camera.left=-5.35;camera.right=5.35;camera.top=10.7/a/2;camera.bottom=-10.7/a/2;}camera.updateProjectionMatrix();}window.addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{hidden=document.hidden;lastFrame=performance.now();});
buildTerrain();buildDecor();loadLevel(0);resize();
function frame(now){requestAnimationFrame(frame);if(hidden)return;const dt=Math.min((now-lastFrame)/1000,.033);lastFrame=now;worldTime+=dt;introTime+=dt;const t=Math.min(1,introTime/1.05);garden.position.y=-1.6*Math.exp(-t*7)*Math.cos(t*5)*(1-t);for(const a of decorAnimations){const u=Math.max(0,Math.min(1,(introTime-a.start)/.65)),s=u===1?1:Math.max(.001,1-Math.exp(-u*5.5)*Math.cos(u*7));a.mesh.scale.set(1,s,1);}if(sim.running&&$('#overlay').hidden){sim.phase+=dt*simSpeed/TICK;while(sim.phase>=1&&sim.running){sim.phase-=1;sim.tick++;processTick();}}animateNodes(dt);animateParticles(dt);animateSignals();animatePointer(dt);if(won){const u=Math.min(1,(worldTime-winAt)/.3);camera.zoom=1+.075*(1-Math.pow(1-u,3));if(worldTime-winAt>.82&&!showedWin){showedWin=true;showWin();}}else{showedWin=false;camera.zoom+=(1-camera.zoom)*(1-Math.exp(-dt*10));}camera.updateProjectionMatrix();controls.update();renderer.render(scene,camera);}requestAnimationFrame(frame);
}
