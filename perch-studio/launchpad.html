function aHome(){let i=current(),live=data.find(x=>x.status==='running');return `<div class="a-heading between"><div><div class="micro">YOUR TOOLS. YOUR RHYTHM.</div><h1>准备好了，就开始。</h1><p>每一个助手，都在熟悉的位置等你。</p></div><button class="btn" data-act="new">${I('plus')} 新建环境</button></div><section class="a-launch"><div class="a-feature"><div class="copy"><div class="flex"><span class="pill accent">上次使用</span><span class="micro">${i.engine} WORKSPACE</span></div><h2>${esc(i.name)}</h2><p>${esc(i.purpose)}</p><div class="launchline"><button class="btn solid" data-launch="${i.id}">${I(i.status==='running'?'external':i.status==='error'?'alert':'play')}${i.status==='running'?'打开工作台':i.status==='error'?'检查并修复':'启动工作台'}</button><span class="small muted hide-small">${i.web}<br>在浏览器中打开</span></div></div><div class="a-orbit">${orbital()}</div></div><aside class="a-monitor"><div class="between"><h3>此刻正在运行</h3><span class="a-live"><span class="dot"></span>LIVE</span></div>${live?`<div class="a-mini">${logo(live.engine)}<div><h3>${esc(live.name)}</h3><p class="sub">${live.web}</p></div></div><div class="a-wave" aria-hidden="true">${[7,10,18,12,26,14,8,17,29,12,10,22,16,8,18,13,25,9,5,13,22,10,14,7].map(h=>`<i style="height:${h}px"></i>`).join('')}</div><div class="between small muted" style="margin-top:10px"><span>本机服务 · 演示状态</span><span>运行中</span></div><button class="text-btn" data-launch="${live.id}">回到工作台 ${I('arrow')}</button>`:'<p style="margin-top:28px">还没有运行中的环境。</p><div class="a-wave"></div><p class="small">启动后，即使关闭网页，环境仍会保留。</p>'}</aside></section><div class="a-grid"><section><div class="section-title" style="margin-top:0"><h2>我的工作环境 <span class="muted small">${data.length}</span></h2><div class="flex">${['全部','运行中','需要处理'].map(t=>`<button class="filter ${S.filter===t?'on':''}" data-filter="${t}">${t}</button>`).join('')}</div></div><div class="a-list">${filtered().map(aRow).join('')||empty()}</div><p class="small muted" style="margin-top:15px">${I('shield')} 独立配置，互不打扰。新能力可以先在试验环境里尝试。</p></section>${aInspector(i)}</div><div class="a-bottom"><button class="a-promo" data-go="discover"><div class="mini-art">${packArt('developer')}</div><div class="grow"><h3>从一个好组合开始</h3><p>精选能力清单，少一点配置，多一点创造。</p></div>${I('arrow')}</button><button class="a-promo" data-act="snapshots"><div class="mini-art">${orbital()}</div><div class="grow"><h3>回到好用的时候</h3><p>${snapshots.length} 个恢复点，为下一次尝试留好退路。</p></div>${I('arrow')}</button></div>`}
function aRow(i){return `<div class="row ${S.selected===i.id?'selected':''}"><button class="flex grow" data-select="${i.id}">${logo(i.engine)}<span class="grow"><span class="select-name">${esc(i.name)}</span><span class="sub" style="display:block">${i.engine} · ${i.count} 个扩展 · ${esc(i.project)}</span></span></button>${status(i)}<button class="icon-btn" data-launch="${i.id}" title="${i.status==='error'?'修复':i.status==='running'?'打开':'启动'}${esc(i.name)}">${I(i.status==='error'?'alert':i.status==='running'?'external':'play')}</button></div>`}
function aInspector(i){return `<aside class="a-detail"><div class="between"><span class="micro">SELECTED ENVIRONMENT</span><button class="icon-btn" data-act="inspect" title="查看详情">${I('external')}</button></div><h2>${esc(i.name)}</h2><p class="small">${esc(i.purpose)}</p><div style="margin-top:17px">${[['引擎',i.version],['工作台',i.web],['扩展',i.count+' 个 · 实例独立'],['版本策略','固定组合']].map(([a,b])=>`<div class="fact"><span>${a}</span><span>${b}</span></div>`).join('')}</div>${i.status==='error'?'<div class="notice">'+I('alert')+'示例扩展缺少依赖，可以禁用后重试。</div>':''}<div class="detail-btns"><button class="btn" data-act="snapshot">${I('clock')} 保存恢复点</button><button class="btn" data-act="inspect">${I('sliders')} 管理</button></div></aside>`}
function aLibrary(){return `<div class="a-heading between"><div><div class="micro">ENVIRONMENT LIBRARY</div><h1>你的工作方式，在这里。</h1><p>选择环境，检查配置，再继续工作。</p></div>${btn('新建环境','new',true,'plus')}</div><div class="search-box">${I('search')}<input data-search placeholder="搜索环境、引擎或项目" value="${esc(S.q)}" aria-label="搜索环境"></div><div class="a-grid"><div class="a-list">${filtered().map(aRow).join('')||empty()}</div>${aInspector(current())}</div>`}
function aDiscover(){return `<div class="a-heading"><div class="micro">START WITH SOMETHING GOOD</div><h1>好工具，也需要好搭配。</h1><p>以下为示例整合包。选择后会创建新的独立环境。</p></div><div class="a-collection">${packs.slice(0,3).map(p=>`<button class="pack" data-pack="${p.id}"><div class="art">${packArt(p.id)}</div><div class="body"><div class="micro">${p.en}</div><h2 style="margin-top:10px">${p.name}</h2><p>${p.desc}</p><div class="between"><span class="pill">${p.engine} · ${p.list.length} 项能力</span>${I('arrow')}</div></div></button>`).join('')}</div><div class="row" style="margin-top:25px"><div class="grow"><h3>已经有一份组合清单？</h3><p class="sub">导入本原型导出的 JSON 清单，创建独立环境。</p></div>${btn('导入组合','import',false,'download')}</div>`}
function renderB(){return `<div class="b-app"><aside class="b-sidebar">${brand()}<button class="b-nav" data-act="search" title="搜索">${I('search')}<span class="grow">快速查找</span><kbd class="key hide-small">⌘ K</kbd></button><button class="b-nav ${S.page==='home'?'on':''}" data-go="home" title="项目空间">${I('layers')}<span>项目空间</span></button><button class="b-nav ${S.page==='all'?'on':''}" data-go="all" title="所有环境">${I('box')}<span>所有环境</span></button><button class="b-nav ${S.page==='history'?'on':''}" data-go="history" title="活动记录">${I('clock')}<span>活动记录</span></button><div class="b-label">PROJECTS <button class="text-btn" style="float:right" data-act="new" title="新建项目环境">+</button></div>${data.map((i,n)=>`<button class="b-nav ${S.selected===i.id&&S.page==='home'?'on':''}" data-project="${i.id}" title="${esc(i.project)}"><i class="project-dot ${n===1?'orange':n===2?'purple':''}"></i><span>${esc(i.project)}</span></button>`).join('')}<div class="b-label">RESOURCES</div><button class="b-nav" data-act="catalog" title="扩展仓库">${I('puzzle')}<span>扩展仓库</span></button><button class="b-nav" data-act="snapshots" title="恢复中心">${I('shield')}<span>恢复中心</span></button><div class="b-sidebar-bottom"><button class="b-nav" data-act="theme" title="切换外观">${I('moon')}<span>切换外观</span></button><button class="b-nav" data-act="settings" title="设置">${I('settings')}<span>设置</span></button><div class="small muted" style="padding:13px 11px 0">${I('terminal')} 本机 · Windows</div></div></aside><main class="b-main"><header class="b-top"><div class="b-crumb">${I('folder')}<span>个人空间 /</span><b>${S.page==='home'?esc(current().project):S.page==='all'?'所有环境':'活动记录'}</b></div><div class="flex"><span class="pill hide-small">交互原型 B</span><button class="icon-btn" data-act="search" title="搜索">${I('search')}</button></div></header><div class="b-content screen">${S.page==='home'?bProject():S.page==='all'?bAll():activity()}${foot()}</div><div class="b-statusbar"><span>● 本机连接　 /　 ${data.filter(i=>i.status==='running').length} 个实例运行中</span><span>引擎与前端固定组合　 ·　 演示数据</span></div></main></div>`}
function bProject(){let i=current();return `<div class="b-heading"><div><div class="flex" style="margin-bottom:7px"><span class="micro">PROJECT WORKSPACE</span>${status(i)}</div><h1>${esc(i.project)}</h1><p>${esc(i.purpose)} <span class="hide-small">· ${esc(i.path)}</span></p></div><div class="flex"><button class="btn" data-act="clone">${I('copy')} 克隆环境</button><button class="btn primary" data-launch="${i.id}">${I(i.status==='running'?'external':'play')}${i.status==='running'?'打开工作台':i.status==='error'?'诊断问题':'启动环境'}</button></div></div><div class="tabs">${['环境','扩展','恢复点','活动'].map(t=>`<button class="${S.tab===t?'on':''}" data-tab="${t}">${t}</button>`).join('')}</div><div class="b-body"><section>${S.tab==='环境'?bEnvironment(i):S.tab==='扩展'?bExtensions(i):S.tab==='恢复点'?snapshotRows(i.id):activity(false)}<div class="b-console"><div class="b-console-head"><span>${I('terminal')} 运行日志</span><button class="text-btn" data-act="logs">展开 ${I('external')}</button></div><pre><span style="color:var(--muted)">14:32:01</span>  读取固定版本清单 … 完成\n<span style="color:var(--muted)">14:32:02</span>  ${i.status==='error'?'[ERROR] 示例插件 research-helper 缺少依赖':'[OK] 运行环境与插件检查通过'}\n<span style="color:var(--muted)">14:32:03</span>  <span style="color:${i.status==='error'?'var(--warn)':'var(--green)'}">${i.status==='error'?'启动已中止 · 原有数据保留':i.status==='running'?'工作台已就绪 · 本机服务运行中':'等待启动 · 将在默认浏览器中打开'}</span></pre></div></section><aside class="b-inspector"><div class="between"><h3>环境信息</h3>${I('sliders')}</div>${[['名称',i.name],['引擎',i.engine],['工作台',i.web],['扩展',i.count+' 项'],['分支',i.branch]].map(([a,b])=>`<div class="fact"><span>${a}</span><span>${esc(b)}</span></div>`).join('')}<div class="mini-title">PROVIDERS / 可选模型接入</div><div class="avatar-row">${logo('DSH')}${logo('Claude')}${logo('OpenAI')}</div><p class="small" style="margin-top:9px">品牌仅展示；此原型不保存密钥。</p><div class="mini-title">PRE-FLIGHT / 启动检查</div>${['运行环境已准备','版本组合已锁定','独立目录已分配'].map(t=>`<div class="b-check">${I('check')}${t}</div>`).join('')}<div class="b-check">${I(i.status==='error'?'alert':'check')}${i.status==='error'?'1 个扩展需要处理':'扩展依赖已就绪'}</div><button class="btn" data-act="snapshot">${I('clock')} 保存恢复点</button><button class="btn ghost" data-act="export">${I('download')} 导出环境清单</button></aside></div>`}
function bEnvironment(i){return `<div class="b-section"><div class="b-section-title"><h2>环境配置</h2><button class="text-btn" data-act="compare">比较组合 ${I('layers')}</button></div><div class="b-environments"><button class="b-env active" data-act="inspect"><span class="choose"></span><div class="envlabel">CURRENT / 当前环境</div><div class="flex">${logo(i.engine)}<span class="env-name">${esc(i.name)}</span></div><p>${i.version} · ${i.count} 项扩展</p><div class="branch">${I('branch')}${i.branch}<span class="pill accent" style="margin-left:auto">已锁定</span></div></button><button class="b-env" data-act="clone"><div class="envlabel">SANDBOX / 从当前组合开始</div><div class="flex"><span class="brand-icon">${I('plus')}</span><span class="env-name">创建试验环境</span></div><p>复制配置与扩展，独立尝试新能力。</p><div class="branch">${I('branch')}experiment<span style="margin-left:auto">${I('arrow')}</span></div></button></div></div>${i.status==='error'?`<div class="notice">${I('alert')}<div class="grow"><b>扩展依赖检查未通过</b><p>禁用示例异常扩展，或从恢复点还原。</p></div><button class="text-btn" data-launch="${i.id}">处理 →</button></div>`:''}<div class="b-section"><div class="b-section-title"><h2>一个可重建的版本组合</h2><span class="pill">清单模式</span></div><div class="b-flow"><div class="flow-node">${logo('terminal')}<span>Node.js<br><small class="muted">运行环境</small></span></div>${I('chevron')}<div class="flow-node">${logo(i.engine)}<span>${i.engine}<br><small class="muted">引擎</small></span></div>${I('chevron')}<div class="flow-node">${logo('globe')}<span>${i.engine==='Pi'?'Pi Web':'DSH Web'}<br><small class="muted">工作台</small></span></div>${I('chevron')}<div class="flow-node">${logo('puzzle')}<span>${i.count} 项扩展<br><small class="muted">独立安装</small></span></div></div><table class="b-table"><thead><tr><th>组件</th><th>固定版本 / 组合</th><th>范围</th><th>状态</th></tr></thead><tbody><tr><td>${i.engine} 引擎</td><td>${i.version}</td><td>实例</td><td><span class="pill good">已准备</span></td></tr><tr><td>Web 工作台</td><td>${i.web}</td><td>实例</td><td><span class="pill good">已准备</span></td></tr><tr><td>项目规范</td><td>本地示例</td><td>项目</td><td><span class="pill good">启用</span></td></tr><tr><td>扩展依赖</td><td>按清单重建</td><td>实例</td><td><span class="pill ${i.status==='error'?'warn':'good'}">${i.status==='error'?'待处理':'已准备'}</span></td></tr></tbody></table></div>`}
function bExtensions(i){return `<div class="b-section-title" style="margin-top:24px"><h2>当前实例的能力</h2><button class="btn sm" data-act="catalog">${I('plus')} 添加扩展</button></div>${resources.filter(r=>r.engine==='通用'||r.engine===i.engine).map(r=>`<div class="row">${logo(r.icon)}<div class="grow"><h3>${r.name}</h3><p class="sub">${r.type} · ${r.url?'GitHub 来源':'本地示例'}</p></div><button class="switch ${extensions[i.id+':'+r.id]===false?'':'on'}" role="switch" aria-label="启用${r.name}" aria-checked="${extensions[i.id+':'+r.id]!==false}" data-toggle="${r.id}"></button></div>`).join('')}`}
function bAll(){return `<div class="b-heading"><div><div class="micro">ALL ENVIRONMENTS</div><h1>所有环境</h1><p>按项目组织，让稳定工作与实验互不干扰。</p></div>${btn('新建项目环境','new',true,'plus')}</div><div class="search-box">${I('search')}<input data-search value="${esc(S.q)}" placeholder="搜索项目或环境" aria-label="搜索项目"></div><div class="b-project-list">${filtered().map(i=>`<div class="row"><button class="flex grow" data-project="${i.id}">${logo(i.engine)}<span class="grow"><strong>${esc(i.project)}</strong><span class="sub" style="display:block">${esc(i.name)} · ${i.version}</span></span></button>${status(i)}<button class="btn sm" data-launch="${i.id}">${i.status==='running'?'打开':i.status==='error'?'处理':'启动'}</button></div>`).join('')||empty()}</div>`}
function renderC(){return `<header class="c-top">${brand()}<nav>${[['discover','发现'],['resources','扩展'],['library','我的空间'],['favorites','收藏']].map(([id,t])=>`<button data-go="${id}" class="${S.page===id?'on':''}">${t}</button>`).join('')}</nav><div class="right"><span class="screen-note hide-small">BUILD YOUR OWN WAY</span>${topTools()}</div></header><main class="c-main screen">${['discover','resources','favorites'].includes(S.page)?`<div class="c-layout"><section>${S.page==='discover'?cDiscover():S.page==='resources'?cResources():cFavorites()}</section>${cBuilder()}</div>`:cLibrary()}${foot()}</main><div class="c-dock"><div class="mini">${logo(S.engine)}${logo('puzzle')}</div><div class="grow"><div class="label">我的组合 <span class="muted">/ ${S.engine}</span></div><p class="small">${S.basket.length} 项能力 · 独立环境</p></div><button class="btn ghost sm" data-act="buildReview">检查清单</button><button class="btn primary sm" data-act="build">创建实例 ${I('arrow')}</button></div>`}
function cDiscover(){let list=packs.filter(p=>(S.category==='全部'||p.category===S.category)&&(p.name+p.desc+p.engine).toLowerCase().includes(S.q.toLowerCase()));return `<div class="c-editorial"><div class="copy"><div class="micro">COLLECTION 001 / THE STARTER SERIES</div><h1>好能力，<br>组合出新可能。</h1><p>挑选、搭配，打造真正顺手的 Agent。</p><button class="btn" data-pack="developer">探索开发者组合 ${I('arrow')}</button></div><div class="art">${packArt('explorer')}</div></div><div class="c-searchline"><div class="search-box">${I('search')}<input data-search value="${esc(S.q)}" placeholder="你想用 Agent 做什么？" aria-label="搜索整合包"></div><button class="btn" data-act="import">${I('download')}<span class="hide-small">导入清单</span></button></div><div class="c-filters">${['全部','开发','研究','轻量','探索'].map(t=>`<button class="${S.category===t?'on':''}" data-category="${t}">${t}</button>`).join('')}</div><div class="section-title"><h2>精选起步组合</h2><span class="small muted">示例目录 · ${list.length} 个组合</span></div><div class="c-pack-grid">${list.map(cPack).join('')}</div>${!list.length?empty():''}`}
function cPack(p){return `<article class="c-pack"><button class="art" style="width:100%;padding:0" data-pack="${p.id}" aria-label="查看${p.name}"><span class="mini-tag">${p.en}</span>${packArt(p.id)}</button><div class="body"><div class="between"><button data-pack="${p.id}" style="padding:0"><h3>${p.name}</h3></button><button class="icon-btn" data-favorite="${p.id}" title="${favorites.includes(p.id)?'取消收藏':'收藏'}${p.name}" style="color:${favorites.includes(p.id)?'var(--accent)':'var(--muted)'}">${I('heart')}</button></div><p>${p.desc}</p><div class="card-bottom"><span class="pill">${p.engine} · ${p.list.length} 项能力</span><button class="btn sm" data-addpack="${p.id}">加入组合 ${I('plus')}</button></div></div></article>`}
function cBuilder(){return `<aside class="c-builder"><div class="between"><h2>我的组合</h2>${I('layers')}</div><p>选择引擎，再为它添上能力。</p><div class="step-label"><b>1</b> 引擎与工作台</div><div class="c-engine">${['Pi','DSH'].map(e=>`<button class="${S.engine===e?'on':''}" data-engine="${e}">${logo(e)}${e}<div class="small muted">${e==='Pi'?'Pi Web':'原生 Web'}</div></button>`).join('')}</div><div class="step-label"><b>2</b> 能力清单 <span style="margin-left:auto">${S.basket.length}</span></div>${S.basket.length?S.basket.map(id=>{let r=resources.find(x=>x.id===id);return `<div class="build-item">${I(r.icon)}<div class="grow">${r.name}<div class="sub" style="font-size:9px">${r.type} · ${r.engine}</div></div><button class="icon-btn" data-remove="${id}" title="移除${r.name}">${I('close')}</button></div>`}).join(''):'<div class="build-empty">从左侧挑选一个组合<br>或者到扩展页添加能力。</div>'}<div class="build-footer"><div class="between small"><span class="muted">兼容性</span><span style="color:${conflicts().length?'var(--warn)':'var(--green)'}">${conflicts().length?conflicts().length+' 项待处理':'类型匹配 · 待实测'}</span></div><button class="btn primary" data-act="build">检查并创建 ${I('arrow')}</button><p style="text-align:center;margin-top:10px;font-size:9px">不覆盖已有实例 · 默认排除密钥</p></div></aside>`}
function cResources(){return `<div class="a-heading"><div class="micro">CAPABILITY LIBRARY</div><h1 style="margin:10px 0">给工作方式，添点可能。</h1><p>插件、Skills 和工作台，按引擎分别安装。</p></div><div class="search-box">${I('search')}<input data-search value="${esc(S.q)}" placeholder="搜索能力名称" aria-label="搜索扩展"></div><div class="c-resource-list">${resources.filter(r=>(r.name+r.desc).toLowerCase().includes(S.q.toLowerCase())).map(r=>`<div class="row">${logo(r.icon)}<div class="grow"><button class="text-btn" data-resource="${r.id}" style="font-size:13px;color:var(--ink)">${r.name} ${I('external')}</button><p class="sub">${r.desc}</p><span class="pill" style="margin-top:6px">${r.type} · ${r.engine}</span></div><button class="btn sm ${S.basket.includes(r.id)?'':'primary'}" data-add="${r.id}">${S.basket.includes(r.id)?'已加入 ✓':'加入 +'}</button></div>`).join('')||empty()}</div>`}
function cFavorites(){let list=packs.filter(p=>favorites.includes(p.id));return `<div class="a-heading"><div class="micro">SAVED FOR LATER</div><h1 style="margin:10px 0">留给下一次灵感。</h1><p>收藏的组合会保存在当前浏览器。</p></div><div class="c-pack-grid">${list.map(cPack).join('')}</div>${!list.length?empty('还没有收藏','在发现页点击爱心，把感兴趣的组合留在这里。'):''}`}
function cLibrary(){return `<div class="c-library"><div class="between"><div><div class="micro">YOUR PERSONAL COLLECTION</div><h1>组合好了，开始使用。</h1><p>已创建的环境，以及它们各自的工作方式。</p></div>${btn('新建','new',true,'plus')}</div><div style="margin-top:30px">${data.map(i=>`<div class="row">${logo(i.engine)}<div class="grow"><button class="text-btn" style="font-size:14px;color:var(--ink)" data-inspect="${i.id}">${esc(i.name)} ${I('external')}</button><p class="sub">${i.web} · ${i.count} 项扩展</p></div>${status(i)}<button class="btn sm" data-launch="${i.id}">${i.status==='running'?'打开':i.status==='error'?'修复':'启动'}</button></div>`).join('')}</div><div class="row"><div class="grow"><h3>保留好用的状态</h3><p class="sub">查看和恢复已保存的环境清单。</p></div>${btn('恢复中心','snapshots',false,'clock')}</div></div>`}
function activity(title=true){return `${title?'<div class="a-heading"><div class="micro">ACTIVITY LOG</div><h1 style="margin:10px 0">每一步，都有迹可循。</h1><p>当前原型中的启动、安装与恢复记录。</p></div>':''}<div>${history.map(t=>`<div class="row"><span style="color:var(--green)">${I('check')}</span><div class="grow"><h3>${esc(t.name)}</h3><p class="sub">已完成 · 演示操作</p></div><span class="small muted">${t.time}</span></div>`).join('')||empty('暂无活动','创建或启动一个环境后，活动会出现在这里。')}</div>`}
function snapshotRows(id){let list=snapshots.filter(s=>!id||s.id===id);return `<div class="section-title"><h2>恢复点</h2><button class="btn sm" data-act="snapshot">${I('plus')} 创建</button></div>${list.map(s=>`<div class="row">${I('clock')}<div class="grow"><h3>${esc(s.name)}</h3><p class="sub">${esc(data.find(i=>i.id===s.id)?.name)} · ${s.time}</p></div><button class="btn sm" data-restore="${snapshots.indexOf(s)}">恢复</button></div>`).join('')||empty('还没有恢复点','在尝试新能力之前，先保存当前环境。')}`}
let previousFocus=null,timer=null;
function modal(title,body,footer='',large=false){previousFocus=document.activeElement;document.getElementById('layer').innerHTML=`<div class="overlay"><section class="dialog ${large?'large':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="dialog-head"><h2>${title}</h2><button class="icon-btn" data-close aria-label="关闭">${I('close')}</button></div>${body}${footer?`<div class="dialog-foot">${footer}</div>`:''}</section></div>`;document.querySelector('.dialog input,.dialog button,.dialog select')?.focus()}
function close(){if(timer){clearTimeout(timer);timer=null}document.getElementById('layer').innerHTML='';document.getElementById('drawer').innerHTML='';previousFocus?.focus()}
let toastTimer;function toast(t){clearTimeout(toastTimer);document.getElementById('toast').innerHTML=`<div class="toast" role="status">${esc(t)}</div>`;toastTimer=setTimeout(()=>document.getElementById('toast').innerHTML='',2700)}
function record(t){history.unshift({name:t,time:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})});persist()}
function go(page){S.page=page;S.q='';S.filter='全部';S.category='全部';render();window.scrollTo(0,0)}
function saveSnap(name,id=S.selected){const owned=Object.fromEntries(Object.entries(extensions).filter(([k])=>k.startsWith(id+':')||k.startsWith('installed:'+id+':')));snapshots.unshift({name,id,time:'刚刚',extensions:structuredClone(owned),instance:structuredClone(data.find(i=>i.id===id))});persist()}
function inspect(id=S.selected){S.selected=id;let i=current();modal(i.name,`<div class="flex">${logo(i.engine)}<div class="grow"><h3>${esc(i.project)}</h3><p class="sub">${esc(i.purpose)}</p></div>${status(i)}</div><div style="margin-top:20px">${[['引擎',i.version],['工作台',i.web],['工作目录',i.path],['扩展',i.count+' 项'],['版本策略','固定组合']].map(([a,b])=>`<div class="fact"><span>${a}</span><span style="overflow-wrap:anywhere;text-align:right">${esc(b)}</span></div>`).join('')}</div><div class="flex" style="margin-top:20px;flex-wrap:wrap"><button class="btn sm" data-act="snapshot">${I('clock')} 恢复点</button><button class="btn sm" data-act="catalog">${I('puzzle')} 扩展</button><button class="btn sm" data-act="export">${I('download')} 导出</button><button class="btn sm" data-act="logs">${I('terminal')} 日志</button></div>`,`<button class="text-btn" data-act="rename">重命名</button><div class="flex">${i.status==='running'?`<button class="btn" data-stop="${i.id}">停止</button>`:''}<button class="btn primary" data-launch="${i.id}">${i.status==='error'?'诊断修复':i.status==='running'?'打开工作台':'启动环境'}</button></div>`)}
function launch(id){S.selected=id;let i=current();if(i.status==='error'){modal('处理启动问题',`<div class="notice">${I('alert')}<div><b>research-helper 缺少依赖</b><p>这是原型中的示例错误，不对应真实插件检测。</p></div></div><p class="small">先保存恢复点，再禁用异常扩展并检查环境。</p><div class="fact"><span>目标环境</span><span>${esc(i.name)}</span></div><div class="fact"><span>保留内容</span><span>配置、会话与其他扩展</span></div>`,`<button class="text-btn" data-act="snapshots">选择历史恢复点</button><button class="btn primary" data-fix="${i.id}">备份并修复</button>`);return}if(i.status==='running'){workbench(i);return}modal('正在准备 '+esc(i.name),`<p class="small">启动前检查版本组合、扩展和工作台。</p><div class="progress"><i></i></div><div class="fact"><span>版本与运行环境</span><span style="color:var(--green)">检查通过</span></div><div class="fact"><span>扩展依赖</span><span style="color:var(--green)">检查通过</span></div><div class="fact"><span>工作台服务</span><span>准备中…</span></div>`);timer=setTimeout(()=>{timer=null;i.status='running';record(i.name+' · 启动完成');render();workbench(i)},800)}
function workbench(i){modal('工作台已就绪',`<div class="flex">${logo(i.engine)}<div><h3>${esc(i.name)}</h3><p class="sub">${i.web} · 默认浏览器</p></div></div><div class="notice" style="color:var(--muted)">${I('external')}<p>正式产品将在浏览器打开本机工作台。当前为前端原型，不会启动 Agent 服务。</p></div>`,`<button class="text-btn" data-act="inspect">环境详情</button><button class="btn primary" data-act="preview">体验工作台预览 ${I('arrow')}</button>`)}
function preview(){let i=current();modal('工作台预览',`<div class="pill">${i.engine} · 模拟交互</div><div style="text-align:center;padding:28px 0"><div class="micro">READY WHEN YOU ARE</div><h1 style="font-size:27px;margin:10px 0">今天，从哪里开始？</h1><p class="small">${esc(i.name)}已经准备好。</p></div><label class="field"><span>描述一个任务</span><input id="prompt" class="input" placeholder="帮我整理项目结构"></label><div id="reply"></div>`,`<span>不发送数据、不调用模型</span><button class="btn primary" data-act="send">发送 ${I('arrow')}</button>`)}
let draft={};
function newEnvironment(p=null,cloned=false){let i=current();draft={engine:p?.engine||'Pi',name:p?.name||(cloned?i.name+' · 试验副本':''),project:cloned?i.project+'-sandbox':'',list:p?.list||[],cloned};newForm()}
function newForm(){modal(draft.cloned?'克隆为独立试验环境':'创建新的工作环境',`<div class="micro">01 / CHOOSE YOUR FOUNDATION</div><div class="choice-grid">${['Pi','DSH'].map(e=>`<button class="choice ${draft.engine===e?'on':''}" data-draftengine="${e}"><div class="flex">${logo(e)}<strong>${e}</strong></div><p>${e==='Pi'?'Pi 0.87.1 + Pi Web 0.9.3':'DSH + 原生 Web · 示例组合'}</p></button>`).join('')}</div><label class="field"><span>环境名称</span><input id="envName" maxlength="40" class="input" value="${esc(draft.name)}" placeholder="例如：我的开发助手"></label><label class="field"><span>项目名称</span><input id="projectName" maxlength="50" class="input" value="${esc(draft.project)}" placeholder="my-project"></label><p class="small">数据与扩展独立保存，已有环境不受影响。</p>`,`<span>步骤 1 / 2</span><button class="btn primary" data-act="newReview">检查并继续 ${I('arrow')}</button>`)}
function reviewNew(){draft.name=document.getElementById('envName').value.trim();draft.project=document.getElementById('projectName').value.trim()||'my-project';if(!draft.name){toast('请给环境起个名字');document.getElementById('envName').focus();return}modal('确认环境组合',`<div class="micro">02 / REVIEW YOUR ENVIRONMENT</div><h2 style="margin:14px 0">${esc(draft.name)}</h2>${[['引擎',draft.engine],['工作台',draft.engine==='Pi'?'Pi Web 0.9.3':'原生 DSH Web'],['项目',draft.project],['能力清单',draft.list.length+' 项'],['安装范围','新的独立实例']].map(([a,b])=>`<div class="fact"><span>${a}</span><span>${esc(b)}</span></div>`).join('')}<p class="small" style="margin-top:16px">这里只模拟创建过程，不下载文件或执行命令。</p>`,`<button class="text-btn" data-act="newBack">返回修改</button><button class="btn primary" data-act="newConfirm">创建环境 ${I('plus')}</button>`)}
function createConfirmed(){if(S.offline){toast('当前离线，请恢复连接后创建');return}modal('正在创建环境',`<p>${esc(draft.name)}</p><div class="progress"><i></i></div><p class="small">准备独立目录与固定版本清单…</p>`);timer=setTimeout(()=>{timer=null;let id=Date.now();data.push({id,name:draft.name,engine:draft.engine,purpose:draft.cloned?'从当前环境克隆的独立试验副本':'自定义工作环境',project:draft.project,status:'ready',version:draft.engine==='Pi'?'Pi 0.87.1':'DSH 示例组合',web:draft.engine==='Pi'?'Pi Web 0.9.3':'原生 DSH Web',count:draft.list.length,capabilities:[...draft.list],branch:draft.cloned?'experiment':'main',path:'D:\\Projects\\'+draft.project});S.selected=id;record(draft.name+' · 创建环境');close();S.page=VARIANT==='c'?'library':'home';S.q='';render();toast('环境已创建，可以启动了（演示）')},800)}
function resourceDetails(id){let r=resources.find(x=>x.id===id);modal(r.name,`<div class="flex">${logo(r.icon)}<span class="pill">${r.type} · ${r.engine}</span></div><p style="margin:20px 0">${r.desc}</p>${r.url?`<a class="text-btn" href="${r.url}" target="_blank" rel="noopener">查看原项目 ${I('external')}</a>`:'<p class="small">这是用于展示流程的示例 Skill，未包含真实执行脚本。</p>'}<div class="fact"><span>兼容状态</span><span>仅按引擎类型匹配，尚未实测</span></div>`,`<span>安装前将保存恢复点</span><button class="btn primary" ${VARIANT==='c'?`data-add="${id}"`:`data-install="${id}"`}>${VARIANT==='c'?'加入组合':'安装到当前环境'}</button>`)}
function catalog(){modal('为当前环境添加能力',`<p class="small">安装到：${esc(current().name)} · ${current().engine}</p>${resources.map(r=>{let ok=r.engine==='通用'||r.engine===current().engine;return `<div class="row">${logo(r.icon)}<div class="grow"><button class="text-btn" style="color:var(--ink);font-size:12px" data-resource="${r.id}">${r.name}</button><p class="sub">${r.type} · ${r.engine}</p></div><button class="btn sm" data-install="${r.id}" ${ok?'':'disabled'}>${ok?(extensions['installed:'+S.selected+':'+r.id]?'已安装':'安装'):'不适用'}</button></div>`}).join('')}`)}
function install(id){let r=resources.find(x=>x.id===id),i=current();if(r.engine!=='通用'&&r.engine!==i.engine){toast('这个扩展与当前引擎不匹配');return}if(extensions['installed:'+i.id+':'+id]){toast('已安装到当前环境');return}if(S.offline){toast('当前离线，无法安装扩展');return}modal('安装 '+r.name,`<p class="small">目标：${esc(i.name)}</p><div class="fact"><span>安装前</span><span>自动创建恢复点</span></div><div class="fact"><span>来源</span><span>${r.url?'GitHub 原项目':'本地示例'}</span></div><div class="notice" style="color:var(--muted)">${I('shield')}仅演示安装流程，不下载或执行第三方代码。</div>`,`<span>不会影响其他实例</span><button class="btn primary" data-confirm-install="${id}">确认安装</button>`)}
function packDetail(id){let p=packs.find(x=>x.id===id);let body=`<div class="c-pack-head"><div class="art">${packArt(id)}</div><div><div class="micro">${p.en}</div><h2 style="margin:8px 0">${p.name}</h2><span class="pill">${p.engine} · 示例整合包</span></div></div><p>${p.desc}</p><h3 style="margin:25px 0 10px">这份组合能做什么</h3>${p.list.map(id=>{let r=resources.find(x=>x.id===id);return `<div class="row">${I(r.icon)}<div><h3>${r.name}</h3><p class="sub">${r.desc}</p></div></div>`}).join('')}<h3 style="margin:24px 0 10px">环境清单</h3><div class="fact"><span>引擎</span><span>${p.engine}</span></div><div class="fact"><span>工作台</span><span>${p.engine==='Pi'?'Pi Web 0.9.3':'原生 DSH Web'}</span></div><div class="fact"><span>权限与凭据</span><span>创建后按需配置，不随包分享</span></div><p class="source">示例资源用于 UI 评审，不代表已完成兼容性测试。</p>`;if(VARIANT==='c'){previousFocus=document.activeElement;document.getElementById('drawer').innerHTML=`<div class="drawer-wrap"><aside class="drawer" role="dialog" aria-modal="true" aria-label="组合详情"><div class="between" style="margin-bottom:25px"><button class="text-btn" data-close>${I('back')} 返回发现</button><button class="icon-btn" data-close aria-label="关闭">${I('close')}</button></div>${body}<button class="btn primary" style="width:100%;margin-top:25px" data-addpack="${id}">加入我的组合 ${I('plus')}</button></aside></div>`;document.querySelector('.drawer button').focus()}else modal(p.name,body,`<span>创建独立环境</span><button class="btn primary" data-usepack="${id}">使用这个组合 ${I('arrow')}</button>`)}
function conflicts(){return S.basket.filter(id=>{let r=resources.find(x=>x.id===id);return r.engine!=='通用'&&r.engine!==S.engine})}
function setEngine(e){if(e===S.engine)return;let bad=S.basket.filter(id=>{let r=resources.find(x=>x.id===id);return r.engine!=='通用'&&r.engine!==e});if(bad.length){modal('切换引擎需要调整组合',`<p class="small">以下能力不支持 ${e}，切换时将从组合移除：</p>${bad.map(id=>`<div class="row">${I('alert')}${resources.find(r=>r.id===id).name}</div>`).join('')}`,`<button class="text-btn" data-close>保留当前引擎</button><button class="btn primary" data-confirm-engine="${e}">移除并切换</button>`)}else{S.engine=e;render()}}
function addPack(id){let p=packs.find(x=>x.id===id);if(p.engine!==S.engine&&S.basket.length){modal('使用 '+p.engine+' 创建这个组合',`<p class="small">当前组合使用 ${S.engine}。继续后将切换为 ${p.engine}，保留通用能力并移除不适用的扩展。</p>`,`<button class="text-btn" data-close>取消</button><button class="btn primary" data-confirm-pack="${id}">切换并加入</button>`);return}applyPack(p)}
function applyPack(p){S.engine=p.engine;S.basket=[...new Set([...S.basket.filter(id=>{let r=resources.find(x=>x.id===id);return r.engine==='通用'||r.engine===p.engine}),...p.list])];close();render();toast('已加入能力清单，可以继续搭配')}
function buildReview(){modal('检查我的组合',`<div class="flex">${logo(S.engine)}<div><h3>${S.engine} 工作环境</h3><p class="sub">${S.basket.length} 项能力 · 独立实例</p></div></div>${S.basket.map(id=>`<div class="row">${I(resources.find(r=>r.id===id).icon)}<div class="grow">${resources.find(r=>r.id===id).name}</div><button class="icon-btn" data-review-remove="${id}" title="移除">${I('close')}</button></div>`).join('')||'<p class="small" style="margin-top:20px">空白环境也是一个好起点。</p>'}<div class="notice" style="color:var(--muted)">${I('shield')}当前仅检查引擎类型匹配；正式安装还需验证版本和依赖。</div>`,`<span>不包含 API 密钥</span><button class="btn primary" data-act="build">继续创建 ${I('arrow')}</button>`)}
function exportCurrent(){let i=current();let d={format:'agent-design-mvp/v1',name:i.name,engine:i.engine,version:i.version,web:i.web,capabilities:i.capabilities||[],demo:true};let blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='agent-environment.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('清单已导出，不含密钥与会话')}
function importCurrent(){let input=document.createElement('input');input.type='file';input.accept='.json';input.onchange=async()=>{try{let d=JSON.parse(await input.files[0].text());if(d.format!=='agent-design-mvp/v1'||!['Pi','DSH'].includes(d.engine)||typeof d.name!=='string')throw Error();newEnvironment({name:d.name.slice(0,40),engine:d.engine,list:Array.isArray(d.capabilities)?d.capabilities.filter(id=>resources.some(r=>r.id===id)):[]})}catch{toast('无法读取清单，请选择本原型导出的 JSON')}};input.click()}
function search(){modal('快速查找',`<div class="search-box">${I('search')}<input id="commandInput" placeholder="搜索环境或操作" aria-label="快速搜索"></div><div id="commandResults" style="margin-top:13px"></div>`,`<span>Enter 选择第一项</span><kbd class="key">Esc 关闭</kbd>`);renderCommands('');document.getElementById('commandInput').focus()}
function renderCommands(q){let choices=[...data.map(i=>({title:i.name,sub:i.engine,html:`data-inspect="${i.id}"`})),{title:'创建新环境',sub:'操作',html:'data-act="new"'},{title:'恢复中心',sub:'操作',html:'data-act="snapshots"'},{title:'扩展仓库',sub:'操作',html:'data-act="catalog"'}].filter(x=>x.title.toLowerCase().includes(q.toLowerCase()));document.getElementById('commandResults').innerHTML=choices.map(x=>`<button class="command-row" ${x.html}>${I('search')}<span class="grow">${esc(x.title)}</span><span class="small muted">${x.sub}</span></button>`).join('')||'<p class="small muted" style="padding:20px">没有匹配结果。</p>'}
function settings(){modal('本机偏好设置',`<div class="row"><div class="grow"><h3>深色外观</h3><p class="sub">当前浏览器保存你的选择。</p></div><button class="switch ${S.dark?'on':''}" data-act="themeModal" role="switch" aria-label="深色外观" aria-checked="${S.dark}"></button></div><div class="row"><div class="grow"><h3>模拟离线</h3><p class="sub">检查离线提示与安装限制。</p></div><button class="switch ${S.offline?'on':''}" data-act="offlineModal" role="switch" aria-label="模拟离线" aria-checked="${S.offline}"></button></div><div class="fact"><span>工作台打开方式</span><span>默认浏览器</span></div><div class="fact"><span>当前平台</span><span>Windows · 前端原型</span></div><div class="source">品牌 SVG：<a href="https://github.com/lobehub/lobe-icons" target="_blank" rel="noopener">Lobe Icons（MIT）↗</a>。Pi 使用文字标识。<br>交互参考：<a href="https://www.raycast.com/" target="_blank" rel="noopener">Raycast</a> / <a href="https://linear.app/features" target="_blank" rel="noopener">Linear</a> / <a href="https://ui.shadcn.com/docs/components" target="_blank" rel="noopener">shadcn/ui</a>。本文件为原生 HTML 实现。</div>`,`<span>仅影响本原型</span><button class="btn" data-act="resetAsk">重置演示数据</button>`)}
function act(a){if(a==='new')newEnvironment();else if(a==='newReview')reviewNew();else if(a==='newBack')newForm();else if(a==='newConfirm')createConfirmed();else if(a==='search')search();else if(a==='inspect')inspect();else if(a==='preview')preview();else if(a==='send'){let v=document.getElementById('prompt').value.trim();if(!v)return;document.getElementById('reply').innerHTML=`<div class="notice" style="color:var(--ink)"><div><b>${esc(v)}</b><p style="margin-top:8px">演示回复：真实 Agent 接入后，这里将展示结果、工具调用与文件变更。</p></div></div>`}else if(a==='theme'||a==='themeModal'){S.dark=!S.dark;render();if(a==='themeModal')settings()}else if(a==='offline'||a==='offlineModal'){S.offline=!S.offline;render();if(a==='offlineModal')settings();toast(S.offline?'已切换到离线演示':'已恢复连接')}else if(a==='settings')settings();else if(a==='clearSearch'){S.q='';S.filter='全部';S.category='全部';render()}else if(a==='catalog')catalog();else if(a==='snapshots')modal('恢复中心',snapshotRows());else if(a==='snapshot'){modal('保存一个恢复点',`<p class="small">目标环境：${esc(current().name)}</p><label class="field"><span>恢复点名称</span><input id="snapName" class="input" maxlength="60" value="稳定工作环境"></label><p class="small">演示保存配置与扩展状态，不保存 API 密钥。</p>`,`<span>保存后可在恢复中心找到</span><button class="btn primary" data-act="saveSnapshot">保存恢复点</button>`)}else if(a==='saveSnapshot'){let n=document.getElementById('snapName').value.trim();if(!n){toast('请输入恢复点名称');return}saveSnap(n);record(current().name+' · 保存恢复点');close();render();toast('恢复点已保存')}else if(a==='clone'){newEnvironment({name:current().name+' · 试验副本',engine:current().engine,list:current().capabilities||[]},true)}else if(a==='rename'){modal('重命名环境',`<label class="field"><span>名称</span><input id="rename" class="input" maxlength="40" value="${esc(current().name)}"></label>`,`<span>环境数据不受影响</span><button class="btn primary" data-act="saveRename">保存</button>`)}else if(a==='saveRename'){let n=document.getElementById('rename').value.trim();if(!n)return toast('请输入名称');current().name=n;close();render();toast('名称已更新')}else if(a==='logs'){let i=current();modal('运行日志',`<pre class="logs">[14:32:01] 读取实例 ${esc(i.name)}\n[14:32:02] 检查固定版本 ${i.version}\n${i.status==='error'?'[ERROR] 示例插件缺少依赖\n[STOP] 已保留配置，等待修复':'<b>[OK] 运行环境已准备\n[OK] 扩展依赖检查通过</b>'}\n\n以上为演示日志，未执行真实命令。</pre>`)}else if(a==='compare'){let i=current(),other=i.engine==='Pi'?'DSH':'Pi';modal('比较两种工作台组合',`<div class="b-compare"><section><div class="flex">${logo(i.engine)}<h3>${i.engine} · 当前</h3></div><div class="fact"><span>前端</span><span>${i.web}</span></div><div class="fact"><span>配置</span><span>当前实例独立</span></div><div class="fact"><span>原生扩展</span><span>${i.engine} 生态</span></div></section><section><div class="flex">${logo(other)}<h3>${other} · 候选</h3></div><div class="fact"><span>前端</span><span>${other==='Pi'?'Pi Web':'原生 DSH Web'}</span></div><div class="fact"><span>配置</span><span>新建独立实例</span></div><div class="fact"><span>原生扩展</span><span>${other} 生态</span></div></section></div><p class="small" style="margin-top:18px">不同引擎的原生插件不直接互通，迁移前需要逐项验证。</p>`,`<span>不会修改当前环境</span><button class="btn primary" data-act="new">新建候选环境</button>`,true)}else if(a==='buildReview')buildReview();else if(a==='build'){if(conflicts().length)return toast('请先移除不兼容的能力');newEnvironment({name:'我的组合',engine:S.engine,list:[...S.basket]})}else if(a==='export')exportCurrent();else if(a==='import')importCurrent();else if(a==='resetAsk'){modal('恢复初始演示空间？','<p class="small">将清除本版本的自建环境、收藏和活动记录，其他版本不受影响。</p>','<button class="text-btn" data-close>取消</button><button class="btn primary" data-act="reset">确认重置</button>')}else if(a==='reset'){localStorage.removeItem('agent-mvp-'+VARIANT);location.reload()}}
document.addEventListener('click',e=>{let b=e.target.closest('button,a[data-act]');if(!b){if(e.target.classList.contains('overlay')||e.target.classList.contains('drawer-wrap'))close();return}if(b.disabled)return;let d=b.dataset;if('close'in d){close();return}if(d.act){act(d.act);return}if(d.go){go(d.go);return}if(d.select){S.selected=+d.select;render();return}if(d.project){S.selected=+d.project;S.page='home';S.tab='环境';render();return}if(d.inspect){close();inspect(+d.inspect);return}if(d.launch){launch(+d.launch);return}if(d.stop){let i=data.find(x=>x.id===+d.stop);i.status='ready';record(i.name+' · 已停止');close();render();toast('环境已停止（演示）');return}if(d.filter){S.filter=d.filter;render();return}if(d.tab){S.tab=d.tab;render();return}if(d.category){S.category=d.category;render();return}if(d.pack){packDetail(d.pack);return}if(d.usepack){let p=packs.find(x=>x.id===d.usepack);close();newEnvironment(p);return}if(d.fix){let i=data.find(x=>x.id===+d.fix);saveSnap('修复前自动快照',i.id);i.status='ready';extensions[i.id+':research-helper']=false;record(i.name+' · 禁用异常扩展并修复');close();render();toast('检查通过，环境已恢复就绪');return}if(d.draftengine){draft.name=document.getElementById('envName').value;draft.project=document.getElementById('projectName').value;draft.engine=d.draftengine;newForm();return}if(d.toggle){let k=S.selected+':'+d.toggle;extensions[k]=extensions[k]===false;record(current().name+' · 调整扩展状态');render();return}if(d.resource){resourceDetails(d.resource);return}if(d.install){install(d.install);return}if(d.confirmInstall){let r=resources.find(x=>x.id===d.confirmInstall);saveSnap('安装 '+r.name+' 前');extensions['installed:'+S.selected+':'+r.id]=true;extensions[S.selected+':'+r.id]=true;current().count++;record(current().name+' · 安装 '+r.name);close();render();toast('已安装并保存恢复点（演示）');return}if(d.restore){let s=snapshots[+d.restore];modal('恢复「'+esc(s.name)+'」',`<p class="small">恢复前会自动保存当前状态。环境将停止运行，并还原扩展启用状态。</p>`,`<button class="text-btn" data-close>取消</button><button class="btn primary" data-confirm-restore="${d.restore}">备份并恢复</button>`);return}if(d.confirmRestore){let s=snapshots[+d.confirmRestore];saveSnap('恢复前自动备份',s.id);for(const k of Object.keys(extensions)){if(k.startsWith(s.id+':')||k.startsWith('installed:'+s.id+':'))delete extensions[k]}Object.assign(extensions,structuredClone(s.extensions||{}));if(s.instance)Object.assign(data.find(i=>i.id===s.id),structuredClone(s.instance));data.find(i=>i.id===s.id).status='ready';record('恢复状态 · '+s.name);close();render();toast('已恢复，恢复前状态也已保存');return}if(d.engine){setEngine(d.engine);return}if(d.confirmEngine){S.engine=d.confirmEngine;S.basket=S.basket.filter(id=>{let r=resources.find(x=>x.id===id);return r.engine==='通用'||r.engine===S.engine});close();render();return}if(d.addpack){addPack(d.addpack);return}if(d.confirmPack){applyPack(packs.find(x=>x.id===d.confirmPack));return}if(d.add){let r=resources.find(x=>x.id===d.add);if(r.engine!=='通用'&&r.engine!==S.engine){toast('当前引擎为 '+S.engine+'，请先切换到 '+r.engine);return}if(!S.basket.includes(r.id))S.basket.push(r.id);close();render();toast('已加入组合清单');return}if(d.remove||d.reviewRemove){S.basket=S.basket.filter(id=>id!==(d.remove||d.reviewRemove));render();if(d.reviewRemove)buildReview();return}if(d.favorite){favorites=favorites.includes(d.favorite)?favorites.filter(id=>id!==d.favorite):[...favorites,d.favorite];render();return}});
document.addEventListener('input',e=>{if(e.target.matches('[data-search]')){let pos=e.target.selectionStart;S.q=e.target.value;render();let el=document.querySelector('[data-search]');el.focus();el.setSelectionRange(pos,pos)}if(e.target.id==='commandInput')renderCommands(e.target.value)});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();search()}if(e.key==='Escape')close();if(e.key==='Enter'&&e.target.id==='commandInput'){document.querySelector('.command-row')?.click()}let container=document.querySelector('.dialog,.drawer');if(e.key==='Tab'&&container){let f=[...container.querySelectorAll('button,input,select,a[href]')].filter(x=>!x.disabled),first=f[0],last=f.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}});render();
</script></body></html>
