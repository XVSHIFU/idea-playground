function shell(){document.getElementById('app').innerHTML=`<div class="app"><aside class="sidebar"><div class="brand"><div class="mark">⌁</div><div class="brand-text"><strong>栖点</strong><small>PERCH</small></div></div><div class="nav-label">WORKSPACE</div>${[['home','grid','工作台'],['instances','box','我的实例'],['packs','compass','发现整合包'],['plugins','puzzle','扩展市场']].map(([id,ic,t])=>`<button class="nav ${state.page===id||state.page==='detail'&&id==='instances'?'active':''}" data-go="${id}" title="${t}">${I(ic)}<span>${t}</span>${id==='instances'?`<i class="count">${instances.length}</i>`:''}</button>`).join('')}<div class="nav-label">MANAGEMENT</div><button class="nav ${state.page==='tasks'?'active':''}" data-go="tasks" title="任务与下载">${I('download')}<span>任务与下载</span></button><button class="nav ${state.page==='snapshots'?'active':''}" data-go="snapshots" title="恢复中心">${I('clock')}<span>恢复中心</span></button><div class="sidebar-bottom"><button class="nav" data-action="theme" title="切换浅色与深色">${I('moon')}<span>切换外观</span></button><button class="nav ${state.page==='settings'?'active':''}" data-go="settings" title="设置">${I('settings')}<span>设置</span></button><div class="local"><span class="dot"></span>本机工作空间<br><span style="padding-left:13px">Windows · 交互演示</span></div></div></aside><main class="main"><header class="topbar"><div class="crumb">个人空间 <b>/ ${({home:'工作台',instances:'我的实例',packs:'发现整合包',plugins:'扩展市场',tasks:'任务与下载',snapshots:'恢复中心',settings:'设置',detail:'实例详情'})[state.page]}</b></div><div class="top-actions"><button class="search-trigger" data-action="search">${I('search')} 搜索实例、扩展或操作 <span class="key">Ctrl K</span></button><span class="badge">交互原型</span><div class="avatar">YOU</div></div></header><div class="content page">${state.offline?`<div class="banner">${I('alert')} 离线模式 · 已安装实例仍可使用，市场显示缓存内容。<button class="link" data-action="offline">恢复连接</button></div>`:''}${pageContent()}<footer class="footer"><span>PERCH / 为每一种工作方式，留一个栖点。</span><span>本地演示数据 · 不执行真实安装或启动</span></footer></div></main></div>`;bind()}
function head(title,sub,button=''){return `<div class="page-head"><div><div class="eyebrow">YOUR AGENT WORKSPACE</div><h1>${title}</h1><p>${sub}</p></div>${button}</div>`}
function newBtn(){return `<button class="btn primary" data-action="new">${I('plus')} 新建实例</button>`}
function status(i){return `<span class="status ${i.status==='error'?'warn':i.status==='ready'?'neutral':''}">${i.status==='running'?'● 运行中':i.status==='error'?'需要处理':'就绪'}</span>`}
function row(i){return `<div class="instance" data-detail="${i.id}" tabindex="0" role="button" aria-label="查看${esc(i.name)}"><div class="engine-logo ${i.engine==='Pi'?'pi':''}">${i.engine==='Pi'?'π':'≈'}</div><div class="instance-info"><div class="instance-name">${esc(i.name)} <span style="margin-left:8px">${status(i)}</span></div><div class="subline"><span>${i.engine}</span><span>·</span><span>${i.plugins} 个扩展</span><span>·</span><span>${esc(i.desc)}</span></div></div><div class="instance-meta">${i.last}</div><button class="btn small ${i.status==='ready'?'darkbtn':''} action" data-launch="${i.id}">${I(i.status==='running'?'external':i.status==='error'?'alert':'play')}${i.status==='running'?'打开':i.status==='error'?'修复':'启动'}</button></div>`}
function packCard(p,n){return `<button class="pack" data-pack="${n}"><div class="pack-art ${p.color}">${art(p.glyph)}</div><div class="pack-body"><h3>${p.name}</h3><p>${p.desc}</p><div class="pack-foot"><span>${p.engine} · ${p.plugins} 个扩展</span><span>查看组合 ↗</span></div></div></button>`}
function pageContent(){if(state.page==='home')return head('让好用的 Agent，随时就绪。','选择一个工作环境，接着上次的灵感继续。',newBtn())+`<section class="hero"><div class="hero-copy"><div class="eyebrow">A LITTLE SPACE. ENDLESS POSSIBILITIES.</div><h2>工具各有所长，<br>工作自有节奏。</h2><p>把引擎、插件和习惯，安放在自己的工作空间。</p><div class="hero-foot"><button class="btn darkbtn" data-launch="1">${I('play')} 继续「日常开发」</button><span>Pi · 浏览器工作台</span></div></div>${heroArt()}</section><div class="workspace-grid"><section><div class="section-head"><h2>我的实例<small>${instances.length} 个独立环境</small></h2><button class="link" data-go="instances">管理全部 ${I('arrow')}</button></div><div class="tabs">${['全部','运行中','需要处理'].map(t=>`<button class="tab ${state.filter===t?'on':''}" data-filter="${t}">${t}</button>`).join('')}</div>${filteredInstances().map(row).join('')||empty('这里暂时没有实例','换个筛选，或创建一个新的工作环境。')}<div class="quick-tip">${I('shield')} 实例之间配置独立。尝试新插件前，可以先创建恢复点。</div></section><aside class="right-rail"><div class="rail-top"><h3>值得留意</h3><span class="eyebrow">01</span></div><div class="notice"><b>试验田需要一次检查</b><p>一个扩展未通过启动检查。你的稳定工作环境不受影响。</p><button data-detail="3">查看问题与恢复选项 →</button></div><h3 style="font-size:13px">最近的脚印</h3><div class="timeline"><div class="event">研究与写作已启动<p>DSH · 原生 Web 工作台</p><time>14:32</time></div><div class="event">已保存一个恢复点<p>日常开发 · 安装前自动快照</p><time>14:20</time></div><div class="event">创建了日常开发<p>从「专注开发」整合包开始</p><time>昨天</time></div></div><button class="link" data-go="tasks">查看活动记录 ${I('arrow')}</button></aside></div><section class="collection"><div class="section-head"><h2>从一个好组合开始<small>精选示例整合包</small></h2><button class="link" data-go="packs">探索全部 ${I('arrow')}</button></div><div class="pack-grid">${packs.map(packCard).join('')}</div></section>`;
if(state.page==='instances')return head('我的实例','每一种工作方式，都有自己的环境。',newBtn())+`<div class="toolbar"><input class="input" id="listSearch" placeholder="搜索实例名称或引擎" value="${esc(state.query)}" aria-label="搜索实例">${['全部','运行中','需要处理'].map(t=>`<button class="chip ${state.filter===t?'on':''}" data-filter="${t}">${t}</button>`).join('')}</div><div id="instanceList">${filteredInstances().map(row).join('')||empty('没有找到匹配的实例','试试其他关键词，或点击右上角新建实例。')}</div>`;
if(state.page==='packs')return head('找到适合你的起点。','选一组能力，创建属于自己的工作环境。')+`<div class="hero" style="min-height:190px"><div class="hero-copy"><div class="eyebrow">CURATED STARTER COLLECTION</div><h2>少一点配置，<br>多一点创造。</h2><p>三个示例组合，覆盖开发、研究与轻量探索。</p></div>${heroArt()}</div><div class="section-head"><h2>起步组合</h2><span class="badge">演示目录 · 非真实验证认证</span></div><div class="pack-grid">${packs.map(packCard).join('')}</div><div class="setting-row" style="margin-top:30px"><div><h3>已经有自己的组合？</h3><p>导入栖点导出的清单，在新实例里重建它。</p></div><button class="btn" data-action="import">${I('download')} 导入清单</button></div>`;
if(state.page==='plugins')return head('给助手添一份能力。','先选择目标实例，再查看适合它的扩展。')+`<div class="toolbar"><input class="input" id="pluginSearch" placeholder="搜索扩展名称、能力" value="${esc(state.query)}" aria-label="搜索扩展"><select class="input" id="targetInstance" aria-label="安装目标">${instances.map(i=>`<option value="${i.id}" ${state.selected===i.id?'selected':''}>安装到：${esc(i.name)} · ${i.engine}</option>`).join('')}</select></div><div class="list-heading"><span>扩展 / 来源</span><span>类型与兼容性</span></div><div id="pluginList">${pluginRows()}</div><p style="font-size:11px;margin-top:20px">GitHub 项目为真实来源；安装、兼容检查与本地 Skills 为交互演示。</p>`;
if(state.page==='detail')return detail();
if(state.page==='tasks')return head('任务与下载','每一步进展，都有迹可循。',`<button class="btn" data-action="clearTasks">清空已完成</button>`)+`${tasks.length?tasks.map(t=>`<div class="catalog-row"><div class="engine-logo">${I('check')}</div><div class="grow"><h3>${esc(t.name)}</h3><p>${t.time} · 本地演示任务</p></div><span class="status">${t.status}</span></div>`).join(''):empty('所有事情都已安排妥当','启动、安装与恢复任务会出现在这里。')}`;
if(state.page==='snapshots')return head('随时回到好用的时候。','恢复点保存实例配置与扩展清单，不包含 API 密钥。',`<button class="btn primary" data-action="snapshot">${I('plus')} 创建恢复点</button>`)+`${snaps.map((s,n)=>`<div class="catalog-row"><div class="engine-logo">${I('clock')}</div><div class="grow"><h3>${esc(s.name)}</h3><p>${esc(instances.find(i=>i.id===s.instance)?.name||'实例')} · ${s.time}</p></div><button class="btn" data-restore="${n}">恢复此状态</button></div>`).join('')||empty('还没有恢复点','在安装新扩展之前，给当前环境留一份备份。')}`;
if(state.page==='settings')return head('让栖点适应你的习惯。','本机设置 · 更改会保存在当前浏览器。')+`<div class="setting-row"><div><h3>深色外观</h3><p>在安静的深色与清爽的浅色之间切换。</p></div><button class="toggle ${document.body.classList.contains('dark')?'on':''}" data-action="theme" role="switch" aria-checked="${document.body.classList.contains('dark')}" aria-label="深色外观"></button></div><div class="setting-row"><div><h3>工作台打开方式</h3><p>启动后在系统默认浏览器中继续工作。</p></div><span class="badge">默认浏览器</span></div><div class="setting-row"><div><h3>模拟离线</h3><p>预览离线时的市场、安装与实例行为。</p></div><button class="toggle ${state.offline?'on':''}" data-action="offline" role="switch" aria-checked="${state.offline}" aria-label="模拟离线"></button></div><div class="setting-row"><div><h3>重置演示空间</h3><p>清除本原型创建的实例与交互记录。</p></div><button class="btn" data-action="reset">恢复初始状态</button></div><div class="source-links"><a href="https://github.com/Meloong-Git/PCL" target="_blank" rel="noopener">PCL · 交互参考 ↗</a><a href="https://github.com/agegr/pi-web" target="_blank" rel="noopener">Pi Web ↗</a><a href="https://github.com/deepseek-ai/deepseek-harness" target="_blank" rel="noopener">DSH ↗</a></div>`;
}
function empty(a,b){return `<div class="empty">${I('box')}<h3>${a}</h3><p>${b}</p></div>`}
function filteredInstances(){return instances.filter(i=>(state.filter==='全部'||state.filter==='运行中'&&i.status==='running'||state.filter==='需要处理'&&i.status==='error')&&`${i.name} ${i.engine}`.toLowerCase().includes(state.query.toLowerCase()))}
function pluginRows(){let target=instances.find(i=>i.id===state.selected)||instances[0];return plugins.filter(p=>(p.name+p.desc).toLowerCase().includes(state.query.toLowerCase())).map((p)=>{let n=plugins.indexOf(p),ok=p.engine==='通用'||p.engine===target.engine,has=installed[target.id+':'+n];return `<div class="catalog-row"><div class="engine-logo ${p.engine==='Pi'?'pi':''}">${I(p.kind==='Skill'?'folder':'puzzle')}</div><div class="grow"><button class="link" style="color:var(--ink);font-size:14px;font-weight:600" data-plugin="${n}">${p.name} ${I('external')}</button><p>${p.desc}</p><span class="badge">${p.kind}</span><span class="badge">${p.engine}</span><span style="font-size:10px;color:var(--muted)">${p.source}</span></div><button class="btn ${ok&&!has?'primary':''}" data-install="${n}" ${!ok?'disabled':''}>${!ok?'引擎不适用':has?'已安装 ✓':'安装'}</button></div>`}).join('')||empty('没有找到这个扩展','试试“文档”“Pi”或“项目”。')}
function detail(){let i=instances.find(i=>i.id===state.selected)||instances[0];return `<button class="link" data-go="instances">${I('back')} 返回我的实例</button><div class="detail-hero"><div class="engine-logo ${i.engine==='Pi'?'pi':''}">${i.engine==='Pi'?'π':'≈'}</div><div><div class="eyebrow">${i.engine} / LOCAL INSTANCE</div><h1>${esc(i.name)}</h1>${status(i)}</div><div class="detail-actions"><button class="btn" data-action="export">导出组合</button>${i.status==='running'?`<button class="btn" data-stop="${i.id}">${I('stop')} 停止</button>`:''}<button class="btn primary" data-launch="${i.id}">${I('play')}${i.status==='error'?'诊断并修复':i.status==='running'?'打开工作台':'启动实例'}</button></div></div><div class="tabs">${['概览','扩展','版本与恢复','日志'].map(t=>`<button class="tab ${state.tab===t?'on':''}" data-tab="${t}">${t}</button>`).join('')}</div>${i.status==='error'?`<div class="banner" style="margin-top:20px">${I('alert')} 最近一次启动未完成：示例扩展 research-helper 缺少依赖。</div>`:''}${state.tab==='概览'?`<div class="facts"><div><label>固定版本组合</label><strong>${i.version}</strong></div><div><label>工作台</label><strong>${i.engine==='Pi'?'agegr/pi-web':'原生 DSH Web'}</strong></div><div><label>工作目录</label><strong>${esc(i.path)}</strong></div></div><div class="split" style="margin-top:25px"><section><h2>启动前，一切有序。</h2><p style="font-size:12px">环境检查与当前实例状态</p>${[['运行环境','已准备'],['版本清单','已锁定'],['扩展依赖',i.status==='error'?'1 项需要处理':'检查通过'],['打开方式','系统浏览器']].map(x=>`<div class="checkline"><span>${x[0]}</span><em>${x[1]}</em></div>`).join('')}</section><aside><div class="notice"><b>给现在的状态留个备份</b><p>安装和升级之前创建恢复点，随时回到熟悉的环境。</p><button data-action="snapshot">创建恢复点 →</button></div></aside></div>`:state.tab==='扩展'?`<div class="section-head" style="margin-top:24px"><h2>实例扩展</h2><button class="btn" data-go="plugins">浏览扩展市场</button></div>${['项目规范','文档整理'].map((x,n)=>`<div class="setting-row"><div><h3>${x}</h3><p>本地示例 Skill · 仅影响当前实例</p></div><button class="toggle ${installed['toggle'+i.id+n]===false?'':'on'}" data-toggle="${n}" role="switch" aria-checked="${installed['toggle'+i.id+n]!==false}" aria-label="启用${x}"></button></div>`).join('')}`:state.tab==='版本与恢复'?`<div class="setting-row"><div><h3>${i.version}</h3><p>引擎与 Web 前端作为一个组合固定。</p></div><span class="badge">版本已锁定</span></div><div class="setting-row"><div><h3>创建当前状态的恢复点</h3><p>保存配置与扩展清单，保留回退路径。</p></div><button class="btn" data-action="snapshot">创建恢复点</button></div><div class="setting-row"><div><h3>查看历史恢复点</h3><p>恢复前会自动保存当前配置。</p></div><button class="btn" data-go="snapshots">打开恢复中心</button></div>`:`<div class="log">[14:32:01] 初始化实例 ${esc(i.name)}\n[14:32:01] 读取固定版本清单\n[14:32:02] 检查运行环境：OK\n${i.status==='error'?'<span class="orange">[14:32:03] ERROR research-helper 缺少依赖\n[14:32:03] 启动已中止，现有数据已保留</span>':'[14:32:03] 检查扩展：OK\n[14:32:04] 实例状态：'+(i.status==='running'?'RUNNING':'READY')}\n\n以上为演示日志，未执行真实命令。</div>`}`}
function go(p){state.page=p;state.query='';state.filter='全部';shell();window.scrollTo(0,0)}
function toast(t){document.getElementById('toasts').innerHTML=`<div class="toast">${esc(t)}</div>`;setTimeout(()=>document.getElementById('toasts').innerHTML='',3000)}
let lastFocus;function modal(title,body,foot='',wide=false){lastFocus=document.activeElement;document.getElementById('dialogs').innerHTML=`<div class="overlay"><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><h2>${title}</h2><button class="close" data-close aria-label="关闭">×</button></div>${body}${foot?`<div class="modal-foot">${foot}</div>`:''}</section></div>`;document.querySelector('[data-close]').onclick=closeModal;document.querySelector('.overlay').onclick=e=>{if(e.target.classList.contains('overlay'))closeModal()};setTimeout(()=>document.querySelector('.modal input,.modal button')?.focus(),20)}function closeModal(){document.getElementById('dialogs').innerHTML='';lastFocus?.focus()}
let draft={engine:'Pi',name:'',pack:null};function createModal(pack){draft={engine:pack?.engine||'Pi',name:pack?.name||'',pack:pack||null};newStep1()}
function newStep1(){modal('创建一个新的工作环境',`<div class="steps"><span class="on"></span><span></span></div><p>选择引擎。每个实例都有独立的配置与扩展。</p><div class="choice-grid" style="margin-top:20px">${['Pi','DSH'].map(e=>`<button class="choice ${draft.engine===e?'selected':''}" data-engine="${e}"><strong>${e==='Pi'?'π　Pi':'≈　DeepSeek Harness'}</strong><p>${e==='Pi'?'轻量可扩展 · Pi Web 工作台':'插件组合 · 原生 Web 工作台'}</p></button>`).join('')}</div><label class="field"><span>实例名称</span><input id="newName" class="input" maxlength="40" placeholder="例如：我的编程助手" value="${esc(draft.name)}"></label><label class="field"><span>工作目录（演示）</span><input id="newPath" class="input" value="D:\\Workspace\\my-agent"></label>`,`<span>步骤 1 / 2</span><button class="btn primary" id="nextCreate">检查配置 ${I('arrow')}</button>`);document.querySelectorAll('[data-engine]').forEach(b=>b.onclick=()=>{draft.engine=b.dataset.engine;draft.name=document.getElementById('newName').value;newStep1()});document.getElementById('nextCreate').onclick=()=>{draft.name=document.getElementById('newName').value.trim();draft.path=document.getElementById('newPath').value.trim();if(!draft.name){document.getElementById('newName').focus();toast('给这个工作环境起个名字吧');return}newStep2()}}
function newStep2(){modal('确认你的新环境',`<div class="steps"><span class="on"></span><span class="on"></span></div><h3>${esc(draft.name)}</h3><p>安装完成后，可以从实例列表启动。</p>${[['引擎',draft.engine],['工作台',draft.engine==='Pi'?'Pi Web 0.9.3 / Pi 0.87.1':'原生 DSH Web · 示例固定组合'],['整合包',draft.pack?.name||'空白环境'],['数据与插件','独立保存'],['安装方式','仅模拟，不下载文件']].map(x=>`<div class="checkline"><span>${x[0]}</span><span>${x[1]}</span></div>`).join('')}`,`<button class="link" id="backCreate">上一步</button><button class="btn primary" id="confirmCreate">${I('download')} 创建实例</button>`);document.getElementById('backCreate').onclick=newStep1;document.getElementById('confirmCreate').onclick=()=>{if(state.offline){toast('当前离线，恢复连接后再创建环境');return}document.getElementById('confirmCreate').disabled=true;document.getElementById('confirmCreate').textContent='准备环境…';document.querySelector('.modal-foot').insertAdjacentHTML('beforebegin','<div class="progress"><i></i></div>');setTimeout(()=>{let id=Date.now();instances.push({id,name:draft.name,engine:draft.engine,desc:draft.pack?.tag||'自己的工作环境',status:'ready',plugins:draft.pack?.plugins||0,version:draft.engine==='Pi'?'Pi 0.87.1 / Web 0.9.3':'DSH 固定组合 · 示例',last:'刚刚创建',path:draft.path});addTask(draft.name+' · 创建实例');state.selected=id;state.page='detail';state.tab='概览';persist();closeModal();shell();toast('实例已创建，可以开始使用了（演示）')},1000)}}
function addTask(name){tasks.unshift({name,status:'已完成',time:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})});persist()}
function launch(id){state.selected=id;let i=instances.find(x=>x.id===id);if(i.status==='error'){modal('让试验田恢复就绪',`<div class="banner">${I('alert')} research-helper 缺少必要依赖</div><p>建议先禁用这个示例扩展，再重新检查。其他配置保持原样。</p><div class="checkline"><span>修复前</span><span>自动创建恢复点</span></div><div class="checkline"><span>处理方式</span><span>禁用异常扩展</span></div>`,`<span>仅演示修复流程</span><button class="btn primary" id="repair">备份并修复</button>`);document.getElementById('repair').onclick=()=>{snaps.unshift({name:'修复前自动快照',instance:id,time:'刚刚'});i.status='ready';addTask(i.name+' · 禁用异常扩展并修复');closeModal();shell();toast('检查通过，实例已恢复就绪')};return}if(i.status==='running'){openWorkbench(i);return}modal('正在准备 '+esc(i.name),`<p>检查版本、扩展和工作台服务。</p><div class="progress"><i></i></div><div class="checkline"><span>读取固定版本组合</span><em>完成</em></div><div class="checkline"><span>检查扩展依赖</span><em>完成</em></div><div class="checkline"><span>启动本机工作台</span><span>准备中…</span></div>`);setTimeout(()=>{i.status='running';i.last='正在运行';addTask(i.name+' · 启动实例');shell();openWorkbench(i)},1000)}
function openWorkbench(i){modal('工作台已就绪',`<div class="engine-logo ${i.engine==='Pi'?'pi':''}" style="margin:15px 0">${i.engine==='Pi'?'π':'≈'}</div><h3>${esc(i.name)}</h3><p>${i.engine==='Pi'?'Pi Web':'原生 DSH Web'} · 默认浏览器</p><div class="notice"><b>这是前端交互演示</b><p>此 HTML 不会启动本机 Agent。正式接入后，这里将打开对应实例的本机地址。</p></div>`,`<button class="link" id="viewInstance">查看实例</button><button class="btn primary" id="previewWork">预览工作台 ${I('external')}</button>`);document.getElementById('viewInstance').onclick=()=>{closeModal();state.page='detail';state.tab='概览';shell()};document.getElementById('previewWork').onclick=()=>{modal('工作台预览 · '+esc(i.name),`<div class="badge">演示预览 · 非真实 Agent</div><div style="text-align:center;padding:30px 0"><div class="eyebrow">${i.engine} WORKSPACE</div><h1>今天，从哪里开始？</h1><p>工作环境已经准备好了。</p></div><label class="field"><span>试着描述一个任务</span><input class="input" id="demoPrompt" placeholder="例如：整理这个项目的结构"></label><div id="demoReply"></div>`,`<span>不调用模型、不发送数据</span><button class="btn primary" id="demoSend">发送演示消息 ${I('arrow')}</button>`);document.getElementById('demoSend').onclick=()=>{let v=document.getElementById('demoPrompt').value.trim();if(!v)return;document.getElementById('demoReply').innerHTML=`<div class="notice"><b>${esc(v)}</b><p>演示回复：正式工作台将在这里显示 Agent 的思考、工具调用与执行结果。</p></div>`}}}
function packModal(n){let p=packs[n];modal(p.name,`<div class="pack-art ${p.color}" style="height:145px;border-radius:9px">${art(p.glyph)}</div><p style="margin-top:18px">${p.desc}</p><div class="checkline"><span>适用引擎</span><span>${p.engine}</span></div><div class="checkline"><span>包含能力</span><span>${p.tag}</span></div><div class="checkline"><span>版本策略</span><span>固定组合，独立安装</span></div><div class="checkline"><span>目录状态</span><span>示例整合包</span></div>`,`<span>在新实例中创建，不覆盖现有环境</span><button class="btn primary" id="usePack">使用这个组合 ${I('arrow')}</button>`);document.getElementById('usePack').onclick=()=>createModal(p)}
function snapshot(){modal('创建恢复点',`<p>保存配置与扩展清单，API 密钥不会包含在内。</p><label class="field"><span>目标实例</span><select id="snapTarget" class="input">${instances.map(i=>`<option value="${i.id}" ${i.id===state.selected?'selected':''}>${esc(i.name)}</option>`).join('')}</select></label><label class="field"><span>名称</span><input id="snapName" class="input" value="我的稳定环境" maxlength="60"></label>`,`<span>配置快照 · 演示</span><button class="btn primary" id="saveSnap">保存恢复点</button>`);document.getElementById('saveSnap').onclick=()=>{let name=document.getElementById('snapName').value.trim();if(!name){toast('请输入恢复点名称');return}snaps.unshift({name,instance:+document.getElementById('snapTarget').value,time:'刚刚'});addTask('创建恢复点 · '+name);closeModal();shell();toast('恢复点已保存')}}
function exportPack(){let i=instances.find(i=>i.id===state.selected);let blob=new Blob([JSON.stringify({format:'perch-demo-pack',name:i.name,engine:i.engine,version:i.version,plugins:i.plugins,demo:true},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='perch-pack.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('已导出示例清单，不含密钥和会话')}
function importPack(){let input=document.createElement('input');input.type='file';input.accept='.json';input.onchange=async()=>{try{let d=JSON.parse(await input.files[0].text());if(d.format!=='perch-demo-pack'||!['Pi','DSH'].includes(d.engine)||typeof d.name!=='string')throw Error();createModal({name:d.name.slice(0,40),engine:d.engine,plugins:Number.isFinite(d.plugins)?Math.max(0,d.plugins):0,tag:'导入的示例组合'})}catch{toast('清单格式不正确，请选择本原型导出的 JSON')}};input.click()}
function command(){modal('快速前往',`<input id="commandInput" class="input" style="width:100%" placeholder="搜索实例、页面或新建…" aria-label="快速搜索"><div id="commands" style="margin-top:15px"></div>`);let render=()=>{let q=document.getElementById('commandInput').value.toLowerCase();let items=[...instances.map(i=>({t:i.name,sub:i.engine,fn:()=>{state.selected=i.id;state.page='detail';state.tab='概览';shell()}})),...['新建实例','发现整合包','扩展市场','恢复中心'].map((t,n)=>({t,sub:'操作',fn:()=>n===0?createModal():go(['','packs','plugins','snapshots'][n])}))].filter(x=>x.t.toLowerCase().includes(q));document.getElementById('commands').innerHTML=items.map((x,n)=>`<button class="command" data-cmd="${n}">${I('search')}<span>${esc(x.t)}</span><small>${x.sub}</small></button>`).join('')||'<p style="padding:15px">没有匹配结果，试试实例名称。</p>';document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>{closeModal();items[+b.dataset.cmd].fn()})};document.getElementById('commandInput').oninput=render;render();document.getElementById('commandInput').focus()}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));document.querySelectorAll('[data-detail]').forEach(b=>{let fn=()=>{state.selected=+b.dataset.detail;state.tab='概览';state.page='detail';shell()};b.onclick=fn;b.onkeydown=e=>{if(e.target===b&&['Enter',' '].includes(e.key)){e.preventDefault();fn()}}});document.querySelectorAll('[data-launch]').forEach(b=>b.onclick=e=>{e.stopPropagation();launch(+b.dataset.launch)});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;shell()});document.querySelectorAll('[data-pack]').forEach(b=>b.onclick=()=>packModal(+b.dataset.pack));document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;shell()});document.querySelectorAll('[data-stop]').forEach(b=>b.onclick=()=>{let i=instances.find(x=>x.id===+b.dataset.stop);i.status='ready';i.last='刚刚停止';addTask(i.name+' · 停止');shell();toast('实例已停止（演示）')});document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{let key='toggle'+state.selected+b.dataset.toggle;installed[key]=installed[key]===false;persist();shell();toast('扩展状态已保存（演示）')});document.querySelectorAll('[data-plugin]').forEach(b=>b.onclick=()=>{let p=plugins[+b.dataset.plugin];modal(p.name,`<p>${p.desc}</p><div class="checkline"><span>支持引擎</span><span>${p.engine}</span></div><div class="checkline"><span>版本</span><span>${p.version}</span></div><div class="checkline"><span>来源</span><span>${p.source}</span></div>${p.source.includes('/')?`<p style="margin-top:20px"><a href="https://github.com/${p.source}" target="_blank" rel="noopener">查看 GitHub 原项目 ↗</a></p>`:'<p>本地示例资源，不对应真实市场插件。</p>'}`)});document.querySelectorAll('[data-install]').forEach(b=>b.onclick=()=>{let n=+b.dataset.install;if(installed[state.selected+':'+n]){toast('这个扩展已安装到当前实例');return}if(state.offline){toast('离线状态无法安装，请先恢复连接');return}modal('安装 '+plugins[n].name,`<p>目标：${esc(instances.find(i=>i.id===state.selected).name)}</p><div class="notice"><b>安装前会创建恢复点</b><p>本原型仅模拟安装，不下载或执行第三方代码。</p></div>`,`<span>检查来源后继续</span><button id="confirmInstall" class="btn primary">确认安装</button>`);document.getElementById('confirmInstall').onclick=()=>{snaps.unshift({name:'安装 '+plugins[n].name+' 前',instance:state.selected,time:'刚刚'});installed[state.selected+':'+n]=true;instances.find(i=>i.id===state.selected).plugins++;addTask('安装扩展 · '+plugins[n].name);closeModal();shell();toast('扩展已安装，恢复点已保存（演示）')}});document.querySelectorAll('[data-restore]').forEach(b=>b.onclick=()=>{let s=snaps[+b.dataset.restore];modal('恢复到「'+esc(s.name)+'」',`<p>将恢复该实例的配置与扩展清单。</p><div class="notice"><b>当前状态会先自动备份</b><p>恢复后实例停止运行，你可以检查后重新启动。</p></div>`,`<span>演示操作</span><button class="btn primary" id="confirmRestore">备份并恢复</button>`);document.getElementById('confirmRestore').onclick=()=>{snaps.unshift({name:'恢复前自动快照',instance:s.instance,time:'刚刚'});instances.find(i=>i.id===s.instance).status='ready';addTask('恢复状态 · '+s.name);closeModal();shell();toast('已恢复，并保存了恢复前的状态')}});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));let ls=document.getElementById('listSearch');if(ls)ls.oninput=()=>{state.query=ls.value;let pos=ls.selectionStart;shell();let el=document.getElementById('listSearch');el.focus();el.setSelectionRange(pos,pos)};let ps=document.getElementById('pluginSearch');if(ps)ps.oninput=()=>{state.query=ps.value;let pos=ps.selectionStart;shell();let el=document.getElementById('pluginSearch');el.focus();el.setSelectionRange(pos,pos)};let target=document.getElementById('targetInstance');if(target)target.onchange=()=>{state.selected=+target.value;shell()}}
function action(a){if(a==='new')createModal();if(a==='search')command();if(a==='theme'){document.body.classList.toggle('dark');state.dark=document.body.classList.contains('dark');persist();shell()}if(a==='offline'){state.offline=!state.offline;persist();shell();toast(state.offline?'已切换到离线演示':'连接已恢复')}if(a==='snapshot')snapshot();if(a==='export')exportPack();if(a==='import')importPack();if(a==='clearTasks'){tasks=[];persist();shell()}if(a==='reset'){modal('重置演示空间？','<p>这会删除你在本原型中创建的实例和交互记录。</p>','<span>仅影响当前浏览器的演示数据</span><button class="btn primary" id="doReset">确认重置</button>');document.getElementById('doReset').onclick=()=>{localStorage.removeItem('perch-demo');location.reload()}}}
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();command()}if(e.key==='Escape')closeModal();if(e.key==='Tab'&&document.querySelector('.modal')){let els=[...document.querySelectorAll('.modal button,.modal input,.modal select,.modal a')].filter(x=>!x.disabled);let first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});if(state.dark)document.body.classList.add('dark');shell();
</script></body></html>
