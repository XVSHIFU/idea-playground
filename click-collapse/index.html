function ray(x,y){const r=canvas.getBoundingClientRect();pointer.set((x-r.left)/r.width*2-1,-(y-r.top)/r.height*2+1);raycaster.setFromCamera(pointer,camera)}
function pick(x,y){
 const rect=canvas.getBoundingClientRect();let best=null,bestDist=25;
 for(const t of targets){projected.copy(t.p).project(camera);const px=rect.left+(projected.x+1)*rect.width/2,py=rect.top+(1-projected.y)*rect.height/2,dist=Math.hypot(px-x,py-y);if(dist>bestDist||projected.z< -1||projected.z>1)continue;
  // Expanded 44px target is tested at its own centre; nearer geometry blocks it.
  ray(px,py);const hits=raycaster.intersectObjects([wood.mesh,beastMesh,padMesh],false);const targetDist=t.p.distanceTo(raycaster.ray.origin);if(hits.length&&hits[0].distance<targetDist-.19)continue;best=t;bestDist=dist;

}
