<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>食光管家 · AI 饮食与健康生活管家 Demo</title>
<style>
:root{
  --paper:#f5efe3; --paper-2:#efe6d4; --card:#fffdf8; --card-2:#faf5ea;
  --ink:#2b2924; --ink-2:#575247; --muted:#8e8777; --line:#e4d9c5; --line-2:#d6c8ae;
  --green:#2f5d50; --green-2:#3f7a68; --green-soft:#dce8e0;
  --tomato:#d4553a; --tomato-soft:#f8dfd5;
  --yolk:#e9a93a; --yolk-soft:#fbeecb;
  --sky:#4a7a99; --sky-soft:#dde9f1;
  --plum:#7a4f7d; --plum-soft:#efe1ef;
  --shadow:0 1px 0 rgba(80,60,20,.05),0 8px 22px -12px rgba(80,55,15,.35);
  --shadow-lg:0 2px 0 rgba(80,60,20,.05),0 24px 48px -18px rgba(60,40,10,.45);
  --r:14px; --r-sm:9px;
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:system-ui,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  --mono:ui-monospace,"Cascadia Mono","SFMono-Regular",Consolas,monospace;
  --dot:rgba(120,90,40,.07);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --paper:#1c1915; --paper-2:#242019; --card:#2a251e; --card-2:#312b22;
  --ink:#f1e9da; --ink-2:#cfc5b2; --muted:#9a907d; --line:#3d362b; --line-2:#4a4235;
  --green:#86bba6; --green-2:#9fcdb9; --green-soft:#2b3b33;
  --tomato:#ec8063; --tomato-soft:#46281f;
  --yolk:#f0c46c; --yolk-soft:#43361b;
  --sky:#8dbad6; --sky-soft:#22333f;
  --plum:#c79bcb; --plum-soft:#3a2a3b;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 10px 24px -12px rgba(0,0,0,.7);
  --shadow-lg:0 24px 48px -16px rgba(0,0,0,.8);
  --dot:rgba(255,220,160,.035);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:18px 18px;color:var(--ink);font:14px/1.55 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--green)}
h1,h2,h3,h4{font-family:var(--serif);margin:0;font-weight:700;letter-spacing:.02em}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.small{font-size:12px}
.hidden{display:none!important}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px dashed var(--line-2);display:flex;flex-direction:column;gap:4px;background:linear-gradient(180deg,var(--paper-2),transparent 70%)}
.brand{display:flex;gap:10px;align-items:center;padding:4px 10px 18px}
.brand-logo{width:42px;height:42px;border-radius:50%;background:var(--green);display:grid;place-items:center;font-size:22px;box-shadow:inset 0 0 0 3px var(--card),0 0 0 1.5px var(--green)}
.brand b{font-family:var(--serif);font-size:19px;display:block;line-height:1.1}
.brand span{font-size:11px;color:var(--muted);letter-spacing:.12em}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:var(--ink-2);text-decoration:none;border:0;background:none;width:100%;text-align:left;position:relative;transition:background .15s}
.nav-item:hover{background:var(--card-2)}
.nav-item .ico{width:22px;text-align:center;font-size:17px}
.nav-item.active{color:var(--ink);font-weight:600}
.nav-item.active::before{content:"";position:absolute;inset:3px -4px 3px -6px;background:var(--yolk-soft);border-radius:4px;transform:rotate(-1.2deg);z-index:-1;box-shadow:0 1px 0 rgba(0,0,0,.05)}
.nav-item .count{margin-left:auto;background:var(--tomato);color:#fff;font-size:11px;border-radius:9px;padding:0 6px;min-width:18px;text-align:center}
.side-foot{margin-top:auto;font-size:11px;color:var(--muted);padding:10px;border-top:1px dashed var(--line-2);line-height:1.6}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:16px 28px;position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px dashed var(--line)}
.top h1{font-size:22px}
.top .crumb{font-size:12px;color:var(--muted);font-family:var(--mono)}
.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:16px;position:relative;transition:transform .15s}
.icon-btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.icon-btn .dot{position:absolute;top:5px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--tomato);border:2px solid var(--card)}
.page{padding:24px 28px 120px;max-width:1280px;width:100%;animation:pageIn .35s ease}
@keyframes pageIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.disclaimer{font-size:11px;color:var(--muted);text-align:center;padding:10px 0 0}

/* ---------- generic ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.card-h{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card-h h3{font-size:16px}
.card-h .sp{margin-left:auto}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.sp{margin-left:auto}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--card);padding:7px 14px;border-radius:999px;font-size:13px;transition:all .15s;white-space:nowrap}
.btn:hover{border-color:var(--ink-2);transform:translateY(-1px)}
.btn:active{transform:none}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.pri{background:var(--green);border-color:var(--green);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#13201b}
.btn.warn{background:var(--tomato);border-color:var(--tomato);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--card-2)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.xs{padding:2px 8px;font-size:11px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:11px;background:var(--card-2);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap}
.badge.g{background:var(--green-soft);color:var(--green);border-color:transparent}
.badge.r{background:var(--tomato-soft);color:var(--tomato);border-color:transparent}
.badge.y{background:var(--yolk-soft);color:#9a6a12;border-color:transparent}
:root[data-theme="dark"] .badge.y{color:var(--yolk)}
.badge.b{background:var(--sky-soft);color:var(--sky);border-color:transparent}
.badge.p{background:var(--plum-soft);color:var(--plum);border-color:transparent}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px dashed var(--line-2);background:transparent;border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--ink-2);transition:all .15s}
.chip:hover{border-style:solid;color:var(--ink)}
.chip.on{background:var(--ink);color:var(--paper);border:1px solid var(--ink)}
.seg{display:inline-flex;background:var(--paper-2);border-radius:999px;padding:3px;border:1px solid var(--line)}
.seg button{border:0;background:transparent;padding:5px 13px;border-radius:999px;font-size:12.5px;color:var(--ink-2)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line-2);background:var(--card);border-radius:10px;padding:8px 11px;outline:none;transition:border .15s}
.input:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--ink-2)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hr{border:0;border-top:1px dashed var(--line-2);margin:14px 0}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.empty .big{font-size:38px;display:block;margin-bottom:6px;opacity:.7}
.section-title{font-family:var(--serif);font-size:15px;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.section-title::after{content:"";flex:1;border-top:1px dashed var(--line-2)}
.tape{position:relative}
.tape::before{content:"";position:absolute;top:-9px;left:50%;width:74px;height:18px;transform:translateX(-50%) rotate(-3deg);background:color-mix(in srgb,var(--yolk) 45%,transparent);border-left:2px dotted rgba(255,255,255,.5);border-right:2px dotted rgba(255,255,255,.5)}
.note{background:var(--yolk-soft);border-radius:4px;padding:16px;box-shadow:var(--shadow);position:relative}
.note.green{background:var(--green-soft)}
.note.red{background:var(--tomato-soft)}
.note.blue{background:var(--sky-soft)}
.note h4{font-size:14px;margin-bottom:8px}
.tilt-l{transform:rotate(-.8deg)} .tilt-r{transform:rotate(.7deg)}
.progress{height:7px;background:var(--paper-2);border-radius:9px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--green);border-radius:9px;transition:width .5s}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line);padding:6px 8px}
table.t td{border-bottom:1px dashed var(--line);padding:7px 8px}
.warn-line{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;background:var(--yolk-soft);border-radius:8px;padding:8px 10px;color:var(--ink-2)}
.danger-line{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;background:var(--tomato-soft);border-radius:8px;padding:8px 10px;color:var(--ink)}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:22px;align-items:stretch}
.hello{font-family:var(--serif);font-size:28px;line-height:1.3}
.hello small{display:block;font-family:var(--sans);font-size:13px;color:var(--muted);margin-top:4px}
.plate-wrap{display:flex;gap:22px;align-items:center}
.plate{width:230px;height:230px;flex:none;filter:drop-shadow(0 12px 18px rgba(80,50,10,.18))}
.plate .sector{transition:opacity .3s;cursor:pointer}
.plate .sector:hover{opacity:.82}
.meal-today{display:flex;flex-direction:column;gap:10px;flex:1;min-width:0}
.mt{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.mt .em{font-size:26px;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--paper-2);flex:none}
.mt .txt{min-width:0;flex:1}
.mt .txt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt.done{background:var(--green-soft);border-color:transparent}
.mt.done .em{background:var(--card)}
.slot-tag{font-size:11px;color:var(--muted);letter-spacing:.1em}
.nutri-bars{display:grid;gap:9px}
.nb{display:grid;grid-template-columns:52px 1fr 92px;gap:10px;align-items:center;font-size:12.5px}
.nb .progress{height:9px}
.notes-board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-top:22px}
.mini-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.mini-list li{display:flex;align-items:center;gap:8px}
.water-glass{display:flex;gap:4px;margin:6px 0 8px}
.water-glass i{width:16px;height:24px;border:1.5px solid var(--sky);border-top:none;border-radius:0 0 5px 5px;position:relative;overflow:hidden}
.water-glass i.full::after{content:"";position:absolute;inset:30% 0 0;background:var(--sky);opacity:.7}

/* ---------- plan ---------- */
.plan-layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:20px}
.week{display:grid;gap:10px;grid-template-columns:62px repeat(var(--days),minmax(0,1fr))}
.week .dh{text-align:center;padding:6px 2px 10px;position:relative}
.week .dh b{font-family:var(--serif);font-size:15px;display:block}
.week .dh span{font-size:11px;color:var(--muted);font-family:var(--mono)}
.week .dh.today::before{content:"";position:absolute;inset:0 6px 4px;background:color-mix(in srgb,var(--tomato) 22%,transparent);transform:rotate(-2deg);border-radius:3px;z-index:-1}
.week .sl{font-size:12px;color:var(--muted);writing-mode:vertical-rl;text-align:center;align-self:center;letter-spacing:.3em;justify-self:center}
.sticker{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 9px;min-height:96px;display:flex;flex-direction:column;gap:3px;cursor:pointer;transition:transform .18s,box-shadow .18s;position:relative;box-shadow:var(--shadow)}
.sticker:hover{transform:translateY(-2px) rotate(-.6deg);box-shadow:var(--shadow-lg)}
.sticker .em{font-size:26px;line-height:1}
.sticker b{font-size:12.5px;line-height:1.3}
.sticker .meta{font-size:10.5px;color:var(--muted)}
.sticker.eaten{background:var(--green-soft);border-color:transparent}
.sticker.eaten::after{content:"已吃";position:absolute;right:7px;top:7px;font-size:10px;color:var(--green);font-weight:700}
.sticker.past:not(.eaten){opacity:.62}
.sticker.changed{animation:flipIn .7s ease}
.sticker.drag-over{outline:2px dashed var(--green);outline-offset:2px}
.sticker.empty-slot{border-style:dashed;align-items:center;justify-content:center;color:var(--muted);box-shadow:none;background:transparent}
@keyframes flipIn{0%{transform:rotateY(90deg)}60%{transform:rotateY(-12deg)}100%{transform:none}}
.ver-list{display:flex;flex-direction:column;gap:0;position:relative}
.ver{display:flex;gap:10px;padding:10px 0 10px 4px;position:relative}
.ver::before{content:"";position:absolute;left:12px;top:0;bottom:0;border-left:2px dotted var(--line-2)}
.ver:first-child::before{top:18px}
.ver:last-child::before{bottom:calc(100% - 18px)}
.ver .vdot{width:18px;height:18px;border-radius:50%;background:var(--card);border:2px solid var(--line-2);flex:none;position:relative;z-index:1;margin-top:1px}
.ver.active .vdot{background:var(--green);border-color:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.ver .vb{flex:1;min-width:0}
.ver .vb b{font-family:var(--mono);font-size:13px}
.ver .vb p{margin:2px 0 6px;font-size:12px;color:var(--ink-2)}
.diff-row{display:grid;grid-template-columns:110px 1fr 20px 1fr;gap:8px;align-items:center;font-size:13px;padding:7px 0;border-bottom:1px dashed var(--line)}
.diff-row .old{text-decoration:line-through;color:var(--tomato)}
.diff-row .new{color:var(--green);font-weight:600}

/* ---------- pantry (fridge) ---------- */
.fridge{display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
.shelf{background:linear-gradient(180deg,var(--card),var(--card-2));border:1px solid var(--line);border-radius:18px;padding:16px 18px 8px;position:relative;box-shadow:var(--shadow)}
.shelf-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.shelf-h h3{font-size:16px}
.shelf-h .temp{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);padding:1px 7px;border-radius:6px}
.shelf.cold{background:linear-gradient(180deg,color-mix(in srgb,var(--sky-soft) 60%,var(--card)),var(--card))}
.shelf.freeze{background:linear-gradient(180deg,color-mix(in srgb,var(--sky-soft) 100%,var(--card)),var(--card))}
.jars{display:flex;flex-wrap:wrap;gap:14px;padding-bottom:14px;border-bottom:6px solid var(--line);margin-bottom:6px;border-radius:0 0 4px 4px}
.jar{width:112px;padding:12px 8px 10px;border-radius:16px 16px 12px 12px;background:var(--card);border:1px solid var(--line);text-align:center;cursor:pointer;transition:transform .2s,box-shadow .2s;position:relative}
.jar:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.jar .em{font-size:34px;line-height:1.1;display:block}
.jar b{font-size:13px;display:block;margin-top:4px}
.jar .amt{font-family:var(--mono);font-size:11.5px;color:var(--ink-2)}
.jar .exp{position:absolute;top:-8px;right:-6px;font-size:10.5px;padding:1px 7px;border-radius:999px;background:var(--green-soft);color:var(--green);font-weight:600;border:2px solid var(--card)}
.jar.soon .exp{background:var(--yolk);color:#3b2a06}
.jar.urgent{animation:wobble 2.6s ease-in-out infinite}
.jar.urgent .exp{background:var(--tomato);color:#fff}
.jar.expired{opacity:.7;filter:grayscale(.5)}
.jar.expired .exp{background:var(--ink);color:var(--paper)}
.jar .unk{display:inline-block;margin-top:3px}
.jar .lvl{height:4px;border-radius:4px;background:var(--paper-2);margin:6px 6px 0;overflow:hidden}
.jar .lvl i{display:block;height:100%;background:var(--green-2)}
@keyframes wobble{0%,86%,100%{transform:rotate(0)}89%{transform:rotate(-4deg)}93%{transform:rotate(4deg)}96%{transform:rotate(-2deg)}}
.mv{display:grid;grid-template-columns:110px 92px 1fr 80px;gap:8px;font-size:12.5px;padding:6px 0;border-bottom:1px dashed var(--line);align-items:center}
.mv .delta.pos{color:var(--green)} .mv .delta.neg{color:var(--tomato)}
.recog-img{width:100%;max-height:220px;object-fit:cover;border-radius:12px;border:1px solid var(--line);position:relative}
.recog-wrap{position:relative}
.scan-line{position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--green),transparent);animation:scan 1.1s linear infinite;top:0}
@keyframes scan{from{top:0}to{top:100%}}
.cand{display:grid;grid-template-columns:24px 1.2fr 1fr 1fr 1fr 28px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}

/* ---------- recipes ---------- */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.rcard{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s;box-shadow:var(--shadow);display:flex;flex-direction:column}
.rcard:hover{transform:translateY(-3px) rotate(-.4deg);box-shadow:var(--shadow-lg)}
.rcard .cover{height:118px;display:grid;place-items:center;font-size:58px;position:relative}
.rcard .cover .fav{position:absolute;top:8px;right:10px;font-size:18px;border:0;background:var(--card);border-radius:50%;width:32px;height:32px;display:grid;place-items:center;box-shadow:var(--shadow)}
.rcard .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:7px;flex:1}
.rcard h4{font-size:15px}
.rcard .meta{font-size:12px;color:var(--muted);display:flex;gap:10px}
.match{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-2)}
.match .progress{flex:1;height:6px}
.ing-row{display:grid;grid-template-columns:28px 1fr auto auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
.ing-row.miss b{color:var(--tomato)}
.steps-mini{counter-reset:s;list-style:none;padding:0;margin:0}
.steps-mini li{counter-increment:s;padding:6px 0 6px 32px;position:relative;font-size:13px}
.steps-mini li::before{content:counter(s);position:absolute;left:0;top:6px;width:22px;height:22px;border-radius:50%;background:var(--yolk-soft);display:grid;place-items:center;font-size:11px;font-weight:700}

/* cooking mode */
.cook{position:fixed;inset:0;z-index:90;background:#191612;color:#f3ead8;display:flex;flex-direction:column;animation:pageIn .3s}
.cook-top{display:flex;align-items:center;gap:14px;padding:18px 26px;border-bottom:1px solid #332c22}
.cook-top h2{font-size:20px}
.cook-prog{display:flex;gap:6px;flex:1;max-width:420px;margin-left:auto}
.cook-prog i{flex:1;height:5px;border-radius:4px;background:#3a3227}
.cook-prog i.on{background:#f0c46c}
.cook-body{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:40px;padding:40px 60px;align-items:center;max-width:1200px;margin:0 auto;width:100%}
.cook-step-n{font-family:var(--mono);color:#f0c46c;font-size:14px;letter-spacing:.2em}
.cook-text{font-family:var(--serif);font-size:clamp(24px,3.4vw,40px);line-height:1.45;margin-top:12px}
.timer{width:260px;height:260px;position:relative;margin:0 auto}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer .tv{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.timer .tv b{font-family:var(--mono);font-size:44px;font-weight:500}
.timer .tv span{font-size:12px;color:#a69c88;display:block}
.cook-foot{display:flex;gap:12px;justify-content:center;padding:22px;border-top:1px solid #332c22;flex-wrap:wrap}
.cook .btn{background:#2a241c;border-color:#463c2e;color:#f3ead8}
.cook .btn.pri{background:#f0c46c;border-color:#f0c46c;color:#2a1f08}

/* ---------- shopping ---------- */
.shop-list{background:var(--card);border-radius:6px;padding:8px 22px 12px 46px;position:relative;box-shadow:var(--shadow);background-image:repeating-linear-gradient(var(--card) 0 43px,var(--line) 43px 44px);border:1px solid var(--line)}
.shop-list::before{content:"";position:absolute;left:34px;top:0;bottom:0;border-left:2px solid color-mix(in srgb,var(--tomato) 45%,transparent)}
.si{display:flex;align-items:center;gap:10px;min-height:44px;font-size:14px}
.si .ck{width:20px;height:20px;accent-color:var(--green)}
.si .nm{flex:1;min-width:0;position:relative;transition:color .3s}
.si .nm::after{content:"";position:absolute;left:0;top:50%;height:2px;width:0;background:var(--ink-2);transition:width .4s}
.si.struck .nm{color:var(--muted)}
.si.struck .nm::after{width:100%}
.stamp{font-family:var(--serif);font-size:11px;font-weight:700;padding:1px 7px;border:2px solid currentColor;border-radius:5px;transform:rotate(-6deg);display:inline-block;letter-spacing:.08em;opacity:.85}
.stamp.proposed{color:var(--muted)}
.stamp.confirmed{color:var(--sky)}
.stamp.purchased{color:var(--yolk)}
.stamp.received{color:var(--green)}
.stamp.cancelled{color:var(--tomato)}
.flow{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.flow i{width:8px;height:8px;border-radius:50%;background:var(--line-2);display:inline-block}
.flow i.on{background:var(--green)}

/* ---------- meals ---------- */
.daystrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:9px 4px;text-align:center;cursor:pointer;transition:all .15s}
.day b{display:block;font-family:var(--serif);font-size:18px}
.day span{font-size:11px;color:var(--muted)}
.day .dots{display:flex;justify-content:center;gap:3px;margin-top:5px;height:6px}
.day .dots i{width:6px;height:6px;border-radius:50%;background:var(--line-2)}
.day .dots i.on{background:var(--green)}
.day.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.day.on span{color:var(--line-2)}
.timeline{position:relative;padding-left:26px}
.timeline::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;border-left:2px dotted var(--line-2)}
.tl{position:relative;margin-bottom:16px}
.tl::before{content:"";position:absolute;left:-23px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--card);border:2px solid var(--green)}
.tl h4{font-size:14px;margin-bottom:8px;display:flex;gap:8px;align-items:center}
.meal-rec{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.meal-rec .em{font-size:28px}
.meal-rec .info{flex:1;min-width:0}
.nut-inline{display:flex;gap:10px;font-size:11.5px;color:var(--ink-2);font-family:var(--mono);flex-wrap:wrap}
.ncard{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.ncard .n{background:var(--paper-2);border-radius:10px;padding:10px;text-align:center}
.ncard .n b{display:block;font-family:var(--mono);font-size:18px}
.ncard .n span{font-size:11px;color:var(--muted)}
.ncard .n.unk b{color:var(--muted)}

/* ---------- habits & report ---------- */
.habit{display:flex;flex-direction:column;gap:10px}
.habit .big{font-family:var(--mono);font-size:30px;line-height:1}
.habit .big small{font-size:13px;color:var(--muted)}
.spark{width:100%;height:70px}
.metric{padding:14px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.metric .v{font-family:var(--mono);font-size:28px;line-height:1.1;margin:4px 0}
.metric .l{font-size:12px;color:var(--muted)}
.metric .s{font-size:11.5px;color:var(--ink-2)}
.report-paper{background:var(--card);border:1px solid var(--line);padding:26px 30px;border-radius:4px;box-shadow:var(--shadow-lg);position:relative;font-size:14px;line-height:1.85}
.report-paper h2{font-size:20px;margin-bottom:4px}
.report-paper .ai-tag{font-size:11px}
.stale-banner{display:flex;gap:10px;align-items:center;background:var(--yolk-soft);border:1px dashed var(--yolk);padding:10px 14px;border-radius:10px;margin-bottom:14px;font-size:13px}
.chart{width:100%;height:220px}
.chart text{font-size:10px;fill:var(--muted);font-family:var(--mono)}

/* ---------- settings ---------- */
.set-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.set-row .t{flex:1;min-width:0}
.set-row .t b{display:block;font-size:14px}
.set-row .t span{font-size:12px;color:var(--muted)}
.restr{display:inline-flex;align-items:center;gap:6px;padding:5px 6px 5px 12px;border-radius:999px;font-size:13px;margin:0 6px 8px 0}
.restr button{border:0;background:rgba(0,0,0,.08);width:20px;height:20px;border-radius:50%;font-size:11px;line-height:1}

/* ---------- assistant ---------- */
.chef-ball{position:fixed;right:26px;bottom:26px;z-index:60;width:62px;height:62px;border-radius:50%;border:0;background:var(--green);color:#fff;font-size:30px;box-shadow:0 10px 28px -6px color-mix(in srgb,var(--green) 70%,transparent);display:grid;place-items:center;animation:breathe 3.2s ease-in-out infinite;transition:transform .2s}
.chef-ball:hover{transform:scale(1.07)}
.chef-ball .dot{position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;background:var(--tomato);border:3px solid var(--paper);font-size:9px;display:grid;place-items:center;color:#fff}
@keyframes breathe{0%,100%{box-shadow:0 10px 28px -6px color-mix(in srgb,var(--green) 70%,transparent),0 0 0 0 color-mix(in srgb,var(--green) 35%,transparent)}50%{box-shadow:0 10px 28px -6px color-mix(in srgb,var(--green) 70%,transparent),0 0 0 12px transparent}}
.drawer{position:fixed;right:18px;bottom:100px;top:84px;width:420px;z-index:70;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;overflow:hidden;transform-origin:bottom right;animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(10px)}to{opacity:1;transform:none}}
.drawer-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px dashed var(--line);background:var(--card-2)}
.drawer-h .av{width:34px;height:34px;border-radius:50%;background:var(--green);display:grid;place-items:center;font-size:18px}
.drawer-h b{font-family:var(--serif)}
.ctx-chip{font-size:11px;color:var(--muted)}
.chat{display:flex;flex-direction:column;min-height:0;flex:1}
.msgs{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.msg{display:flex;gap:9px;max-width:100%}
.msg.user{justify-content:flex-end}
.msg .bub{padding:9px 13px;border-radius:16px;max-width:86%;font-size:13.5px;white-space:pre-wrap;word-break:break-word}
.msg.user .bub{background:var(--green);color:#fff;border-bottom-right-radius:4px}
:root[data-theme="dark"] .msg.user .bub{color:#10201a}
.msg.ai .av{width:30px;height:30px;border-radius:50%;background:var(--green-soft);display:grid;place-items:center;flex:none;font-size:16px}
.msg.ai .stack{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1}
.msg.ai .bub{background:var(--paper-2);border-bottom-left-radius:4px;max-width:100%}
.msg.user img{max-width:180px;border-radius:12px;display:block;margin-bottom:6px}
.trace{display:flex;flex-direction:column;gap:5px}
.trace-h{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;cursor:pointer;border:0;background:none;padding:0}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:12px;padding:4px 11px 4px 8px;border-radius:999px;background:var(--card-2);border:1px solid var(--line);width:fit-content;max-width:100%}
.pill code{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.pill .st{width:14px;height:14px;display:grid;place-items:center;font-size:11px}
.pill.run .st::before{content:"";width:10px;height:10px;border:2px solid var(--green);border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
.pill.ok .st::before{content:"";width:4px;height:8px;border:solid var(--green);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.pill.err .st::before{content:"!";color:var(--tomato);font-weight:700}
@keyframes spin{to{transform:rotate(360deg)}}
.caret{display:inline-block;width:7px;height:15px;background:var(--green);vertical-align:-2px;margin-left:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.cites{display:flex;gap:6px;flex-wrap:wrap}
.cite{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--sky);background:var(--card)}
.composer{border-top:1px dashed var(--line);padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;background:var(--card)}
.quick{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.quick .chip{flex:none;font-size:12px}
.comp-row{display:flex;gap:8px;align-items:flex-end}
.comp-row textarea{flex:1;resize:none;min-height:40px;max-height:120px;border-radius:14px}
.comp-row .icon-btn{flex:none}
.icon-btn.rec{background:var(--tomato);color:#fff;border-color:var(--tomato);animation:recPulse 1s infinite}
@keyframes recPulse{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--tomato) 25%,transparent)}}
.attach-prev{display:flex;align-items:center;gap:8px;font-size:12px;background:var(--paper-2);padding:5px 8px;border-radius:10px;width:fit-content}
.attach-prev img{width:34px;height:34px;object-fit:cover;border-radius:6px}
/* assistant page */
.asst{display:grid;grid-template-columns:240px minmax(0,1fr);height:calc(100vh - 160px);min-height:520px;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.threads{border-right:1px dashed var(--line);padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--card-2);overflow-y:auto}
.thread{border:0;background:transparent;text-align:left;padding:9px 11px;border-radius:10px;font-size:13px;width:100%}
.thread.on{background:var(--card);box-shadow:var(--shadow);font-weight:600}
.thread span{display:block;font-size:11px;color:var(--muted);font-weight:400}

/* structured cards in chat */
.scard{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:12px 14px;font-size:13px}
.scard-h{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-weight:600;font-size:13px}
.scard-h .type{font-family:var(--mono);font-size:10px;color:var(--muted);font-weight:400;margin-left:auto}
.approval{position:relative;background:var(--card);border:1.5px dashed var(--ink-2);border-radius:6px;padding:14px 16px;overflow:hidden;background-image:linear-gradient(var(--card-2) 0 34px,transparent 34px)}
.approval .ap-h{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-weight:700;margin:-4px 0 12px}
.approval .ap-h .no{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--muted);font-weight:400}
.approval .ap-target{font-size:12px;color:var(--ink-2);margin-bottom:8px}
.approval .ap-diff{display:grid;grid-template-columns:1fr 24px 1fr;gap:6px;align-items:center;margin-bottom:10px}
.approval .ap-diff .box{border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;font-size:12.5px;background:var(--card)}
.approval .ap-diff .box .em{font-size:26px;display:block}
.approval .ap-diff .box.old{opacity:.65;text-decoration:line-through}
.approval .ap-lines{font-size:12px;color:var(--ink-2);display:flex;flex-direction:column;gap:3px;margin-bottom:10px}
.approval .ap-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.approval .ap-foot .exp{font-size:11px;color:var(--muted);font-family:var(--mono)}
.seal{position:absolute;right:14px;top:44px;width:96px;height:96px;border-radius:50%;border:3px solid var(--tomato);color:var(--tomato);display:grid;place-items:center;font-family:var(--serif);font-weight:900;font-size:18px;transform:rotate(-14deg);opacity:.88;pointer-events:none;animation:stamp .45s cubic-bezier(.2,1.6,.4,1)}
.seal::before{content:"";position:absolute;inset:5px;border:1.5px solid currentColor;border-radius:50%}
.seal small{display:block;font-size:9px;font-family:var(--mono);font-weight:400;text-align:center}
.seal.ok{color:var(--green);border-color:var(--green)}
.seal.no{color:var(--muted);border-color:var(--muted)}
@keyframes stamp{0%{transform:scale(2.4) rotate(-14deg);opacity:0}100%{transform:scale(1) rotate(-14deg);opacity:.88}}
.mini-grid{display:grid;gap:4px;font-size:11.5px}
.mini-grid .c{background:var(--paper-2);border-radius:7px;padding:5px 6px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-grid .h{font-weight:600;text-align:center;color:var(--muted)}
.sys-line{font-size:11px;color:var(--muted);text-align:center;font-family:var(--mono)}

/* ---------- overlays ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(30,22,10,.42);z-index:80;display:grid;place-items:center;padding:20px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--card);border-radius:20px;width:min(560px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:pop .22s;border:1px solid var(--line)}
.modal.wide{width:min(820px,100%)}
.modal-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px dashed var(--line)}
.modal-h h3{font-size:17px}
.modal-b{padding:18px 20px;overflow-y:auto}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px 16px;border-top:1px dashed var(--line);flex-wrap:wrap}
.toasts{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;font-size:13px;box-shadow:var(--shadow-lg);animation:pop .25s;display:flex;gap:8px;align-items:center}
.toast.err{background:var(--tomato);color:#fff}
.dropdown{position:absolute;top:48px;right:0;width:330px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);z-index:50;padding:8px;animation:pop .2s;max-height:420px;overflow-y:auto}
.notif{display:flex;gap:10px;padding:9px 10px;border-radius:10px;font-size:13px;cursor:pointer}
.notif:hover{background:var(--card-2)}
.notif.unread{background:color-mix(in srgb,var(--yolk-soft) 60%,transparent)}
.notif .em{font-size:18px}
.notif span{display:block;font-size:11px;color:var(--muted)}

/* mobile */
.tabbar{display:none}
.sheet-bg{position:fixed;inset:0;background:rgba(30,22,10,.4);z-index:85;animation:fade .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:86;background:var(--card);border-radius:22px 22px 0 0;padding:18px 16px 28px;animation:up .25s ease;box-shadow:var(--shadow-lg)}
@keyframes up{from{transform:translateY(100%)}}
.sheet-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sheet-grid button{border:1px solid var(--line);background:var(--card-2);border-radius:14px;padding:12px 4px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:4px}
.sheet-grid button span{font-size:24px}

@media (max-width:1100px){
  .app{grid-template-columns:72px minmax(0,1fr)}
  .side{padding:18px 8px}
  .brand>div,.nav-item .lbl,.side-foot,.nav-item .count{display:none}
  .brand{justify-content:center;padding:4px 0 14px}
  .nav-item{justify-content:center;padding:11px 0}
  .nav-item .ico{font-size:19px}
  .notes-board{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero{grid-template-columns:minmax(0,1fr)}
  .plan-layout{grid-template-columns:minmax(0,1fr)}
  .cook-body{grid-template-columns:1fr;padding:30px;gap:24px}
}
@media (max-width:720px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .top{padding:12px 16px}
  .top h1{font-size:19px}
  .top .crumb{display:none}
  .page{padding:16px 16px 140px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .g4.keep2,.g3.keep2{grid-template-columns:1fr 1fr}
  .notes-board{grid-template-columns:1fr}
  .plate-wrap{flex-direction:column}
  .plate{width:200px;height:200px}
  .meal-today{width:100%}
  .week{grid-template-columns:repeat(var(--days),minmax(150px,1fr));overflow-x:auto;padding-bottom:8px}
  .week-scroll{overflow-x:auto;margin:0 -16px;padding:0 16px}
  .week .sl{display:none}
  .week .corner{display:none}
  .jar{width:calc(50% - 7px)}
  .form-grid{grid-template-columns:1fr}
  .cand{grid-template-columns:24px 1fr 1fr;row-gap:6px}
  .mv{grid-template-columns:1fr 1fr}
  .ncard{grid-template-columns:repeat(2,1fr)}
  .daystrip{gap:4px}
  .day b{font-size:15px}
  .asst{grid-template-columns:1fr;height:calc(100vh - 210px)}
  .threads{display:none}
  .drawer{inset:0;width:auto;border-radius:0;z-index:95}
  .chef-ball{bottom:84px;right:16px;width:54px;height:54px;font-size:26px}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;z-index:65;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;font-size:10.5px;color:var(--muted);gap:1px;padding:4px 0}
  .tabbar button span{font-size:20px}
  .tabbar button.on{color:var(--green);font-weight:700}
  .tabbar .plus span{width:46px;height:46px;border-radius:50%;background:var(--tomato);color:#fff;display:grid;place-items:center;margin-top:-22px;box-shadow:var(--shadow-lg);font-size:26px;border:4px solid var(--card)}
  .diff-row{grid-template-columns:1fr 1fr;}
  .report-paper{padding:18px}
  .toasts{bottom:90px}
  .dropdown{position:fixed;left:12px;right:12px;width:auto;top:64px}
  .cook-body{padding:20px}
  .timer{width:200px;height:200px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- SVG icon system ---------- */
.ic{width:1.15em;height:1.15em;display:inline-block;vertical-align:-.22em;flex:none;overflow:visible}
.ic.food,.ic.dish{width:1.3em;height:1.3em;vertical-align:-.3em}
.btn .ic{width:1.05em;height:1.05em}
.brand-logo .ic{color:#fff;width:24px;height:24px}
.chef-ball .ic{width:30px;height:30px;stroke-width:1.6}
.av .ic{width:60%;height:60%}
.drawer-h .av .ic,.chef-ball .ic{color:#fff}
.msg.ai .av{color:var(--green)}
.nav-item .ico .ic{width:20px;height:20px}
.icon-btn .ic{width:18px;height:18px}
.tabbar button span .ic{width:22px;height:22px}
.tabbar .plus span .ic{width:24px;height:24px;stroke-width:2.4}
.sheet-grid button span .ic{width:26px;height:26px}
.empty .big .ic{width:44px;height:44px;stroke-width:1.4}
.cook-big .ic{width:120px;height:120px;stroke-width:1.1;color:#f0c46c}
.rcard .cover .ic.dish{width:96px;height:96px;filter:drop-shadow(0 6px 8px rgba(60,40,10,.18))}
.jar .em .ic{width:44px;height:44px}
.sticker .em .ic{width:34px;height:34px}
.mt .em .ic{width:34px;height:34px}
.meal-rec .em .ic{width:36px;height:36px}
.slot-ic{color:var(--muted)}

</style>
</head>
<body>
<div class="app">
  <nav class="side" id="side" aria-label="主导航"></nav>
  <div class="main">
    <header class="top" id="top"></header>
    <main class="page" id="page"></main>

/* ---------------- services: nutrition ---------------- */
function gramsOf(foodId, amount) {
  const f = FOODS[foodId];
  if (f.unit === 'g') return { g: amount, basis: 'measured' };
  if (f.unit === 'ml') return f.density ? { g: amount * f.density, basis: 'measured' } : null;
  if (f.unit === 'piece') return f.pieceG ? { g: amount * f.pieceG, basis: 'standardized_portion' } : null;
  return null;
}
// items: [{foodId, amount}] → {v:[kcal,p,f,c], unknown:[names], complete, basis}
function nutritionOf(items) {
  const v = [0, 0, 0, 0]; const unknown = []; const bases = new Set();
  items.forEach(({ foodId, amount }) => {
    const f = FOODS[foodId]; const g = gramsOf(foodId, amount);
    if (!f.n || !g) { unknown.push(f.name); return; }
    bases.add(g.basis);
    for (let i = 0; i < 4; i++) v[i] += g.g / 100 * f.n[i];
  });
  return { v: v.map(r1), unknown, complete: unknown.length === 0, basis: unknown.length ? 'partial' : (bases.has('standardized_portion') ? 'standardized_portion' : 'measured') };
}
function recipeItems(r, servings = 1) { return r.ing.map(([id, a]) => ({ foodId: id, amount: a * servings / r.serv })); }
function recipeNutrition(r, servings = 1) { return nutritionOf(recipeItems(r, servings)); }
function mealNutrition(items) {
  const flat = [];
  items.forEach(it => { if (it.recipeId) flat.push(...recipeItems(R[it.recipeId], it.amount)); else flat.push({ foodId: it.foodId, amount: it.amount }); });
  return nutritionOf(flat);
}

/* ---------------- services: restrictions ---------------- */
function foodHits(foodId, keys) { const f = FOODS[foodId]; return keys.some(k => f.al.includes(k) || f.name.includes(k) || (f.tags || []).includes(k)); }
// returns {blocked:[{label,food}], verify:[foodName]}
function checkRecipe(r, extraKeys = []) {
  const blocked = []; const verify = [];
  const hardKeys = S.restrictions.filter(x => x.hard && x.keys.length).map(x => ({ label: x.label, keys: x.keys, kind: x.kind }));
  if (extraKeys.length) hardKeys.push({ label: extraKeys.join('、'), keys: extraKeys, kind: 'request' });
  r.ing.forEach(([fid]) => {
    hardKeys.forEach(h => { if (foodHits(fid, h.keys)) blocked.push({ label: h.label, food: FOODS[fid].name, kind: h.kind }); });
    if (FOODS[fid].alUnknown) verify.push(FOODS[fid].name);
  });
  return { blocked, verify, ok: blocked.length === 0 };
}

/* ---------------- services: pantry (批次 + 流水) ---------------- */
function addBatch({ foodId, qty, expires, location, purchased, kind = 'OPENING', sourceType = 'manual', sourceId, silent }) {
  const f = FOODS[foodId];
  const id = uid('bt');
  const known = qty !== null && qty !== undefined && qty !== '' && !isNaN(qty);
  const bt = { id, foodId, unit: f.unit, original: known ? Number(qty) : null, remaining: known ? 0 : null, qtyStatus: known ? 'known' : 'unknown', purchased: purchased || D.todayKey(), expires: expires || null, location: location || 'fridge', version: 1, at: D.now() };
  S.batches.push(bt);
  if (known && Number(qty) > 0) moveBatch(id, Number(qty), kind, kind === 'OPENING' ? '初始入库' : '采购入库', sourceType, sourceId || id, 'open-' + id, true);
  else S.movements.push({ id: uid('mv'), batchId: id, foodId, delta: null, kind, reason: '新建批次（数量未知，不参与数值计算）', sourceType, sourceId: sourceId || id, at: D.now() });
  return bt;
}
function moveBatch(batchId, delta, kind, reason, sourceType, sourceId, idemKey, silent) {
  if (idemKey && S.idem[idemKey]) return { dup: true };
  const bt = S.batches.find(b => b.id === batchId);
  if (!bt) throw new Error('NOT_FOUND');
  if (bt.qtyStatus !== 'known') throw new Error('UNIT_CONVERSION_UNKNOWN');
  const next = r1(bt.remaining + delta);
  if (next < 0) throw new Error('库存不足：剩余 ' + bt.remaining);
  bt.remaining = next; bt.version++;
  S.movements.push({ id: uid('mv'), batchId, foodId: bt.foodId, delta: r1(delta), kind, reason, sourceType, sourceId, at: D.now() });
  if (idemKey) S.idem[idemKey] = true;
  return { ok: true };
}
function setBatchKnown(batchId, qty, reason) {
  const bt = S.batches.find(b => b.id === batchId);
  bt.qtyStatus = 'known'; bt.original = Number(qty); bt.remaining = 0; bt.version++;
  moveBatch(batchId, Number(qty), 'ADJUST', reason || '盘点：建立可量化基准', 'adjustment', uid('adj'), null, true);
}
const expDays = bt => bt.expires ? D.diff(bt.expires, D.todayKey()) : 999;
function liveBatches(foodId) { return S.batches.filter(b => b.foodId === foodId && expDays(b) >= 0 && (b.qtyStatus === 'unknown' || b.remaining > 0)); }
function available(foodId) {
  const bs = liveBatches(foodId);
  return { qty: r1(bs.filter(b => b.qtyStatus === 'known').reduce((s, b) => s + b.remaining, 0)), unknown: bs.some(b => b.qtyStatus === 'unknown'), batches: bs };
}
function fefo(foodId, need) {
  const bs = liveBatches(foodId).filter(b => b.qtyStatus === 'known').sort((a, b) => (a.expires || '9') < (b.expires || '9') ? -1 : 1);
  const alloc = []; let left = need;
  bs.forEach(b => { if (left <= 0) return; const take = Math.min(b.remaining, left); alloc.push({ batchId: b.id, amount: r1(take), expires: b.expires, ver: b.version }); left = r1(left - take); });
  return { alloc, short: Math.max(0, r1(left)) };
}
function stockMatch(r) { // 0..1 库存可用度
  const req = r.ing.filter(i => !i[2]);
  let ok = 0;
  req.forEach(([fid, amt]) => { const a = available(fid); if (a.qty >= amt || a.unknown) ok++; else if (a.qty > 0) ok += a.qty / amt; });
  return req.length ? ok / req.length : 1;
}
function urgencyBonus(r) { let s = 0; r.ing.forEach(([fid]) => { available(fid).batches.forEach(b => { const d = expDays(b); if (d <= 2) s += 1; else if (d <= 4) s += .4; }); }); return Math.min(s, 3) / 3; }
function fmtQty(q, unit) { if (q === null || q === undefined) return '数量未知'; return (unit === 'piece' ? r1(q) : r0(q)) + ' ' + unitShort[unit]; }

/* ---------------- services: plan (版本化) ---------------- */
const P = {

  dates() { return Array.from({ length: S.plan.days }, (_, i) => D.add(S.plan.start, i)); },
  get(date, slot) { return P.meals()[date + '|' + slot]; },
  commit(meals, reason, by, expected) {
    if (expected !== undefined && expected !== null && expected !== S.plan.active) { const e = new Error('CONFLICT'); e.code = 'CONFLICT'; e.details = { expected, current: S.plan.active }; throw e; }
    // 硬约束验证：每餐都不得命中禁忌
    for (const k in meals) { const c = checkRecipe(R[meals[k].r]); if (!c.ok) { const e = new Error('违反饮食限制：' + R[meals[k].r].t + ' 含 ' + c.blocked[0].food); e.code = 'VALIDATION_ERROR'; throw e; } }

  replace(date, slot, recipeId, by = 'user', expected) {

  },
  swap(a, b) {
    const m = JSON.parse(JSON.stringify(P.meals()));
    const t = m[a]; m[a] = m[b]; m[b] = t;
    const [da, sa] = a.split('|'), [db, sb] = b.split('|');
    return P.commit(m, `交换 ${D.wd(da)}${SLOTS[sa]} ⇄ ${D.wd(db)}${SLOTS[sb]}`, 'user');
  },
  restore(v) {
    const ver = S.plan.versions.find(x => x.v === v);
    return P.commit(ver.meals, `恢复 v${v} 的内容（生成新版本，不回滚已发生的购买/消耗/记餐）`, 'user');
  },
  diff(a, b) { // version numbers
    const A = S.plan.versions.find(x => x.v === a).meals, B = S.plan.versions.find(x => x.v === b).meals;
    return Object.keys(B).filter(k => !A[k] || A[k].r !== B[k].r || A[k].sv !== B[k].sv).map(k => ({ k, from: A[k], to: B[k] }));
  },
  candidates(slot, { exclude = [], notId, date } = {}) {
    const dates = P.dates(); const near = new Set();
    if (date) { [-1, 0, 1].forEach(o => { const d = D.add(date, o); ['breakfast', 'lunch', 'dinner'].forEach(s => { const m = P.get(d, s); if (m) near.add(m.r); }); }); }
    return RECIPES.filter(r => r.slots.includes(slot) && r.id !== notId).map(r => {
      const chk = checkRecipe(r, exclude);
      const stock = stockMatch(r), urg = urgencyBonus(r), div = near.has(r.id) ? 0 : 1, conv = r.min <= S.user.maxCook ? 1 : 0.3;

    }).sort((a, b) => (b.chk.ok - a.chk.ok) || (b.score - a.score));
  },

function isEaten(date, slot) { return S.meals.some(m => m.date === date && m.slot === slot && m.planned); }

/* ---------------- services: shopping ---------------- */
function computeGap(meals) {
  meals = meals || P.meals();
  const T = D.todayKey(); const need = {}; const first = {};
  P.dates().forEach(d => {
    if (D.diff(d, T) < 0) return;
    ['breakfast', 'lunch', 'dinner'].forEach(slot => {
      const m = meals[d + '|' + slot]; if (!m || isEaten(d, slot)) return;
      const r = R[m.r];
      r.ing.forEach(([fid, amt, opt]) => { if (opt) return; need[fid] = (need[fid] || 0) + amt * m.sv / r.serv; if (!first[fid]) first[fid] = d; });
    });
  });
  return Object.keys(need).map(fid => {
    const a = available(fid);
    const incoming = S.shopping.filter(x => x.foodId === fid && ['confirmed', 'purchased'].includes(x.status)).reduce((s, x) => s + (x.qty || 0), 0);
    const gap = Math.max(0, need[fid] - a.qty - incoming);
    return { foodId: fid, need: r1(need[fid]), avail: a.qty, unknown: a.unknown, incoming, gap: FOODS[fid].unit === 'piece' ? Math.ceil(gap) : Math.ceil(gap / 10) * 10, first: first[fid] };
  }).filter(x => x.gap > 0 && !x.unknown || (x.unknown && x.need > x.avail + x.incoming));
}
function recomputePlanShopping(silent) {
  const keep = S.shopping.filter(x => !(x.origin === 'plan' && x.status === 'proposed'));
  const gaps = computeGap();
  S.shopping = keep.concat(gaps.map(g => ({ id: uid('si'), foodId: g.foodId, qty: g.unknown ? null : g.gap, unit: FOODS[g.foodId].unit, origin: 'plan', planVersion: S.plan.active, status: 'proposed', need: g.need, avail: g.avail, incoming: g.incoming, unknownStock: g.unknown, first: g.first })));
}
function receiveItem(itemId, { qty, expires, location }) {
  const it = S.shopping.find(x => x.id === itemId);
  if (!it || it.status === 'received') return { dup: true };
  const bt = addBatch({ foodId: it.foodId, qty, expires, location, kind: 'PURCHASE_IN', sourceType: 'stock_receipt', sourceId: 'rc_' + itemId });
  it.status = 'received'; it.receivedQty = qty; it.batchId = bt.id;

}

/* ---------------- services: meals ---------------- */
function createMeal({ date, slot, items, source = 'manual', planned = false, note = '', silent, at }) {
  const nut = mealNutrition(items);
  const first = items[0];
  const title = items.map(it => it.recipeId ? R[it.recipeId].t : FOODS[it.foodId].name).join(' + ');
  const em = first.recipeId ? '[[r:' + first.recipeId + ']]' : '[[f:' + first.foodId + ']]';
  const m = { id: uid('ml'), date, slot, items, title, em, source, planned, note, nut, version: 1, at: at || D.now() };
  S.meals.push(m);

}
function updateMeal(id, items) { const m = S.meals.find(x => x.id === id); m.items = items; m.nut = mealNutrition(items); m.version++; markStale(m.date, 'meal'); }
function deleteMeal(id) { const m = S.meals.find(x => x.id === id); S.meals = S.meals.filter(x => x.id !== id); markStale(m.date, 'meal'); }

  ms.forEach(m => { m.nut.v.forEach((x, i) => v[i] += x); if (!m.nut.complete) partial = true; });

/* ---------------- services: reports ---------------- */
function markStale(date, why) {

}
function weekMetrics(mon) {
  const T = D.todayKey();
  const days = D.week(mon).filter(d => D.diff(d, T) <= 0);
  const recDays = days.filter(d => S.meals.some(m => m.date === d));
  let judge = 0, done = 0;
  recDays.forEach(d => ['breakfast', 'lunch', 'dinner'].forEach(slot => {
    if (d === T) { const h = new Date().getHours(); if ((slot === 'lunch' && h < 14) || (slot === 'dinner' && h < 21)) return; }
    if (P.get(d, slot)) { judge++; if (isEaten(d, slot)) done++; }
  }));
  const kcalByDay = D.week(mon).map(d => { if (!recDays.includes(d)) return null; return r0(dayNutrition(d).v[0]); });
  const recK = kcalByDay.filter(x => x !== null);
  const habit = (k, agg) => { const by = {}; S.habits.filter(h => h.kind === k && days.includes(h.date)).forEach(h => { by[h.date] = agg === 'sum' ? (by[h.date] || 0) + h.value : h.value; }); const vals = Object.values(by); return { avg: vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null, n: vals.length }; };

    recordRate: days.length ? r0(recDays.length / days.length * 100) : 0,
    planRate: judge ? r0(done / judge * 100) : null, planJudge: judge, planDone: done,
    avgKcal: recK.length ? r0(recK.reduce((a, b) => a + b, 0) / recK.length) : null,
    avgProtein: prot.length ? r0(prot.reduce((a, b) => a + b, 0) / prot.length) : null,
    partialNut: S.meals.some(m => days.includes(m.date) && !m.nut.complete),
    waterAvg: w.avg === null ? null : r0(w.avg), waterDays: w.n,
    sleepAvg: sl.avg === null ? null : r1(sl.avg), sleepDays: sl.n,
    stepsAvg: st.avg === null ? null : r0(st.avg), stepsDays: st.n,
    kcalByDay,
  };
}
function reportText(m, current) {

  if (m.avgKcal) L.push(`有记录日平均摄入约 ${m.avgKcal} kcal、蛋白质 ${m.avgProtein} g${m.partialNut ? '（部分菜品营养数据缺失，数值为“已知部分”，实际可能更高）' : ''}。`);
  if (m.waterAvg) L.push(`饮水在 ${m.waterDays} 个记录日平均 ${m.waterAvg} ml；睡眠 ${m.sleepDays ?? '-'} 天平均 ${m.sleepAvg ?? '-'} 小时。`);
  L.push(current ? '建议：周四前优先用掉临期的鸡腿肉、小青菜和豆腐；本周末可以准备下周的采购清单。' : '建议：保持早餐规律，晚餐可多安排一次蔬菜为主的菜式。');
  L.push('（以上解释由 AI 基于统计指标生成，数字均来自确定性 SQL 口径；不构成医疗建议。）');
  return L.join('\n\n');
}

}

function simulateConflict() {
  const stale = S.plan.active;

  const alt = P.candidates('lunch', { notId: P.get(d, 'lunch').r }).find(c => c.chk.ok);
  P.replace(d, 'lunch', alt.r.id, 'user');
  S.plan.versions[S.plan.versions.length - 1].reason += '（来自“手机端”）';
  save(); render();

  catch (e) {
    modal({
      title: '[[alert]] 计划已有更新', body: `<p>你基于 <b>v${stale}</b> 的修改没有被保存：在此期间手机端已保存了 <b>v${S.plan.active}</b>。系统不会静默覆盖。</p>

      buttons: [{ label: '查看差异', fn: () => setTimeout(() => showDiff(stale, S.plan.active), 0) }, { label: '基于最新版本重新编辑', cls: 'pri', fn: () => setTimeout(() => openSlot(dates[5], 'dinner'), 0) }],
    });
  }
}

  const list = U.pantryFilter === 'soon' ? live.filter(b => b.expires && expDays(b) <= 3) : U.pantryFilter === 'unknown' ? live.filter(b => b.qtyStatus === 'unknown') : live;
  const stat = { all: live.length, soon: live.filter(b => b.expires && expDays(b) >= 0 && expDays(b) <= 3).length, exp: live.filter(b => b.expires && expDays(b) < 0).length, unk: live.filter(b => b.qtyStatus === 'unknown').length };
  const shelves = Object.keys(LOC).map(loc => {
    const bs = list.filter(b => b.location === loc).sort((a, b) => expDays(a) - expDays(b));
    return `<div class="shelf ${LOC[loc].cls}"><div class="shelf-h"><span style="font-size:20px">${LOC[loc].em}</span><h3>${LOC[loc].name}</h3><span class="temp">${LOC[loc].temp}</span><span class="sp small muted">${bs.length} 个批次</span></div>
      <div class="jars">${bs.length ? bs.map(jarHTML).join('') : '<span class="muted small" style="padding:10px">这一层空空的</span>'}</div></div>`;
  }).join('');
  const mv = [...S.movements].reverse().slice(0, 10);
  return `
  <div class="row" style="margin-bottom:16px">
    <div class="seg">${[['all', '全部 ' + stat.all], ['soon', '临期/过期 ' + (stat.soon + stat.exp)], ['unknown', '数量未知 ' + stat.unk]].map(([k, l]) => `<button class="${U.pantryFilter === k ? 'on' : ''}" onclick="U.pantryFilter='${k}';render()">${l}</button>`).join('')}</div>
    <div class="sp row"><button class="btn sm" onclick="openRecognize()">[[camera]] 拍照识别</button><button class="btn sm pri" onclick="openAddBatch()">＋ 添加批次</button></div>
  </div>
  <div class="grid g4 keep2" style="margin-bottom:18px">
    <div class="metric"><div class="l">在库批次</div><div class="v">${stat.all}</div><div class="s">同一食材多次购买分批管理</div></div>
    <div class="metric"><div class="l">3 天内到期</div><div class="v" style="color:var(--yolk)">${stat.soon}</div><div class="s">建议先到期先用（FEFO）</div></div>
    <div class="metric"><div class="l">已过期</div><div class="v" style="color:var(--tomato)">${stat.exp}</div><div class="s">不参与采购差额计算</div></div>
    <div class="metric"><div class="l">数量未知</div><div class="v" style="color:var(--muted)">${stat.unk}</div><div class="s">不伪造克数，可盘点补录</div></div>
  </div>
  <div class="fridge">${shelves}</div>
  <div class="section-title">[[list]] 最近库存流水（不可篡改）</div>
  <div class="card" style="padding:8px 16px">${mv.map(movRow).join('') || emptyState('[[list]]', '暂无流水')}</div>`;
};
function jarHTML(b) {

  return `<div class="jar ${cls}" onclick="openBatch('${b.id}')" role="button" tabindex="0" aria-label="${f.name} ${fmtQty(b.remaining, b.unit)}">
    ${label ? `<span class="exp">${label}</span>` : ''}<span class="em">${f.em}</span><b>${f.name}</b>
    ${b.qtyStatus === 'known' ? `<span class="amt">${fmtQty(b.remaining, b.unit)}</span><div class="lvl"><i style="width:${b.original ? Math.min(100, b.remaining / b.original * 100) : 0}%"></i></div>` : '<span class="badge unk">数量未知</span>'}
  </div>`;
}
const MV_NAME = { OPENING: ['初始入库', 'g'], PURCHASE_IN: ['采购入库', 'g'], CONSUME: ['烹饪消耗', 'r'], DISCARD: ['丢弃', 'r'], ADJUST: ['盘点调整', 'y'], RETURN: ['退货', 'r'] };

function openBatch(id) {
  const b = S.batches.find(x => x.id === id); const f = FOODS[b.foodId];
  const mvs = S.movements.filter(m => m.batchId === id).reverse();

    body: `<dl class="kv"><dt>剩余</dt><dd class="mono">${known ? fmtQty(b.remaining, b.unit) + ' / 原始 ' + fmtQty(b.original, b.unit) : '数量未知（不参与库存数值计算）'}</dd>

      <div class="section-title">变更库存</div>
      ${known ? `<div class="form-grid">
        <label class="f">操作<select class="input" id="bk"><option value="CONSUME">烹饪使用（扣减）</option><option value="DISCARD">丢弃（需理由）</option><option value="ADJUST">盘点：实际剩余为…</option></select></label>
        <label class="f"><span id="bql">数量（${unitShort[b.unit]}）</span><input class="input" id="bq" type="number" min="0" step="any" placeholder="例如 ${b.unit === 'piece' ? '1' : '100'}"></label>
        <label class="f" style="grid-column:1/-1">理由<input class="input" id="br" placeholder="例如：已变质 / 盘点误差"></label></div>`
        : `<div class="form-grid"><label class="f">盘点：实际数量（${unitShort[b.unit]}）<input class="input" id="bq" type="number" min="0" step="any"></label><label class="f">理由<input class="input" id="br" value="称重后建立可量化基准"></label></div>`}
      <div class="section-title">此批次流水</div>${mvs.map(movRow).join('')}`,
    buttons: [{ label: '关闭' }, {
      label: '提交变更', cls: 'pri', fn: root => {
        const q = parseFloat($('#bq', root).value); const reason = $('#br', root).value.trim();

        try {

          const kind = $('#bk', root).value;
          if ((kind === 'DISCARD' || kind === 'ADJUST') && !reason) { toast('丢弃/盘点必须填写理由', true); return false; }
          let delta = kind === 'ADJUST' ? r1(q - b.remaining) : -q;
          if (delta === 0) { toast('数量没有变化', true); return false; }
          moveBatch(id, delta, kind, reason || '烹饪使用', kind === 'ADJUST' ? 'adjustment' : kind === 'DISCARD' ? 'discard' : 'manual_cook', uid('src'), uid('idem'));
          commit(`已记录：${MV_NAME[kind][0]} ${fmtQty(Math.abs(delta), b.unit)}`);

    onMount: root => { const s = $('#bk', root); if (s) s.onchange = () => { $('#bql', root).textContent = (s.value === 'ADJUST' ? '实际剩余' : '数量') + `（${unitShort[b.unit]}）`; }; },
  });
}

const RF = [['quick', '[[timer]] 20 分钟内'], ['stock', '[[fridge]] 现有食材能做'], ['fav', '[[heart]] 收藏'], ['breakfast', '[[sunrise]] 早餐'], ['safe', '[[shield]] 符合我的限制']];
PAGES.recipes = () => {

  const q = U.rq.trim();
  if (q) list = list.filter(x => x.r.t.includes(q) || x.r.ing.some(([f]) => FOODS[f].name.includes(q)));
  if (U.rf.quick) list = list.filter(x => x.r.min <= 20);

function ingRows(r, sv) {

      <span class="small">${a.unknown && a.qty < need ? '<span class="badge">有，数量未知</span>' : enough ? '<span class="badge g">有 ' + fmtQty(a.qty, f.unit) + '</span>' : `<span class="badge r">缺 ${fmtQty(need - a.qty, f.unit)}</span>`}</span></div>`;
  }).join('');
}
function addMissingToShop(id, sv) {
  const r = R[id]; let n = 0;
  r.ing.forEach(([fid, amt, opt]) => {
    if (opt) return; const need = amt * sv / r.serv; const a = available(fid);

    S.shopping.push({ id: uid('si'), foodId: fid, qty: gap, unit: FOODS[fid].unit, origin: 'manual', status: 'confirmed', note: '来自菜谱：' + r.t }); n++;
  });

/* ---------------- 烹饪模式 ---------------- */
let CK = null;
function startCooking(id, date, slot) {
  closeModal();
  const r = R[id];
  CK = { id, date: date || D.todayKey(), slot: slot || (new Date().getHours() < 10 ? 'breakfast' : new Date().getHours() < 15 ? 'lunch' : 'dinner'), i: 0, left: r.steps[0][1], run: false, tick: null, session: uid('ck') };
  const el = document.createElement('div'); el.className = 'cook'; el.id = 'cook'; document.body.appendChild(el);
  document.body.style.overflow = 'hidden';
  renderCook();
}
function renderCook() {
  const r = R[CK.id]; const st = r.steps[CK.i]; const total = st[1];
  const pct = total ? (total - CK.left) / total : 0; const C = 2 * Math.PI * 110;
  const mm = String(Math.floor(CK.left / 60)).padStart(2, '0'), ss = String(CK.left % 60).padStart(2, '0');
  $('#cook').innerHTML = `
    <div class="cook-top"><span style="font-size:30px">${r.em}</span><h2>${r.t}</h2><div class="cook-prog">${r.steps.map((_, i) => `<i class="${i <= CK.i ? 'on' : ''}"></i>`).join('')}</div><button class="btn" onclick="exitCooking()">[[x]] 退出</button></div>
    <div class="cook-body"><div><div class="cook-step-n">STEP ${CK.i + 1} / ${r.steps.length}</div><div class="cook-text" aria-live="polite">${st[0]}</div>
      ${CK.i === r.steps.length - 1 ? '<p style="color:#a69c88;margin-top:18px">最后一步！完成后可以确认这次用掉了哪些库存。</p>' : ''}</div>
      <div>${total ? `<div class="timer"><svg viewBox="0 0 240 240"><circle cx="120" cy="120" r="110" fill="none" stroke="#3a3227" stroke-width="10"/><circle cx="120" cy="120" r="110" fill="none" stroke="#f0c46c" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pct)}" style="transition:stroke-dashoffset 1s linear"/></svg>
        <div class="tv"><div><b>${mm}:${ss}</b><span>${CK.left === 0 ? '[[clock]] 时间到' : CK.run ? '计时中' : '步骤计时器'}</span></div></div></div>
        <div class="row" style="justify-content:center;margin-top:14px"><button class="btn" onclick="cookTimer()">${CK.run ? '[[pause]] 暂停' : '[[play]] 开始计时'}</button><button class="btn" onclick="CK.left=Math.max(0,CK.left-30);renderCook()">−30s</button><button class="btn" onclick="CK.left+=30;renderCook()">+30s</button></div>` : '<div class="cook-big" style="text-align:center">[[chef]]</div><p style="text-align:center;color:#a69c88">这一步无需计时</p>'}</div></div>
    <div class="cook-foot"><button class="btn" onclick="cookGo(-1)" ${CK.i === 0 ? 'disabled' : ''}>‹ 上一步</button><button class="btn" onclick="speak()">[[volume]] 朗读</button>
      ${CK.i < r.steps.length - 1 ? '<button class="btn pri" onclick="cookGo(1)">下一步 ›</button>' : '<button class="btn pri" onclick="finishCooking()">[[check]] 完成烹饪</button>'}</div>`;
}
function cookTimer() {
  CK.run = !CK.run; clearInterval(CK.tick);
  if (CK.run) CK.tick = setInterval(() => { if (!CK) return; CK.left = Math.max(0, CK.left - 1); if (CK.left === 0) { CK.run = false; clearInterval(CK.tick); toast('[[clock]] 这一步的时间到了'); } renderCook(); }, 1000);
  renderCook();
}
function cookGo(d) { clearInterval(CK.tick); CK.run = false; CK.i += d; CK.left = R[CK.id].steps[CK.i][1]; renderCook(); }
function speak() {
  const t = R[CK.id].steps[CK.i][0];
  if ('speechSynthesis' in window) { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'zh-CN'; speechSynthesis.speak(u); toast('[[volume]] 正在朗读（浏览器本地 TTS）'); }
  else toast('当前浏览器不支持朗读，请阅读文字步骤', true);
}
function exitCooking() { if (CK) clearInterval(CK.tick); CK = null; $('#cook') && $('#cook').remove(); document.body.style.overflow = ''; if ('speechSynthesis' in window) speechSynthesis.cancel(); }
function finishCooking() {
  const r = R[CK.id]; const ck = { ...CK }; exitCooking();
  const pm = P.get(ck.date, ck.slot); const sv = pm && pm.r === ck.id ? pm.sv : r.serv;
  const rows = r.ing.map(([fid, amt, opt]) => {
    const need = r1(amt * sv / r.serv); const fa = fefo(fid, need); const a = available(fid);
    return { fid, need, opt, alloc: fa.alloc, short: fa.short, unknown: a.unknown && !fa.alloc.length };
  });
  modal({
    title: '[[check]] 烹饪完成 · 确认库存消耗', wide: true,
    body: `<p class="small">系统按<b>先到期先用（FEFO）</b>建议了扣减批次，你可以修改数量或取消勾选。只有确认后才会写入库存流水。</p>
      <div>${rows.map((x, i) => { const f = FOODS[x.fid]; return `<div class="ing-row" style="grid-template-columns:24px 28px 1fr auto"><input type="checkbox" class="cu-ck" data-i="${i}" ${x.alloc.length ? 'checked' : 'disabled'}><span>${f.em}</span>
        <div><b>${f.name}</b> <span class="small muted">需要 ${fmtQty(x.need, f.unit)}</span>
        ${x.alloc.map((a, j) => `<div class="row small" style="gap:6px;margin-top:4px">批次 ${a.expires ? '到期 ' + D.md(a.expires) : ''} → <input class="input cu-q" data-i="${i}" data-j="${j}" type="number" step="any" min="0" value="${a.amount}" style="width:90px;padding:3px 8px"> ${unitShort[f.unit]}</div>`).join('')}
        ${x.unknown ? '<div class="small muted">库存数量未知，无法自动扣减（可在冰箱盘点后再处理）</div>' : ''}${x.short > 0 && !x.unknown && x.alloc.length ? `<div class="small" style="color:var(--tomato)">库存不足 ${fmtQty(x.short, f.unit)}</div>` : ''}${!x.alloc.length && !x.unknown ? '<div class="small muted">无可用库存（可能来自外购）</div>' : ''}</div><span></span></div>`; }).join('')}</div>
      <div class="hr"></div>
      <label class="row" style="gap:8px"><input type="checkbox" id="cu-meal" checked> 同时记一餐：<b>${D.wd(ck.date)} ${SLOTS[ck.slot]} · ${r.t}</b>（我吃 1 份）</label>
      <p class="small muted">记餐与扣库存是两条独立的事实：外卖、在外就餐不会扣库存；同一次烹饪消耗只会入账一次。</p>`,
    buttons: [{ label: '暂不扣减' }, {

      }

function habitSeries(kind) {

}
function sparkSVG(series, col, w = 300, h = 70) {
  const vals = series.map(x => x.v).filter(v => v !== null); if (!vals.length) return '';
  const mn = Math.min(...vals), mx = Math.max(...vals), rg = mx - mn || 1;
  const X = i => 14 + i * (w - 28) / (series.length - 1), Y = v => h - 16 - (v - mn) / rg * (h - 34);
  let path = '', seg = [];
  series.forEach((p, i) => { if (p.v === null) { if (seg.length) path += 'M' + seg.join('L'); seg = []; } else seg.push(X(i).toFixed(1) + ',' + Y(p.v).toFixed(1)); });
  if (seg.length) path += 'M' + seg.join('L');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="近 7 天趋势">
    <path d="${path}" fill="none" style="stroke:var(${col})" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${series.map((p, i) => p.v === null ? `<circle cx="${X(i)}" cy="${h - 16}" r="4" fill="none" style="stroke:var(--muted)" stroke-dasharray="2 2"/>` : `<circle cx="${X(i)}" cy="${Y(p.v)}" r="3.5" style="fill:var(--card);stroke:var(${col})" stroke-width="2"><title>${D.md(p.d)}：${p.v}</title></circle>`).join('')}
    ${series.map((p, i) => `<text x="${X(i)}" y="${h - 2}" text-anchor="middle" style="font-size:9px;fill:var(--muted)">${D.wd(p.d).slice(1)}</text>`).join('')}</svg>`;
}

/* ---------------- input ---------------- */
function attachImg(inp) { const f = inp.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { ATTACH = { url: rd.result }; renderChat(); }; rd.readAsDataURL(f); }
function toggleRec() {
  if (REC) {

function sendInput() { const v = $('#ci').value.trim(); if (!v && !ATTACH) return; $('#ci').value = ''; send(v || '帮我看看这张图里有什么'); }
function send(text, opt = {}) {
  if (RUN) { toast('当前线程正在运行（THREAD_BUSY），请等待或停止', true); return; }
  const t = thread();
  const um = { id: uid('m'), role: 'user', text, img: ATTACH && ATTACH.url, voice: opt.voice };
  t.msgs.push(um); if (t.title === '新的对话') t.title = text.slice(0, 14); t.at = D.now();
  const img = ATTACH && ATTACH.url; ATTACH = null;
