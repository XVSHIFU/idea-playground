}

/* ---------------- runtime ---------------- */
async function runAgent(t, text, img) {
  const runId = 'run_' + Math.random().toString(36).slice(2, 7);
  RUN = { id: runId, cancel: false };
  const m = { id: uid('m'), role: 'ai', runId, trace: [], text: '', cards: [], streaming: true };
  t.msgs.push(m); renderChat(); save();
  const chk = () => { if (RUN && RUN.cancel) throw new Error('TASK_CANCELLED'); };
  const ctx = {
    m, runId,
    async tool(label, tool, ms = 650) { chk(); const p = { label, tool, st: 'run' }; m.trace.push(p); renderChat(); await sleep(ms); chk(); p.st = 'ok'; renderChat(); },
    async say(s) { chk(); for (let i = 0; i < s.length; i += 2) { chk(); m.text += s.slice(i, i + 2); if (i % 8 === 0) renderChat(); await sleep(14); } renderChat(); },
    card(c) { m.cards.push(c); renderChat(); },
  };
  try {
    const intent = img ? 'image' : route(text);
    await INTENTS[intent](ctx, text, img);
  } catch (e) {
    if (e.message === 'TASK_CANCELLED') { m.cancelled = true; m.trace.forEach(p => { if (p.st === 'run') p.st = 'err'; }); }
    else { m.text += `\n\n[[alert]] 运行失败：${e.message}`; console.error(e); }
  }
  m.streaming = false; RUN = null; save(); renderChat(); renderChrome();
  if (U.route !== 'assistant' && !U.drawer) render();
}
function cancelRun() { if (RUN) { RUN.cancel = true; toast('已请求取消，将在下一个安全检查点停止'); } }
function route(t) {
  if (/花生/.test(t) && /推荐|做|菜/.test(t)) return 'allergen';
  if (/换|替换|改/.test(t) && /(周.|星期.|今天|明天|早餐|午餐|晚餐|午饭|晚饭)/.test(t)) return 'replace';
  if (/过期|临期|快坏|用掉/.test(t)) return 'expiry';
  if (/(三|3|七|7|几)\s*[日天].*(菜单|计划|安排)|安排.*(三|3|七|7)\s*[日天]/.test(t)) return 'plan';
  if (/周报|总结|报告/.test(t)) return 'report';
  if (/冰箱|库存|还有什么|剩/.test(t)) return 'pantry';
  if (/吃得|营养|热量|卡路里|吃了多少/.test(t)) return 'nutrition';
  if (/记|吃了/.test(t)) return 'logmeal';
  if (/推荐|吃什么|做什么|菜谱/.test(t)) return 'recommend';
  return 'fallback';
}

/* ---------------- intents ---------------- */
const INTENTS = {
  async pantry(c) {
    await c.tool('翻一翻冰箱', 'get_pantry');
    const live = S.batches.filter(b => b.qtyStatus === 'unknown' || b.remaining > 0);
    const urg = live.filter(b => b.expires && expDays(b) >= 0 && expDays(b) <= 3);
    await c.say(`你现在有 ${live.length} 个在库批次。${urg.length ? `其中 ${urg.length} 个在 3 天内到期，建议优先使用：` : '暂时没有临期食材。'}`);
    c.card({ type: 'pantry', ids: live.sort((a, b) => expDays(a) - expDays(b)).slice(0, 12).map(b => b.id) });
    await c.say('\n（只读查询，没有修改任何数据。）');
  },
  async replace(c, text) {
    const T = D.todayKey(); const dates = P.dates();
    const wdMap = { 一: 0, 二: 1, 三: 2, 四: 3, 五: 4, 六: 5, 日: 6, 天: 6 };
    let date = null; const mw = text.match(/(?:周|星期)([一二三四五六日天])/);
    if (mw) date = dates[wdMap[mw[1]]]; else if (/明天/.test(text)) date = D.add(T, 1); else if (/今天/.test(text)) date = T;
    let slot = /早/.test(text) ? 'breakfast' : /午/.test(text) ? 'lunch' : /晚/.test(text) ? 'dinner' : null;
    await c.tool('理解你的需求', 'router.extract_slots', 450);
    if (!date || !slot || !P.get(date, slot)) { await c.say('想替换哪一天的哪一餐？例如“把周三晚餐换掉”。'); return; }
    const ex = []; const mx = text.match(/不[含要吃]([一-龥]{1,3}?)(?:的|肉|$)/);
    if (mx) ex.push(mx[1].replace(/肉$/, '')); if (/鸡/.test(text) && !ex.includes('鸡')) ex.push('鸡');
    const cur = P.get(date, slot); const curR = R[cur.r];
    await c.tool(`读取计划 v${S.plan.active} · ${D.wd(date)}${SLOTS[slot]}`, 'get_plan');
    await c.tool('查看库存与临期批次', 'get_pantry', 500);
    await c.tool(`检索候选菜谱并硬过滤${ex.length ? '「' + ex.join('、') + '」' : ''}与你的过敏/忌口`, 'search_recipes', 800);
    const cands = P.candidates(slot, { exclude: ex, notId: cur.r, date }).filter(x => x.chk.ok && !x.tooLong);
    if (!cands.length) { await c.say('在满足所有硬约束的前提下没有找到可替换的菜（NO_FEASIBLE_PLAN）。可以放宽做饭时长或换个餐次试试。'); return; }
    const pick = cands[0]; const excluded = P.candidates(slot, { exclude: ex, notId: cur.r }).filter(x => !x.chk.ok).length;
    await c.tool('计算营养差异与采购差额', 'calculate_nutrients', 550);
    const newMeals = JSON.parse(JSON.stringify(P.meals())); newMeals[date + '|' + slot] = { r: pick.r.id, sv: cur.sv };
    const gapNow = computeGap(), gapNew = computeGap(newMeals);
    const gapAdd = gapNew.filter(g => !gapNow.some(x => x.foodId === g.foodId && x.gap >= g.gap)).map(g => FOODS[g.foodId].name + ' ' + fmtQty(g.gap, FOODS[g.foodId].unit));
    const nOld = recipeNutrition(curR, 1), nNew = recipeNutrition(pick.r, 1);
    await c.tool('生成待审批的修改提议', 'propose_plan_change', 400);
    await c.say(`我找到了 ${cands.length} 道符合条件的菜，已排除 ${excluded} 道含禁用成分的候选。推荐换成「${pick.r.t}」：库存匹配 ${r0(pick.stock * 100)}%，${pick.r.min} 分钟能做好。\n这是一张修改单，需要你盖章确认后才会保存：`);
    const a = mkAction({ type: 'replace_planned_meal', summary: `${D.wd(date)}${SLOTS[slot]}：${curR.t} → ${pick.r.t}`, target: { plan: S.plan.id, date, slot }, from: cur.r, to: pick.r.id, expected: S.plan.active, lines: [`营养/每份：${r0(nOld.v[0])} → ${r0(nNew.v[0])} kcal，蛋白质 ${r0(nOld.v[1])} → ${r0(nNew.v[1])} g${nNew.complete ? '' : '（部分已知）'}`, gapAdd.length ? `新增采购：${gapAdd.join('、')}` : '无需新增采购', '其它餐次、手动购物项与历史版本保持不变'], warn: pick.chk.verify.length ? `${pick.chk.verify.join('、')} 配料信息未知，请自行核对` : '' });
    c.card({ type: 'approval', id: a.id });
    c.m.cites = [{ t: pick.r.src, v: 'recipe_id=' + pick.r.id }];
  },
  async expiry(c) {
    const T = D.todayKey();
    await c.tool('找出 3 天内到期的食材', 'search_pantry');
    const urg = urgentBatches().filter(b => expDays(b) >= 0); const ids = [...new Set(urg.map(b => b.foodId))];
    if (!ids.length) { await c.say('目前没有临期食材，冰箱状态很健康。'); return; }
    await c.tool('按“能用掉临期食材”排序菜谱', 'search_recipes', 800);
    const slot = 'dinner';
    const cur = P.get(T, slot);
    const ranked = P.candidates(slot, { date: T, notId: cur && cur.r }).filter(x => x.chk.ok && !x.tooLong).map(x => ({ ...x, use: x.r.ing.filter(([f]) => ids.includes(f)).map(([f]) => FOODS[f].name) })).filter(x => x.use.length).sort((a, b) => b.use.length - a.use.length || b.score - a.score);
    await c.say(`临期的有：${ids.map(f => FOODS[f].name).join('、')}。`);
    if (!ranked.length) { await c.say('\n菜谱库里暂时没有能用上它们的晚餐，建议直接做简单的炒菜。'); return; }
    const pick = ranked[0];
    if (isEaten(T, slot)) { await c.say(`\n今晚已经记录过晚餐了。「${pick.r.t}」能用掉 ${pick.use.join('、')}，可以考虑明天安排。`); c.card({ type: 'recipe', id: pick.r.id, use: pick.use }); return; }
    await c.tool('生成待审批的修改提议', 'propose_plan_change', 400);
    await c.say(`\n「${pick.r.t}」能一次用掉 ${pick.use.join('、')}。要把今晚的「${cur ? R[cur.r].t : '空'}」换成它吗？`);
    c.card({ type: 'recipe', id: pick.r.id, use: pick.use });
    const a = mkAction({ type: 'replace_planned_meal', summary: `今晚：${cur ? R[cur.r].t : '空'} → ${pick.r.t}`, target: { plan: S.plan.id, date: T, slot }, from: cur && cur.r, to: pick.r.id, expected: S.plan.active, lines: [`可消耗临期：${pick.use.join('、')}`, '保存计划不会扣库存；做完后再确认消耗'], warn: pick.chk.verify.length ? `${pick.chk.verify.join('、')} 配料信息未知，请自行核对` : '' });
    c.card({ type: 'approval', id: a.id });
  },
  async plan(c, text) {
    const n = /七|7/.test(text) ? 7 : 3;
    const T = D.todayKey(); const dates = P.dates().filter(d => D.diff(d, T) >= 0).slice(0, n);
    await c.tool('读取饮食限制与偏好', 'get_profile', 400);
    await c.tool('读取库存快照', 'get_pantry', 500);
    await c.tool(`检索候选并组合 ${dates.length} 日菜单（贪心 + 局部替换）`, 'create_plan_draft', 1100);
    const meals = JSON.parse(JSON.stringify(P.meals())); const used = {};
    const changes = [];
    dates.forEach(d => ['breakfast', 'lunch', 'dinner'].forEach(slot => {
      if (isEaten(d, slot)) return;
      const cand = P.candidates(slot, { date: d }).filter(x => x.chk.ok && !x.tooLong && !used[x.r.id]);
      const best = cand.sort((a, b) => (b.stock + urgencyBonus(b.r)) - (a.stock + urgencyBonus(a.r)))[0];
      if (!best) return; used[best.r.id] = 1;
      const old = meals[d + '|' + slot];
      if (!old || old.r !== best.r.id) changes.push({ d, slot, from: old && old.r, to: best.r.id });
      meals[d + '|' + slot] = { r: best.r.id, sv: slot === 'breakfast' ? 1 : 2 };
    }));
    await c.tool('校验硬约束 + 计算采购差额', 'plan_validator', 500);
    const gap = computeGap(meals);
    await c.say(`草稿已生成：${dates.length} 天、${changes.length} 处调整，优先使用库存与临期食材，避免连续重复。全部菜品已通过过敏/忌口硬过滤。`);
    const draftId = uid('pldraft');
    c.card({ type: 'plandraft', id: draftId, dates, meals, gapN: gap.length, changes: changes.length });
    if (changes.length) {
      const a = mkAction({ type: 'commit_plan', summary: `应用 ${dates.length} 日菜单草稿（${changes.length} 处调整）`, meals, expected: S.plan.active, lines: [`调整 ${changes.length} 餐，已吃过的餐次不会改动`, `预计采购差额 ${gap.length} 项`, '价格数据不足：不校验预算上限'], diffList: changes });
      c.card({ type: 'approval', id: a.id });
    }
  },
  async nutrition(c) {
    const T = D.todayKey();
    await c.tool('读取今日记餐', 'get_meal_history', 500);
    await c.tool('按营养数据库确定性计算', 'calculate_nutrients', 600);
    const n = dayNutrition(T); const ms = S.meals.filter(m => m.date === T);
    if (!ms.length) { await c.say('今天还没有记餐记录。我不会根据计划猜测你吃了什么——要不要先记一餐？'); c.card({ type: 'action-links', links: [['＋ 记一餐', "openAddMeal()"]] }); return; }
    await c.say(`今天已记录 ${ms.length} 餐：${ms.map(m => m.title).join('、')}。`);
    c.card({ type: 'nutrition', v: n.v, partial: n.partial, unknown: [...new Set(ms.flatMap(m => m.nut.unknown))] });
    await c.say(`\n蛋白质 ${r0(n.v[1])} g，${n.v[1] < 40 ? '晚餐可以安排一些豆制品、鱼或蛋类。' : '目前看比较充足。'}${n.partial ? '\n注意：有食材缺少营养来源，以上为“已知部分”，没有用模型去补数字。' : ''}\n（一般性生活建议，不构成医疗或营养治疗建议。）`);
  },
  async report(c) {
    await c.tool('按固定口径统计本周指标', 'get_trend_metrics', 800);
    const mon = D.monday(D.todayKey()); const m = weekMetrics(mon);
    await c.tool('基于指标 JSON 生成解释', 'llm.interpret_metrics', 700);
    const rp = S.reports.find(x => x.start === mon);
    const nr = generateReport(mon); if (rp) { nr.id = rp.id; Object.assign(rp, nr); } else S.reports.push(nr);
    notify('[[chart]]', '本周周报已更新（手动请求）', '#/reports');
    await c.say(`本周已过 ${m.elapsed} 天：记录率 ${m.recordRate}%，计划确认完成率 ${m.planRate ?? '—'}%（分母 ${m.planJudge} 个可判断餐次）。有记录日平均 ${m.avgKcal ?? '—'} kcal。\n周报已保存，你可以在周报页查看图表或导出。`);
    c.card({ type: 'action-links', links: [['[[chart]] 打开周报', "go('reports')"]] });
  },
  async allergen(c) {
    await c.tool('读取饮食限制', 'get_profile', 400);
    await c.tool('检索菜谱', 'search_recipes', 600);
    const hits = RECIPES.filter(r => r.ing.some(([f]) => FOODS[f].al.includes('花生')));
    await c.say(`抱歉，你的资料里登记了「花生」过敏，这是硬约束，我不能推荐或安排含花生的菜（如：${hits.map(r => r.t).join('、')}）。\n如需修改过敏信息，只能由你本人在设置页操作，我没有这个权限。`);
    c.card({ type: 'action-links', links: [['[[shield]] 查看饮食限制', "go('settings')"]] });
  },
  async logmeal(c, text) {
    await c.tool('识别你提到的菜', 'router.extract_slots', 500);
    const r = RECIPES.find(x => text.includes(x.t)) || RECIPES.find(x => x.ing.some(([f]) => text.includes(FOODS[f].name)));
    const h = new Date().getHours(); const slot = /早/.test(text) ? 'breakfast' : /午|中/.test(text) ? 'lunch' : /晚/.test(text) ? 'dinner' : h < 10 ? 'breakfast' : h < 15 ? 'lunch' : 'dinner';
    if (!r) { await c.say('没能对应到菜谱库里的菜。你可以打开记餐表单手动选择。'); c.card({ type: 'action-links', links: [['＋ 打开记餐表单', `openAddMeal('${slot}')`]] }); return; }
    await c.tool('创建记餐草稿并计算营养', 'create_meal_draft', 600);
    const nut = recipeNutrition(r, 1);
    await c.say(`我理解为：今天${SLOTS[slot]}吃了 1 份「${r.t}」，约 ${r0(nut.v[0])} kcal${nut.complete ? '' : '（部分已知）'}。确认后才会写入记录：`);
    const a = mkAction({ type: 'commit_meal_record', summary: `记录 ${SLOTS[slot]}：${r.t} × 1 份`, date: D.todayKey(), slot, items: [{ recipeId: r.id, amount: 1 }], lines: [`营养：${r0(nut.v[0])} kcal · 蛋白质 ${r0(nut.v[1])} g`, '不会扣减库存（扣库存需另行确认烹饪消耗）'] });
    c.card({ type: 'approval', id: a.id });
  },
  async recommend(c) {
    const h = new Date().getHours(); const slot = h < 10 ? 'breakfast' : h < 15 ? 'lunch' : 'dinner';
    await c.tool('查看库存', 'get_pantry', 400);
    await c.tool('检索并排序菜谱', 'search_recipes', 700);
    const list = P.candidates(slot).filter(x => x.chk.ok && !x.tooLong).slice(0, 3);
    await c.say(`按库存匹配度、临期食材和做饭时长，${SLOTS[slot]}推荐这几道：`);
    list.forEach(x => c.card({ type: 'recipe', id: x.r.id }));
  },
  async image(c) {
    await c.tool('上传图片到私有存储', 'media.upload', 500);
    await c.tool('识别图片中的食物候选', 'recognize_food_image', 1200);
    await c.say('图片里可能有：鸡蛋、番茄、生菜、牛奶（不确定，也可能是酸奶）。\n这些只是候选，我不会直接写入库存。请在识别面板里逐项确认数量和保质期：');
    c.card({ type: 'action-links', links: [['[[camera]] 打开识别确认面板', 'openRecognize("pantry", sampleFridgeImage())']] });
  },
  async fallback(c) {
    await c.tool('检索一般饮食知识', 'search_food_knowledge', 700);
    await c.say('这个问题我暂时没有找到可靠来源，不想随便编一个答案给你。\n你可以试试：查库存、换某一餐、安排几日菜单、记一餐、看今天营养或生成周报。');
  },
};

/* ---------------- actions & approvals ---------------- */
function mkAction(p) {
  const id = uid('act');
  const a = { id, approvalId: uid('apv'), status: 'waiting_approval', createdAt: D.now(), expiresAt: new Date(Date.now() + 15 * 60e3).toISOString(), ...p };
  a.hash = hashOf({ type: a.type, target: a.target, from: a.from, to: a.to, expected: a.expected, items: a.items });
  S.actions[id] = a; save(); renderChrome();
  return a;
}
function cardHTML(c) {
  if (c.type === 'approval') return approvalHTML(S.actions[c.id]);
  if (c.type === 'pantry') return `<div class="scard"><div class="scard-h">[[fridge]] 库存快照<span class="type">get_pantry · read-only</span></div><table class="t">${c.ids.map(id => { const b = S.batches.find(x => x.id === id); if (!b) return ''; const f = FOODS[b.foodId]; return `<tr><td>${f.em} ${f.name}</td><td class="mono">${fmtQty(b.remaining, b.unit)}</td><td>${badgeExp(b)}</td></tr>`; }).join('')}</table><button class="btn xs" style="margin-top:8px" onclick="go('pantry')">打开冰箱 →</button></div>`;
  if (c.type === 'recipe') { const r = R[c.id]; const n = recipeNutrition(r, 1); return `<div class="scard" style="display:flex;gap:12px;align-items:center"><span style="font-size:36px;background:${r.bg};border-radius:12px;width:56px;height:56px;display:grid;place-items:center;flex:none">${r.em}</span><div style="flex:1;min-width:0"><b>${r.t}</b><div class="small muted">[[timer]]${r.min}分 · 库存 ${r0(stockMatch(r) * 100)}% · ${r0(n.v[0])}kcal/份${n.complete ? '' : '（部分已知）'}</div>${c.use ? `<div class="small" style="color:var(--green)">用掉：${c.use.join('、')}</div>` : ''}</div><button class="btn xs" onclick="openRecipe('${r.id}')">详情</button></div>`; }
  if (c.type === 'nutrition') return `<div class="scard"><div class="scard-h">[[leaf]] 今日营养<span class="type">NutritionCard</span></div>${nutriCard({ v: c.v, complete: !c.partial, unknown: c.unknown, basis: c.partial ? 'partial' : 'standardized_portion' })}</div>`;
  if (c.type === 'plandraft') {
    return `<div class="scard"><div class="scard-h">[[calendar]] 菜单草稿<span class="type">PlanDraftCard · ${c.id}</span></div>
      <div class="mini-grid" style="grid-template-columns:40px repeat(${c.dates.length},1fr)"><span></span>${c.dates.map(d => `<span class="h">${D.wd(d)}</span>`).join('')}
      ${['breakfast', 'lunch', 'dinner'].map(s => `<span class="h">${SLOTS[s].slice(0, 1)}</span>` + c.dates.map(d => { const m = c.meals[d + '|' + s]; return `<span class="c" title="${R[m.r].t}">${R[m.r].em} ${R[m.r].t}</span>`; }).join('')).join('')}</div>
      <div class="row small" style="margin-top:8px"><span class="badge g">硬约束 0 冲突</span><span class="badge">采购差额 ${c.gapN} 项</span><span class="badge y">价格覆盖：不足</span><span class="badge y">营养：部分已知</span></div></div>`;
  }
  if (c.type === 'action-links') return `<div class="row">${c.links.map(([l, f]) => `<button class="btn sm" onclick="${f.replace(/"/g, '&quot;')}">${l}</button>`).join('')}</div>`;
  return '';
}
function approvalHTML(a) {
  if (!a) return '';
  const st = a.status; const left = Math.max(0, new Date(a.expiresAt) - Date.now());
  let diff = '';
  if (a.type === 'replace_planned_meal') diff = `<div class="ap-diff"><div class="box old"><span class="em">${a.from ? R[a.from].em : '—'}</span>${a.from ? R[a.from].t : '空'}</div><span style="text-align:center">→</span><div class="box"><span class="em">${R[a.to].em}</span><b>${R[a.to].t}</b></div></div>`;
  if (a.type === 'commit_plan') diff = `<div class="col" style="gap:2px;margin-bottom:10px">${a.diffList.slice(0, 6).map(x => `<div class="small">${D.wd(x.d)}${SLOTS[x.slot]}：<span style="text-decoration:line-through;color:var(--tomato)">${x.from ? R[x.from].t : '空'}</span> → <b style="color:var(--green)">${R[x.to].t}</b></div>`).join('')}${a.diffList.length > 6 ? `<div class="small muted">…以及另外 ${a.diffList.length - 6} 处</div>` : ''}</div>`;
  if (a.type === 'commit_meal_record') diff = `<div class="ap-diff" style="grid-template-columns:1fr"><div class="box"><span class="em">${R[a.items[0].recipeId].em}</span><b>${R[a.items[0].recipeId].t}</b> × ${a.items[0].amount} 份</div></div>`;
  const seal = { committed: ['ok', '已生效', 'COMMITTED'], rejected: ['no', '已拒绝', 'REJECTED'], expired: ['no', '已过期', 'EXPIRED'], conflict: ['', '冲突', 'CONFLICT'], failed: ['', '失败', 'FAILED'] }[st];
  const tgt = a.target ? `计划《${esc(S.plan.title)}》· ${D.wd(a.target.date)} ${D.md(a.target.date)} ${SLOTS[a.target.slot]} · 基于 v${a.expected}` : a.type === 'commit_plan' ? `计划《${esc(S.plan.title)}》· 基于 v${a.expected}` : `饮食记录 · ${a.date}`;
  return `<div class="approval" id="ap-${a.id}"><div class="ap-h">[[file]] 修改单 · 待你盖章<span class="no">${a.type}</span></div>
    <div class="ap-target">${tgt}</div>${diff}
    <div class="ap-lines">${a.lines.map(l => `<span>· ${esc(l)}</span>`).join('')}${a.warn ? `<span style="color:var(--yolk)">[[alert]] ${esc(a.warn)}</span>` : ''}</div>
    ${st === 'conflict' ? `<div class="danger-line" style="margin-bottom:8px">计划已被更新到 v${S.plan.active}，这张单据基于 v${a.expected}，已失效。请重新发起。</div>` : ''}
    ${st === 'failed' ? `<div class="danger-line" style="margin-bottom:8px">${esc(a.error || '提交失败')}</div>` : ''}
    <div class="ap-foot">
      ${st === 'waiting_approval' ? `<button class="btn sm pri" onclick="decide('${a.id}','approve')">[[check]] 盖章批准</button><button class="btn sm" onclick="decide('${a.id}','reject')">拒绝</button><span class="exp sp" data-exp="${a.id}">[[hourglass]] ${Math.floor(left / 60000)}:${String(Math.floor(left / 1000) % 60).padStart(2, '0')} 后过期</span>` : ''}
      ${st === 'approved' || st === 'committing' ? '<span class="small">[[check]] 已批准，等待执行…</span><span class="pill run" style="margin-left:6px"><span class="st"></span>commit</span>' : ''}
      ${st === 'committed' ? `<span class="small" style="color:var(--green)">[[check]] 已保存${a.resultV ? ` · 计划 v${a.resultV}` : ''}</span><button class="btn xs sp" onclick="go('${a.type === 'commit_meal_record' ? 'meals' : 'plan'}')">查看 →</button>` : ''}
      <span class="mono small muted" style="width:100%;font-size:10px">${a.approvalId} · ${a.hash}</span></div>
    ${seal ? `<div class="seal ${seal[0]}"><div>${seal[1]}<small>${seal[2]}</small></div></div>` : ''}</div>`;
}
async function decide(id, decision) {
  const a = S.actions[id];
  if (!a || a.status !== 'waiting_approval') { toast('该审批已处理（APPROVAL_ALREADY_DECIDED）', true); return; }
  if (Date.now() > new Date(a.expiresAt)) { a.status = 'expired'; save(); renderChat(); return; }
  if (decision === 'reject') { a.status = 'rejected'; save(); renderChat(); renderChrome(); toast('已拒绝，未写入任何数据'); return; }
  a.status = 'approved'; save(); renderChat();
  await sleep(500); a.status = 'committing'; renderChat();
  await sleep(700);
  try {
    if (a.type === 'replace_planned_meal') {
      a.resultV = P.replace(a.target.date, a.target.slot, a.to, 'agent', a.expected);
      U.changed = a.target.date + '|' + a.target.slot;
    } else if (a.type === 'commit_plan') {
      a.resultV = P.commit(a.meals, a.summary, 'agent', a.expected);
    } else if (a.type === 'commit_meal_record') {
      if (S.meals.some(m => m.actionId === a.id)) throw new Error('重复提交已拦截');
      const pm = P.get(a.date, a.slot);
      const m = createMeal({ date: a.date, slot: a.slot, items: a.items, source: 'agent', planned: !!(pm && pm.r === a.items[0].recipeId) }); m.actionId = a.id;
    }
    a.status = 'committed'; a.committedAt = D.now();
    thread().msgs.push({ id: uid('m'), role: 'sys', text: `action.committed · ${a.summary}` });
    notify('[[check-circle]]', 'AI 修改已生效：' + a.summary, a.type === 'commit_meal_record' ? '#/meals' : '#/plan');
    toast('[[bookmark]] 已盖章并保存');
  } catch (e) {
    if (e.code === 'CONFLICT') a.status = 'conflict'; else { a.status = 'failed'; a.error = e.message; }
    toast(e.code === 'CONFLICT' ? '版本冲突：计划已被修改' : e.message, true);
  }
  save(); render();
}
let _expT = null;
function tickExpiry() {
  clearTimeout(_expT);
  const els = $$('[data-exp]'); if (!els.length) return;
  _expT = setTimeout(() => {
    let changed = false;
    $$('[data-exp]').forEach(el => {
      const a = S.actions[el.dataset.exp]; if (!a) return; const left = new Date(a.expiresAt) - Date.now();
      if (left <= 0 && a.status === 'waiting_approval') { a.status = 'expired'; changed = true; }
      else el.innerHTML = `[[hourglass]] ${Math.floor(left / 60000)}:${String(Math.floor(left / 1000) % 60).padStart(2, '0')} 后过期`;
    });
    if (changed) { save(); renderChat(); renderChrome(); } else tickExpiry();
  }, 1000);
}

/* ---------------- boot ---------------- */
(function boot() {
  try { const t = localStorage.getItem('aichef_theme'); if (t) document.documentElement.dataset.theme = t; else if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark'; } catch (e) { }
  load(); save();
  if (!location.hash) history.replaceState(null, '', '#/home');
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('#cook')) exitCooking(); else if ($('#modal-root').innerHTML) closeModal(); else if (U.sheet) { U.sheet = null; renderSheet(); } else if (U.drawer) closeDrawer(); } });
  render(); _lastRoute = U.route;
})();

</script>
