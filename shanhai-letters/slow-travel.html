{id:'duanqiao',name:'断桥残雪',english:'BROKEN BRIDGE',kind:'观景',tags:['西湖十景','环湖漫步','经典打卡'],x:29,y:48,thumb:'duanqiao',desc:'西湖最具辨识度的湖岸景观之一，适合从北岸展开一段舒缓的湖边散步。',address:'杭州 · 西湖北岸 · 白堤东端',hours:'户外区域信息以当地实际管理为准',tips:['清晨人少，更适合拍摄水面与远山。','可从断桥沿白堤向孤山方向慢行。','雨天注意湖边湿滑路面。'],tone:'湖风微凉 · 慢行西湖'},
{id:'quyuan',name:'曲院风荷',english:'LOTUS GARDEN',kind:'自然',tags:['西湖十景','荷花','自然摄影'],x:79,y:64,thumb:'quyuan',desc:'以荷景和园林水岸闻名的西湖景点，季节变化使这里有不同的散步和摄影体验。',address:'杭州 · 西湖北侧 · 杨公堤附近',hours:'部分园区可能有管理时段，以现场公告为准',tips:['赏荷通常以夏季更具代表性。','阴天的柔光适合拍摄花朵细节。','推荐与苏堤或岳庙周边串联游览。'],tone:'一池清荷 · 风吹绿影'},
{id:'santan',name:'三潭印月',english:'THREE POOLS MIRRORING THE MOON',kind:'观景',tags:['西湖十景','湖心岛','水上风光'],x:30,y:73,thumb:'santan',desc:'西湖的经典湖心景观，标志性的石塔与水面倒影构成独特的东方意境。',address:'杭州 · 西湖湖心景区',hours:'登岛船班、开放时间请以官方公告为准',tips:['如计划登岛，提前确认游船及返程班次。','柔和的晨昏光线更适合拍摄湖景。','预留乘船及步行时间，不要过度压缩行程。'],tone:'湖光塔影 · 水天一色'},

const kinds=[['全部','◇'],['古迹','♜'],['自然','☘'],['观景','⌁']];function storageGet(k){try{return localStorage.getItem(k)}catch(e){return null}}function storageSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}let selectedKind='全部',selectedPlace=null,activePanel='',saved=new Set(JSON.parse(storageGet('travel_saved')||'[]')),route=JSON.parse(storageGet('travel_route')||'[]');let state={tx:0,ty:0,scale:1},drag=null;
const $=id=>document.getElementById(id),elements={markers:$('markers'),recs:$('recommendations'),filters:$('filters'),detail:$('detailSheet'),list:$('listSheet'),shade:$('shade'),search:$('searchInput'),results:$('searchResults'),transform:$('mapTransform'),stage:$('mapStage')};
function imageOf(p){return images[p.thumb]||images.leifeng}function filtered(){const q=elements.search.value.trim().toLowerCase();return places.filter(p=>(selectedKind==='全部'||p.kind===selectedKind)&&(!q||[p.name,p.english,p.kind,...p.tags].join(' ').toLowerCase().includes(q)))}
function renderFilters(){elements.filters.innerHTML=kinds.map(([k,g])=>`<button class="filter-chip ${selectedKind===k?'active':''}" data-kind="${k}"><span style="font-size:14px;line-height:0">${g}</span>${k}</button>`).join('');elements.filters.querySelectorAll('button').forEach(el=>el.onclick=()=>{selectedKind=el.dataset.kind;renderFilters();renderMain()})}
function renderMain(){const ids=new Set(filtered().map(p=>p.id));elements.markers.innerHTML=places.map((p,i)=>`<button class="map-marker ${i===0?'featured':''} pin-${['one','two','three','four'][i%4]} ${ids.has(p.id)?'':'is-hidden'}" data-id="${p.id}" style="left:${p.x}%;top:${p.y}%" aria-label="查看${p.name}"><span class="marker-photo"><img src="${imageOf(p)}" alt="${p.name}风景示意照片"></span><span class="marker-caption">${p.name}</span><span class="marker-tail"></span></button>`).join('');elements.markers.querySelectorAll('button').forEach(el=>{el.addEventListener('pointerdown',e=>e.stopPropagation());el.onclick=()=>openDetail(el.dataset.id)});
const arr=filtered();$('count').textContent='· '+arr.length+' 处';elements.recs.innerHTML=arr.map(p=>`<button class="rec-card" data-id="${p.id}" aria-label="打开${p.name}"><img src="${imageOf(p)}" alt=""><span class="rec-name">${p.name}</span><span class="rec-desc">${p.tone}</span></button>`).join('')||'<div class="empty-state" style="padding:15px 0">没有匹配的地点</div>';elements.recs.querySelectorAll('button').forEach(el=>el.onclick=()=>openDetail(el.dataset.id));}
function saveState(){storageSet('travel_saved',JSON.stringify([...saved]));storageSet('travel_route',JSON.stringify(route))}
function getPlace(id){return places.find(p=>p.id===id)}
function showShade(){elements.shade.classList.add('open')}
function hidePanels(){elements.detail.classList.remove('open');elements.list.classList.remove('open');elements.shade.classList.remove('open');selectedPlace=null;activePanel='';elements.results.classList.remove('open');document.querySelectorAll('.tabbtn').forEach(b=>b.classList.remove('active'));$('tabMap').classList.add('active')}
function openDetail(id){const p=getPlace(id);if(!p)return;selectedPlace=id;activePanel='detail';showShade();elements.list.classList.remove('open');elements.detail.innerHTML=`<div class="detail-hero"><img src="${imageOf(p)}" alt="${p.name}景点示意图"><button class="detail-back" id="closeDetail" aria-label="关闭">‹</button></div><div class="detail-body"><div class="detail-head"><div><h2>${p.name}</h2><p class="detail-en">${p.english}</p></div><button class="save-btn ${saved.has(id)?'saved':''}" id="savePlace">${saved.has(id)?'♥ 已收藏':'♡ 收藏'}</button></div><div class="tagline">${p.tags.map(t=>`<span>${t}</span>`).join('')}</div><p class="summary">${p.desc}</p><div class="info-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg><span>${p.address}</span></div><div class="info-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>${p.hours}</span></div><h3 class="guide-title">旅行小建议</h3>${p.tips.map((tip,i)=>`<div class="guide-item"><span class="num">0${i+1}</span><span>${tip}</span></div>`).join('')}<div class="detail-buttons"><button class="btn-outline" id="showAround">查看附近</button><button class="btn-primary" id="addRoute">${route.includes(id)?'✓ 已加入路线':'＋ 加入我的路线'}</button></div></div>`;elements.detail.classList.add('open');$('closeDetail').onclick=hidePanels;$('savePlace').onclick=()=>{saved.has(id)?saved.delete(id):saved.add(id);saveState();$('savePlace').className='save-btn '+(saved.has(id)?'saved':'');$('savePlace').textContent=saved.has(id)?'♥ 已收藏':'♡ 收藏';toast(saved.has(id)?'已保存到收藏':'已取消收藏')};$('addRoute').onclick=()=>{if(!route.includes(id)){route.push(id);saveState();toast('已加入我的路线')}else{route=route.filter(s=>s!==id);saveState();toast('已移出路线')}$('addRoute').textContent=route.includes(id)?'✓ 已加入路线':'＋ 加入我的路线'};$('showAround').onclick=()=>{hidePanels();toast('已定位到 '+p.name);if(state.scale<1.12)applyTransform(0,0,1.12)};elements.results.classList.remove('open')}
function openList(type){activePanel=type;showShade();elements.detail.classList.remove('open');let html='';if(type==='saved'){const arr=places.filter(p=>saved.has(p.id));html=`<div class="sheet-grabber"></div><h2 class="sheet-title">我的收藏</h2><p class="sheet-desc">把喜欢的风景保存在这里，下次继续探索。</p>${renderEntries(arr,'收藏列表暂无地点，点击图片上的收藏试试。')}`}else if(type==='route'){const arr=route.map(getPlace).filter(Boolean);html=`<div class="sheet-grabber"></div><h2 class="sheet-title">我的路线</h2><p class="sheet-desc">按添加顺序排列 · ${arr.length} 个地点<br>这是路线清单示例，暂不计算真实交通路线。</p>${renderEntries(arr,'还没有地点加入路线。')}${arr.length?'<button class="btn-outline" id="clearRoute" style="width:100%;margin-top:20px">清空路线</button>':''}`;}else{html=`<div class="sheet-grabber"></div><h2 class="sheet-title">漫游旅行地图</h2><p class="sheet-desc">一个关注「发现」的小程序 MVP。<br>地图、照片、简要攻略、收藏与路线清单构成完整的探索闭环。</p><div class="guide-item"><span class="num">01</span><span>拖动 / 缩放地图，在地点间漫游。</span></div><div class="guide-item"><span class="num">02</span><span>点击悬浮图片，阅读目的地卡片。</span></div><div class="guide-item"><span class="num">03</span><span>收藏目的地，或将其加入游览路线。</span></div><p class="sheet-desc" style="margin-top:24px">当前地图为自绘 UI 示意，照片为视觉素材；并非实时地图、导航或官方攻略数据。</p>`}elements.list.innerHTML=html;elements.list.classList.add('open');elements.list.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>openDetail(b.dataset.id));const clear=$('clearRoute');if(clear)clear.onclick=()=>{route=[];saveState();openList('route');toast('路线已清空')};document.querySelectorAll('.tabbtn').forEach(b=>b.classList.remove('active'));$(type==='saved'?'tabSaved':type==='about'?'tabMine':'tabMap').classList.add('active')}
function renderEntries(arr,empty){return arr.length?arr.map(p=>`<button class="list-entry" data-id="${p.id}"><img src="${imageOf(p)}" alt=""><span><strong>${p.name}</strong><small>${p.tone}</small></span><span class="arrow">›</span></button>`).join(''):`<div class="empty-state"><span class="big">◇</span>${empty}</div>`}
let timeout;function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(timeout);timeout=setTimeout(()=>el.classList.remove('show'),2100)}
function renderSearch(){const q=elements.search.value.trim().toLowerCase();$('clearSearch').style.display=q?'block':'none';if(!q){elements.results.classList.remove('open');renderMain();return}const arr=places.filter(p=>[p.name,p.english,p.kind,...p.tags].join(' ').toLowerCase().includes(q));elements.results.innerHTML=arr.length?arr.map(p=>`<button class="search-item" data-id="${p.id}"><img src="${imageOf(p)}" alt=""><div><strong>${p.name}</strong><span>${p.tags.slice(0,2).join(' · ')}</span></div></button>`).join(''):'<div class="empty-state" style="padding:17px">未找到匹配地点</div>';elements.results.classList.add('open');elements.results.querySelectorAll('button').forEach(b=>b.onclick=()=>{elements.search.value='';$('clearSearch').style.display='none';renderMain();openDetail(b.dataset.id)});renderMain()}
function applyTransform(x,y,scale){state={tx:Math.max(-165,Math.min(165,x)),ty:Math.max(-260,Math.min(260,y)),scale:Math.max(.8,Math.min(1.8,scale))};elements.transform.style.transform=`translate(${state.tx}px,${state.ty}px) scale(${state.scale})`}
elements.stage.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;drag={id:e.pointerId,x:e.clientX,y:e.clientY,tx:state.tx,ty:state.ty};elements.transform.classList.add('dragging');elements.stage.setPointerCapture(e.pointerId)});elements.stage.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;applyTransform(drag.tx+e.clientX-drag.x,drag.ty+e.clientY-drag.y,state.scale)});function endDrag(){drag=null;elements.transform.classList.remove('dragging')}elements.stage.addEventListener('pointerup',endDrag);elements.stage.addEventListener('pointercancel',endDrag);elements.stage.addEventListener('wheel',e=>{e.preventDefault();applyTransform(state.tx,state.ty,state.scale+(e.deltaY<0?.12:-.12))},{passive:false});$('zoomIn').onclick=()=>applyTransform(state.tx,state.ty,state.scale+.2);$('zoomOut').onclick=()=>applyTransform(state.tx,state.ty,state.scale-.2);$('resetMap').onclick=()=>{applyTransform(0,0,1);toast('已重置地图视角')};$('routeLink').onclick=()=>openList('route');$('tabMap').onclick=hidePanels;$('tabSaved').onclick=()=>openList('saved');$('tabMine').onclick=()=>openList('about');$('moreBtn').onclick=()=>openList('about');$('shade').onclick=hidePanels;elements.search.addEventListener('input',renderSearch);$('clearSearch').onclick=()=>{elements.search.value='';renderSearch();elements.search.focus()};window.addEventListener('keydown',e=>{if(e.key==='Escape'){if(elements.search.value){elements.search.value='';renderSearch()}hidePanels()}if(e.key==='Enter'&&document.activeElement===elements.search){const first=filtered()[0];if(first){elements.search.blur();elements.search.value='';renderSearch();openDetail(first.id)}}if(!activePanel&&document.activeElement!==elements.search){if(e.key==='+')applyTransform(state.tx,state.ty,state.scale+.2);if(e.key==='-')applyTransform(state.tx,state.ty,state.scale-.2)}});
renderFilters();renderMain();applyTransform(0,0,1);
})();
</script>
