</style></head><body><main class="shell"><header class="top"><div class="brand">⚡ 一句话<b>游乐场</b></div><nav class="tabs" aria-label="选择游戏"><button data-game="race" class="active">🏎️ 极速竞速</button><button data-game="ship">🎯 运输船</button><button data-game="bird">🚴 鹈鹕骑行</button></nav></header><section class="frame" aria-label="游戏画面"><canvas id="game"></canvas><div class="hud"><div class="hudtop"><div class="pill" id="statA"></div><div class="pill" id="statB"></div></div><div class="bottom"><div class="pill hint" id="hint"></div></div></div><div class="center" id="overlay"><div class="panel"><div class="eyebrow" id="eyebrow">ARCADE 01 / 03</div><h1 id="title">极速竞速</h1><p id="desc">沿着海岸公路冲刺，躲开车辆，挑战最高距离。</p><button class="action" id="start">开始游戏</button></div></div><div class="touch" id="touch"><button data-key="ArrowLeft" aria-label="左移">◀</button><button data-key="ArrowRight" aria-label="右移">▶</button><button data-key="Space" aria-label="动作">●</button></div></section><footer class="foot"><span>键盘与触屏均可游玩 · 按 P 暂停</span><span id="footerMode">01 / 03</span></footer></main><script>
const cv=document.querySelector('#game'),c=cv.getContext('2d');let W=1280,H=720,game='race',running=false,paused=false,t=0,last=0,keys={},pointer={x:0,y:0,down:false},state={};const $=s=>document.querySelector(s), modes={race:{title:'极速竞速',desc:'沿着海岸公路冲刺，躲开车辆，挑战最高距离。',hint:'← → 或 A D 转向 · 空格氮气加速 · 躲开前车',label:'01 / 03'},ship:{title:'运输船',desc:'守住甲板，瞄准移动靶，限时击中更多目标。',hint:'移动鼠标瞄准 · 点击或空格射击 · 击中目标得分',label:'02 / 03'},bird:{title:'鹈鹕骑行',desc:'踩着单车越过海边障碍，收集闪亮的鱼。',hint:'空格 / ↑ / 点击跳跃 · 把握起跳时机',label:'03 / 03'}};

function setMode(g){game=g;running=false;paused=false;t=0;keys={};state={};document.querySelectorAll('[data-game]').forEach(b=>b.classList.toggle('active',b.dataset.game===g));let m=modes[g];$('#title').textContent=m.title;$('#desc').textContent=m.desc;$('#hint').textContent=m.hint;$('#footerMode').textContent=m.label;$('#eyebrow').textContent='ARCADE '+m.label;$('#start').textContent='开始游戏';$('#overlay').style.display='grid';$('#touch [data-key="Space"]').style.display='';hud()}

function poly(pts,color){c.fillStyle=color;c.beginPath();pts.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.closePath();c.fill()}function round(x,y,w,h,r,col){c.fillStyle=col;c.beginPath();c.roundRect(x,y,w,h,r);c.fill()}function line(x,y,X,Y,color,width=2){c.strokeStyle=color;c.lineWidth=width;c.beginPath();c.moveTo(x,y);c.lineTo(X,Y);c.stroke()}function circle(x,y,r,col){c.fillStyle=col;c.beginPath();c.arc(x,y,r,0,7);c.fill()}function text(s,x,y,size,col='#fff',align='left'){c.fillStyle=col;c.font=`800 ${size}px sans-serif`;c.textAlign=align;c.fillText(s,x,y)}function sky(day=true){let gr=c.createLinearGradient(0,0,0,H);gr.addColorStop(0,day?'#55a2d2':'#112b48');gr.addColorStop(.68,day?'#d9d6a2':'#43718a');gr.addColorStop(1,day?'#81c4c6':'#193f56');c.fillStyle=gr;c.fillRect(0,0,W,H);circle(W*.78,H*.18,Math.max(26,W*.04),day?'#ffe8a1':'#b7ddec');for(let i=0;i<5;i++){let x=(i*267+90-t*9)%(W+250)-100,y=H*(.13+i%3*.1);round(x,y,W*.12,7,9,'#ffffff4a');circle(x+W*.04,y,12,'#ffffff4a')}}
function race(dt){let s=state;if(running&&!paused){let boost=(keys.Space||keys[' '])&&s.boost>0;s.speed=210+(boost?170:0);s.boost=Math.max(0,Math.min(100,s.boost+(boost?-42:13)*dt));s.x=Math.max(-.83,Math.min(.83,s.x+((keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0))*dt*1.45));s.dist+=s.speed*dt/5;s.spawn-=dt;if(s.spawn<=0){s.spawn=.75+Math.random()*.7;s.traffic.push({lane:Math.floor(Math.random()*3)-1,z:0,color:['#ff594d','#e8eef4','#f8bb43'][Math.floor(Math.random()*3)],hit:false})}s.traffic.forEach(a=>{a.z+=dt*(.36+s.speed/800);if(a.z>.83&&!a.hit&&Math.abs(s.x-a.lane*.57)<.25){a.hit=true;s.health--;s.shake=.3;if(s.health<=0)end()}});s.traffic=s.traffic.filter(a=>a.z<1.25);s.shake=Math.max(0,s.shake-dt)}sky();let horizon=H*.38,roadY=H*.49;poly([[0,roadY],[W,roadY],[W,H],[0,H]],'#238b97');for(let i=0;i<10;i++){let x=i*W/9;poly([[x,horizon+12],[x+15,horizon-6],[x+33,horizon+12]],'#2f7285')}let leftTop=W*.43,rightTop=W*.57,leftBot=-W*.1,rightBot=W*1.1;poly([[leftTop,roadY],[rightTop,roadY],[rightBot,H],[leftBot,H]],'#262d39');poly([[leftTop-6,roadY],[leftTop,roadY],[leftBot,H],[leftBot-14,H]],'#f3e1aa');poly([[rightTop,roadY],[rightTop+6,roadY],[rightBot+14,H],[rightBot,H]],'#f3e1aa');for(let lane of [-1,1])for(let i=0;i<9;i++){let z=((i/9+t*(running?speedFactor():.2))%1),y=roadY+z*z*(H-roadY),x=W/2+lane*(W*.045+z*W*.245);line(x,y,x+lane*z*W*.05,y+Math.max(4,z*H*.07),'#ebeee9',2+z*5)}s.traffic?.sort((a,b)=>a.z-b.z).forEach(a=>{let z=a.z,y=roadY+z*z*(H-roadY),x=W/2+a.lane*z*W*.37,w=15+z*W*.105,h=10+z*H*.16;car(x,y,w,h,a.color)});let shake=s.shake?Math.random()*s.shake*22:0;car(W/2+s.x*W*.33+shake,H*.81,Math.min(W*.13,150),Math.min(H*.21,145),'#25def4',true);if(running&&keys.Space&&s.boost>0){poly([[W/2+s.x*W*.33-20,H*.94],[W/2+s.x*W*.33,H],[W/2+s.x*W*.33+20,H*.94]],'#ffdc45')}hud()}
function speedFactor(){return state.speed/210*.45}function car(x,y,w,h,col,player=false){c.save();c.translate(x,y);poly([[-w*.48,h*.42],[-w*.37,-h*.25],[-w*.23,-h*.5],[w*.23,-h*.5],[w*.37,-h*.25],[w*.48,h*.42]],col);poly([[-w*.25,-h*.18],[-w*.18,-h*.41],[w*.18,-h*.41],[w*.25,-h*.18]],'#113453');round(-w*.4,h*.24,w*.18,h*.09,3,'#ff4046');round(w*.22,h*.24,w*.18,h*.09,3,'#ff4046');if(player){line(-w*.41,h*.05,w*.41,h*.05,'#a8fbff',3);round(-w*.32,h*.32,w*.64,h*.04,3,'#112032')}c.restore()}
function ship(dt){let s=state;if(running&&!paused){s.time-=dt;s.spawn-=dt;if(s.spawn<=0){s.spawn=.7+Math.random()*.65;s.targets.push({x:W*(.15+Math.random()*.7),y:H*(.39+Math.random()*.24),dir:Math.random()<.5?-1:1,life:4,hit:false})}s.targets.forEach(a=>{a.x+=a.dir*dt*W*.05;a.life-=dt});s.targets=s.targets.filter(a=>a.life>0&&!a.hit);s.flash=Math.max(0,s.flash-dt);s.shots=s.shots.filter(a=>t-a.t<.3);if(s.time<=0||s.ammo<=0&&s.targets.length===0)end()}sky(false);poly([[0,H*.53],[W,H*.53],[W,H],[0,H]],'#163f50');for(let i=0;i<14;i++)line(i*W/12,H*.65+(i%3)*17,i*W/12+40,H*.65+(i%3)*17,'#64a8aa55',2);poly([[W*.04,H*.32],[W*.28,H*.32],[W*.37,H*.58],[W*.02,H*.58]],'#364a58');poly([[W*.71,H*.36],[W*.97,H*.36],[W,H*.63],[W*.62,H*.63]],'#344a58');round(W*.07,H*.25,W*.18,H*.085,4,'#a67b49');round(W*.75,H*.28,W*.19,H*.09,4,'#a67b49');for(let i=0;i<4;i++){let x=W*(.16+i*.23);round(x,H*.54,W*.17,H*.10,3,'#94613e');line(x,H*.565,x+W*.17,H*.565,'#c18a58',3)}poly([[0,H*.73],[W,H*.73],[W,H],[0,H]],'#394b52');for(let i=0;i<11;i++)line(i*W/10,H*.73,i*W/10+W*.15,H,'#53636b',2);line(0,H*.73,W,H*.73,'#d7b68b',7);s.targets?.forEach(a=>{circle(a.x,a.y,Math.max(15,W*.016),'#e84e50');circle(a.x,a.y,Math.max(10,W*.010),'#e7d2a3');circle(a.x,a.y,Math.max(5,W*.005),'#e74b4b')});let x=pointer.x||W/2,y=pointer.y||H*.47;line(x-20,y,x-7,y,'#f7f3df',2);line(x+7,y,x+20,y,'#f7f3df',2);line(x,y-20,x,y-7,'#f7f3df',2);line(x,y+7,x,y+20,'#f7f3df',2);circle(x,y,3,'#ffdf72');poly([[W*.46,H],[W*.49,H*.83],[W*.51,H*.83],[W*.54,H]],'#152635');if(s.flash)circle(W*.5,H*.80,15+s.flash*55,'#ffdd8188');s.shots?.forEach(a=>circle(a.x,a.y,22*(1-(t-a.t)/.3),'#ffffff88'));hud()}
function shoot(){if(game!=='ship'||!running||paused||state.ammo<=0)return;let s=state;s.ammo--;s.flash=.12;s.shots.push({x:pointer.x||W/2,y:pointer.y||H*.47,t});let hit=s.targets.find(a=>Math.hypot(a.x-(pointer.x||W/2),a.y-(pointer.y||H*.47))<Math.max(26,W*.025));if(hit){hit.hit=true;s.score+=100}if(s.ammo===0)setTimeout(()=>{if(running&&game==='ship')end()},500)}
function bird(dt){let s=state,ground=H*.77;if(running&&!paused){s.dist+=dt*24;s.vy+=H*2.7*dt;s.y+=s.vy*dt;if(s.y>0){s.y=0;s.vy=0}s.spawn-=dt;if(s.spawn<=0){s.spawn=.85+Math.random()*.9;s.objects.push({x:W+40,type:Math.random()<.48?'fish':'crate',hit:false})}s.objects.forEach(a=>{a.x-=dt*W*.42;if(!a.hit&&Math.abs(a.x-W*.25)<W*.05){if(a.type==='fish'&&s.y< -H*.08){a.hit=true;s.score++}else if(a.type==='crate'&&s.y> -H*.08){a.hit=true;s.health--;if(s.health<=0)end()}}});s.objects=s.objects.filter(a=>a.x>-80)}sky();poly([[0,H*.55],[W,H*.55],[W,H],[0,H]],'#56aab0');for(let i=0;i<11;i++)line((i*163-t*30)%W,H*.64+i%2*20,(i*163-t*30)%W+50,H*.64+i%2*20,'#d1ecdf66',3);poly([[0,ground],[W,ground],[W,H],[0,H]],'#d3ae76');line(0,ground,W,ground,'#fff3be',10);for(let i=0;i<15;i++){let x=(i*130-t*(running?130:20))%(W+140);line(x,ground+30,x+55,ground+30,'#a3795780',3)}s.objects?.forEach(a=>{if(a.type==='fish'){text('🐟',a.x,ground-H*.13,Math.max(25,W*.028))}else{round(a.x-23,ground-35,46,35,3,'#ad6f39');line(a.x-18,ground-30,a.x+18,ground-5,'#e8aa62',3)}});let x=W*.25,y=ground+s.y;circle(x-40,y-18,Math.max(20,W*.028),'#1d3341');circle(x+40,y-18,Math.max(20,W*.028),'#1d3341');circle(x-40,y-18,Math.max(12,W*.018),'#cfebda');circle(x+40,y-18,Math.max(12,W*.018),'#cfebda');line(x-40,y-18,x,y-57,'#f6c04e',5);line(x,y-57,x+40,y-18,'#f6c04e',5);line(x-40,y-18,x+40,y-18,'#f6c04e',5);line(x,y-57,x+12,y-83,'#f6c04e',5);circle(x+10,y-110,Math.max(19,W*.022),'#fff0c5');poly([[x+23,y-110],[x+59,y-104],[x+25,y-97]],'#f6a83d');circle(x+17,y-116,3,'#202c39');poly([[x-6,y-91],[x+6,y-88],[x+12,y-58],[x-16,y-65]],'#f8f4df');line(x-11,y-65,x-28,y-30,'#eaa34c',4);line(x+7,y-64,x+21,y-34,'#eaa34c',4);hud()}
function jump(){if(game==='bird'&&running&&!paused&&state.y===0)state.vy=-H*1.08}
function frame(now){let dt=Math.min((now-last)/1000||0,.04);last=now;if(!paused)t+=dt;c.clearRect(0,0,W,H);if(game==='race')race(dt);else if(game==='ship')ship(dt);else bird(dt);if(paused){round(W/2-120,H/2-42,240,84,14,'#071525cc');text('已暂停',W/2,H/2+12,32,'#fff','center')}requestAnimationFrame(frame)}requestAnimationFrame(frame);
