\n23|判断|优先级调度算法中，在考虑静态优先级时，一般计算进程的优先级高于磁盘I/O进程的优先级。|错|通常会适当提高I/O型进程优先级，以便尽快启动I/O并提高设备利用率。|A. 对~B. 错\n24|判断|作业一旦被作业调度选中，系统就给它分配CPU。|错|作业调度选中后主要是调入内存并建立进程进入就绪态，CPU由进程调度分配。|A. 对~B. 错\n25|判断|交互式作业不存在作业调度问题。|对|交互式作业通常直接进入系统参与进程调度，不采用传统批处理意义上的作业调度。|A. 对~B. 错\n26|填空|在时间片轮转算法中，如果时间片太大并大到一定程度时，时间片轮转调度算法退化为（ ）调度算法。|FCFS / 先来先服务 / FIFO|时间片足够大时，进程通常能一次运行完，效果等同FCFS。|\n27|填空|进程的调度方式有两种，一种是（ ）调度方式，另一种是（ ）调度方式。|抢占式；非抢占式|题库第1空为抢先式/抢占式/强占式，第2空为非抢先式/非抢占式/非强占式。|\n28|填空|死锁产生的4个必要条件是（ ）、（ ）、（ ）、（ ）。|互斥条件；不可剥夺条件；请求与保持条件；循环等待条件|四条件必须同时成立才可能发生死锁。题库第2空要求不可剥夺，第3空要求请求与保持。|\n29|填空|银行家算法中，当一个进程提出的资源请求将导致系统从（ ）进入（ ）时，系统就会拒绝它的资源请求。|安全状态；非安全状态|银行家算法只允许分配后系统仍处于安全状态的请求。|\n30|填空|若每个作业只建立一个进程：照顾短作业；照顾紧急作业；实现人机交互；兼顾短作业和长时间等待；使短作业、长作业及交互作业都较满意；使平均周转时间最短，应依次采用哪些调度算法？|短作业优先；最高优先级优先；时间片轮转；最高响应比优先；多级反馈队列；短作业优先|SJF照顾短作业并可使平均周转时间较短；优先级适合紧急任务；RR适合交互；HRRN兼顾服务时间和等待时间；多级反馈队列兼顾多类作业。|\n31|填空|所有作业均进入输入井后立即开始调度。作业1：8.0到达/需1h；作业2：8.2/0.5h；作业3：8.4/0.2h；作业4：8.6/0.6h。采用短作业优先时，依次填写4个周转时间、平均周转时间、4个带权周转时间、平均带权周转时间。|2.9；1.1；0.4；1.3；1.425；2.9；2.2；2；2.2；2.325|所有作业均进入输入井后才开始调度，即从8.6开始。SJF顺序为3→2→4→1。|\n32|填空|同上作业序列。采用先来先服务调度算法时，依次填写4个周转时间、平均周转时间、4个带权周转时间、平均带权周转时间。|1.6；1.9；1.9；2.3；1.925；1.6；3.8；9.5；3.8；4.675|所有作业均进入输入井后才开始调度，即从8.6开始。FCFS顺序为1→2→3→4。|"};</script>
<script>
const INFO={C1:["第1章 操作系统引论","基础概念、系统类型与基本特征"],C2:["第2章 进程与线程","进程状态、PCB、线程与通信"],C3:["第3章 调度与死锁","调度算法、死锁与作业计算"]};
function parse(s){return s.trim().split("\n").map(x=>{let p=x.split("|");return{n:+p[0],type:p[1],q:p[2],a:p[3],e:p[4],opts:p[5]?p[5].split("~"):[]}})}

function toast(s){$("#toast").textContent=s;$("#toast").classList.add("on");setTimeout(()=>$("#toast").classList.remove("on"),1300)}
function chapterNav(){$("#chapters").innerHTML=Object.keys(DB).map(k=>`<button class="chap ${k===ch?"active":""}" data-ch="${k}"><b>${INFO[k][0]}</b><em>${DB[k].length}</em><small>${INFO[k][1]}</small></button>`).join("");document.querySelectorAll(".chap").forEach(b=>b.onclick=()=>setChapter(b.dataset.ch))}
function setChapter(k){$("#side").classList.remove("open");ch=k;selected=null;$("#ey").textContent="CHAPTER 0"+k.slice(1);$("#title").textContent=INFO[k][0];$("#sub").textContent=INFO[k][1]+" · "+DB[k].length+"题";$("#note").innerHTML=k==="C3"?'<div class="note">本章答案按你的100分作答记录校准。第31、32题统一在所有作业进入输入井后（8.6）才开始调度。</div>':"";chapterNav();render();closeDetail();history.replaceState(null,"","#"+k.toLowerCase())}
function render(){let term=$("#search").value.trim().toLowerCase();let arr=DB[ch].filter(x=>(filter==="all"||x.type===filter)&&(!term||[x.q,x.a,x.e,...x.opts].join(" ").toLowerCase().includes(term)));$("#list").classList.toggle("showans",showAns);$("#list").innerHTML=arr.length?arr.map(x=>`<article class="row ${selected===x.n?"active":""}" tabindex="0" data-n="${x.n}"><div class="num">${String(x.n).padStart(2,"0")}</div><div><h3>${esc(x.q)}</h3><div class="meta"><span class="tag">${x.type}</span><span class="anschip">${esc(x.a)}</span></div></div><div class="chev">›</div></article>`).join(""):'<div class="empty"><b>没有找到匹配题目</b>换一个关键词，或清除题型筛选。</div>';document.querySelectorAll(".row").forEach(r=>{r.onclick=()=>openQ(+r.dataset.n);r.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openQ(+r.dataset.n)}}})}

function openQ(n){selected=n;let x=DB[ch].find(v=>v.n===n),vis=visibleItems(),idx=vis.findIndex(v=>v.n===n);if(idx<0){vis=DB[ch];idx=vis.findIndex(v=>v.n===n)};$("#pos").textContent=`${idx+1} / ${vis.length}`;$("#detailBody").innerHTML=`<div><div class="qno">${INFO[ch][0]} · ${x.type} · ${String(x.n).padStart(2,"0")}</div><h2>${esc(x.q)}</h2>${x.opts.length?'<div class="opts">'+x.opts.map(o=>`<div class="opt">${esc(o)}</div>`).join("")+"</div>":""}<section class="block"><div class="bl">标准答案</div><div class="bigans">${esc(x.a)}</div></section><section class="block"><div class="bl">解析</div><div class="ex">${esc(x.e)}</div></section><div class="navq"><button id="prev" ${idx===0?"disabled":""}>← 上一题</button><button id="next" ${idx===vis.length-1?"disabled":""}>下一题 →</button></div></div>`;$("#detail").classList.add("open");render();let p=$("#prev"),q=$("#next");if(p)p.onclick=()=>openQ(vis[idx-1].n);if(q)q.onclick=()=>openQ(vis[idx+1].n)}
function closeDetail(){$("#detail").classList.remove("open");selected=null;render()}
$("#search").oninput=()=>{render();if(selected&&!visibleItems().some(x=>x.n===selected))closeDetail()};$("#filters").onclick=e=>{let b=e.target.closest("button");if(!b)return;filter=b.dataset.f;document.querySelectorAll("#filters button").forEach(x=>x.classList.toggle("active",x===b));render()};$("#toggleAns").onclick=()=>{showAns=!showAns;$("#toggleAns").textContent=showAns?"隐藏列表答案":"显示列表答案";render()};$("#theme").onclick=()=>{let d=document.documentElement;d.dataset.theme=d.dataset.theme==="dark"?"light":"dark";localStorage.setItem("os-workshop:desk-theme",d.dataset.theme)};$("#copy").onclick=async()=>{let t=DB[ch].map(x=>`${x.n}. ${x.a}`).join("\n");try{await navigator.clipboard.writeText(t);toast("本章答案已复制")}catch{toast("浏览器未允许剪贴板访问")}};$("#back").onclick=closeDetail;$("#menu").onclick=()=>$("#side").classList.toggle("open");document.addEventListener("keydown",e=>{if(e.key==="/"&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();$("#search").focus()}if(e.key==="Escape"){closeDetail();$("#side").classList.remove("open")}if(selected&&e.key==="ArrowRight"){let v=visibleItems(),i=v.findIndex(x=>x.n===selected);if(i>=0&&i<v.length-1)openQ(v[i+1].n)}if(selected&&e.key==="ArrowLeft"){let v=visibleItems(),i=v.findIndex(x=>x.n===selected);if(i>0)openQ(v[i-1].n)}});window.addEventListener("offline",()=>toast("已离线 · 题库仍可正常使用"));window.addEventListener("online",()=>toast("网络已恢复"));
let saved=localStorage.getItem("os-workshop:desk-theme");if(saved)document.documentElement.dataset.theme=saved;else if(matchMedia("(prefers-color-scheme:dark)").matches)document.documentElement.dataset.theme="dark";let hash=location.hash.replace("#","").toUpperCase();setChapter(DB[hash]?hash:"C1");
</script></body></html>
