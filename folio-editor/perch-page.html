// Original inline technical figure: the image has no external dependency.
const logDiagram=`<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="375" viewBox="0 0 1200 375"><rect width="1200" height="375" fill="#283e33"/><g fill="none" stroke="#c2cdb3" stroke-opacity=".07"><circle cx="1150" cy="20" r="220"/><circle cx="1150" cy="20" r="270"/><circle cx="1150" cy="20" r="320"/></g><path d="M58 58h20m-10-10v20" stroke="#c0d1b2" stroke-width="1.5"/><text x="93" y="65" fill="#c0d1b2" font-size="17" font-family="Arial,sans-serif" letter-spacing="3">FOLLOW THE SIGNAL</text><text x="1098" y="64" text-anchor="end" fill="#a9b8a0" font-family="Consolas,monospace" font-size="14">LINUX / FIELD NOTES</text><g stroke="#8ba481" stroke-width="1.5" fill="none"><path d="M152 149h156v95H152zM152 171h156M169 160h5m7 0h5m7 0h5M174 190l10 9-10 9m21 0h23"/><path d="M370 197h82m-8-6 7 6-7 6"/><path d="M526 162c0-21 148-21 148 0v69c0 21-148 21-148 0z"/><ellipse cx="600" cy="162" rx="74" ry="16"/><path d="M526 194c0 21 148 21 148 0M737 197h82m-8-6 7 6-7 6"/><rect x="883" y="147" width="153" height="100" rx="4"/><path d="M901 169h11m12 0h62M901 190h11m12 0h43M901 211h11m12 0h62M901 232h11m12 0h43"/></g><g fill="#e4e9db" font-family="Arial,sans-serif" font-size="20" text-anchor="middle"><text x="230" y="292">system services</text><text x="600" y="292">journald</text><text x="960" y="292">journalctl</text></g><g fill="#a7b89e" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" letter-spacing="1"><text x="230" y="320">GENERATE</text><text x="600" y="320">COLLECT</text><text x="960" y="320">EXPLORE</text></g></svg>`;
const quietDiagram=`<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#d9decf"/><rect x="80" y="60" width="1040" height="510" fill="#dfe3d7"/><g fill="none" stroke="#89977d" stroke-width="1"><circle cx="600" cy="315" r="68"/><circle cx="600" cy="315" r="112"/><circle cx="600" cy="315" r="160"/><circle cx="600" cy="315" r="212"/></g><path d="M80 315h440m160 0h440M600 60v187m0 136v187" stroke="#89977d" stroke-opacity=".4"/><circle cx="600" cy="315" r="4" fill="#4d6345"/><text x="110" y="108" font-family="Georgia,serif" font-size="17" fill="#56684c" letter-spacing="4">A MOMENT, UNHURRIED.</text><text x="1090" y="531" text-anchor="end" font-family="Georgia,serif" font-style="italic" font-size="18" fill="#56684c">Less noise. More life.</text></svg>`;
const imageURI=svg=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
const meta=(minutes,tag)=>`<div class="article-meta"><span class="avatar">L</span><span>林间</span><i class="meta-separator"></i><span>2026 年 11 月 10 日</span><i class="meta-separator"></i><span>${minutes} 分钟阅读</span><span class="topic">${tag}</span></div>`;
const documents={
linux:{name:'Linux 日志排查指南',html:`<h1 contenteditable="true" spellcheck="false">读懂 Linux 日志，<br>从容定位每一次异常</h1>${meta(6,'Linux · 实践')}<p class="lead" contenteditable="true">服务突然停止响应时，日志往往是最诚实的线索。我们从一条命令出发，学会在纷繁的信息里，找到真正值得关注的那一行。</p><figure><img src="${imageURI(logDiagram)}" alt="日志流转图：系统服务产生事件，journald 收集日志，journalctl 查询与筛选。" width="1200" height="375"><figcaption>从事件发生，到线索浮现：一条日志的旅程</figcaption></figure><h2 id="understand" contenteditable="true">先理解，日志从哪里来</h2><p contenteditable="true">在使用 systemd 的 Linux 系统中，服务输出、内核消息和系统事件可以汇入 <code>systemd-journald</code>。而 <code>journalctl</code> 就像一扇窗口，让我们按时间、服务和优先级查看这些记录。</p><p contenteditable="true">不必一开始就记住所有参数。先确定三个问题：<strong>什么时候发生，哪个服务异常，错误之前发生了什么。</strong></p><div class="callout">${icon('info')}<div><b>开始之前</b><p contenteditable="true">本文适用于使用 systemd 的 Linux 系统。示例以 nginx 服务为例；请替换成实际服务名。读取系统日志可能需要 sudo 权限。</p></div></div><h2 id="first-command" contenteditable="true">从第一条命令开始</h2><p contenteditable="true">先把范围缩小到本次启动。这样可以避开上一次开机留下的记录，更快地建立当前运行环境的时间线。</p>${codeBlock('<span class="code-comment"># 查看本次启动以来的日志</span>\n<span class="code-cmd">sudo journalctl</span> <span class="code-flag">-b</span>\n\n<span class="code-comment"># 只看最近 50 条，直接输出而不进入分页器</span>\n<span class="code-cmd">sudo journalctl</span> <span class="code-flag">-b -n 50 --no-pager</span>')}<p contenteditable="true">默认会进入分页阅读：用方向键滚动，按 <code>/</code> 搜索关键词，按 <code>q</code> 退出。日志是带有时间戳的过程记录，读的时候，别急着跳过错误前面的几行。</p><h2 id="filter" contenteditable="true">把噪声留在筛选器之外</h2><p contenteditable="true">假设 nginx 刚刚出现异常，我们可以把服务、时间和优先级组合起来。每加一个条件，都在缩小需要理解的范围。</p>${codeBlock('<span class="code-comment"># 只查看 nginx 最近 30 分钟的日志</span>\n<span class="code-cmd">sudo journalctl</span> <span class="code-flag">-u</span> nginx.service <span class="code-flag">--since</span> "30 min ago"\n\n<span class="code-comment"># 筛选本次启动中，error 及更严重的消息</span>\n<span class="code-cmd">sudo journalctl</span> <span class="code-flag">-b -p err</span>')}<table><thead><tr><th>条件</th><th>参数</th><th>帮你回答</th></tr></thead><tbody><tr><td>启动范围</td><td><code>-b</code></td><td>这次开机发生了什么？</td></tr><tr><td>指定服务</td><td><code>-u nginx.service</code></td><td>哪个服务在报错？</td></tr><tr><td>起始时间</td><td><code>--since "30 min ago"</code></td><td>故障前后发生了什么？</td></tr><tr><td>优先级</td><td><code>-p err</code></td><td>哪些消息最值得先看？</td></tr></tbody></table><details><summary>为什么筛选 error 之后，仍要回看完整上下文？</summary><p contenteditable="true">错误行告诉你结果，普通信息和警告可能告诉你原因。例如，配置变更、依赖服务重启或资源紧张，可能先于最终错误出现。定位到时间点后，去掉优先级限制，再读一遍前后日志。</p></details><h2 id="follow" contenteditable="true">跟着现场，观察变化</h2><p contenteditable="true">需要观察后续变化时，加上 <code>-f</code>。新的日志会继续显示；在另一个终端进行必要的诊断操作，再回到这里观察结果。</p>${codeBlock('<span class="code-comment"># 持续跟踪 nginx 日志</span>\n<span class="code-cmd">sudo journalctl</span> <span class="code-flag">-u</span> nginx.service <span class="code-flag">-f</span>\n\n<span class="code-comment"># 按 Ctrl + C 结束跟踪</span>')}<div class="callout">${icon('leaf')}<div><b>一个好习惯</b><p contenteditable="true">先记录故障发生时间和关键错误，再采取操作。保留原始线索，会让下一次复盘更轻松。</p></div></div><h2 id="checklist" contenteditable="true">留下一条可复用的排查路径</h2><p contenteditable="true">日志排查的价值，不只是找到一条报错，而是还原发生了什么。下一次遇到异常，可以从这条简单路径重新出发：</p><ol><li contenteditable="true"><strong>确定时间。</strong>记录异常出现的时间及最近一次变更。</li><li contenteditable="true"><strong>锁定服务。</strong>先按服务筛选，再用时间范围缩小现场。</li><li contenteditable="true"><strong>理解上下文。</strong>把报错前后的消息连起来阅读。</li><li contenteditable="true"><strong>验证与记录。</strong>观察后续日志，把原因与处理过程写下来。</li></ol><details><summary>补充阅读：为什么看不到上一次启动的日志？</summary><p contenteditable="true">历史日志是否保留，取决于 journald 的存储配置。仅使用运行时存储时，重启后旧日志不会保留。可以先通过 <code>journalctl --list-boots</code> 查看当前可用的启动记录，再检查本机的日志持久化策略。</p></details><div class="references">延伸阅读：<a href="https://www.freedesktop.org/software/systemd/man/latest/journalctl.html" target="_blank" rel="noopener noreferrer">journalctl 官方手册 ↗</a> · <a href="https://www.freedesktop.org/software/systemd/man/latest/systemd-journald.service.html" target="_blank" rel="noopener noreferrer">systemd-journald 官方文档 ↗</a><br>命令用于说明基本查询方式，请以本机安装版本的手册为准。</div><div class="article-end">写到这里，刚刚好</div>`},
short:{name:'把日子写慢一点',html:`<h1 contenteditable="true" spellcheck="false">把日子写慢一点</h1>${meta(2,'日常 · 随笔')}<p class="lead" contenteditable="true">有些想法不需要立刻成为答案。<br>把它们写下来，已经是一种照顾。</p><figure><img src="${imageURI(quietDiagram)}" alt="安静的同心圆图形，中心一点向外延展，象征一个念头慢慢展开。" width="1200" height="630"><figcaption>一个念头，也有自己的涟漪。</figcaption></figure><h2 id="pause" contenteditable="true">在空白里，停一会儿</h2><p contenteditable="true">早晨的水还没有烧开，我在桌边坐下。窗外有人推着自行车经过，车铃响了一声，随后又安静了。我原本打算写一份长长的计划，最后只记下了这件小事。</p><p contenteditable="true">屏幕上没有进度条，也没有等待完成的清单。只有一句话，和它后面足够宽的空白。那一刻我觉得，写作也许不总是为了产出什么。有时，它只是让我重新听见自己的声音。</p><blockquote contenteditable="true">不是每一页都需要写满。<br>留一点空白，让生活自己走进来。</blockquote><h2 id="small-things" contenteditable="true">记住那些很小的事</h2><p contenteditable="true">一杯温度刚好的茶，一段没走过的小路，一句当时没有说出口的话。小事没有标题，却构成了我们生活的大部分。写下来以后，它们就不那么容易消失。</p><p contenteditable="true">今天先写到这里。水已经开了，我要去泡茶。下一页的事情，留给下一页。</p><div class="short-date">写于一个普通的星期二 · 林间</div><div class="article-end">未完，也很好</div>`}
};
let activeDoc='linux',isBusy=false,toastTimer,insertAnchor=null;

const drafts={};
function toast(message){$('#toast').textContent=message;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),2600)}
function applyTheme(theme){if(!['paper','minimal','dark'].includes(theme))return;document.documentElement.dataset.theme=theme;$$('.theme-btn').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.theme===theme)));try{localStorage.setItem('qiye-theme',theme)}catch{}}

try{applyTheme(localStorage.getItem('qiye-theme')||'paper')}catch{}
function updateStats(){const text=article.innerText;const count=(text.match(/[\u3400-\u9fff]|[A-Za-z0-9]+/g)||[]).length;$('#wordCount').textContent=count.toLocaleString()+' 字';$('#readTime').textContent='约 '+Math.max(1,Math.ceil(count/320))+' 分钟';updateProgress()}
function buildOutline(){const nav=$('#outline');nav.replaceChildren();article.querySelectorAll('h2').forEach((heading,index)=>{if(!heading.id)heading.id='section-'+index;const a=document.createElement('a');a.href='#'+heading.id;a.textContent=heading.textContent;a.addEventListener('click',e=>{e.preventDefault();heading.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'start'});if(innerWidth<=700){workspace.classList.remove('mobile-nav');syncPanels()}});nav.append(a)});updateProgress()}
function updateProgress(){const total=canvas.scrollHeight-canvas.clientHeight;$('#readProgress').textContent='阅读 '+(total>0?Math.min(100,Math.round(canvas.scrollTop/total*100)):100)+'%';const headings=[...article.querySelectorAll('h2')];const top=canvas.getBoundingClientRect().top;let current=headings[0];headings.forEach(h=>{if(h.getBoundingClientRect().top-top<140)current=h});$$('#outline a').forEach(a=>{const active=a.hash==='#'+current?.id;a.classList.toggle('active',active);if(active)a.setAttribute('aria-current','location');else a.removeAttribute('aria-current')})}
function switchDoc(key){if(!documents[key])return;drafts[activeDoc]=article.innerHTML||documents[activeDoc].html;activeDoc=key;article.innerHTML=drafts[key]||documents[key].html;article.classList.toggle('short-article',key==='short');$('#crumbTitle').textContent=documents[key].name;$('#contextDoc').textContent=documents[key].name;$$('.doc-btn').forEach(b=>{if(b.dataset.doc===key)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});$('#chatLog').replaceChildren();$('#aiIntro').hidden=false;canvas.scrollTop=0;$('#page').classList.remove('animate');void $('#page').offsetWidth;$('#page').classList.add('animate');$('#saveLabel').textContent=drafts[key]&&drafts[key]!==documents[key].html?'当前会话中的文稿':'示例已就绪';buildOutline();updateStats();if(innerWidth<=700){workspace.classList.remove('mobile-nav');syncPanels()}}
$$('.doc-btn').forEach(b=>b.addEventListener('click',()=>switchDoc(b.dataset.doc)));
function syncPanels(){const navOpen=innerWidth<=700?workspace.classList.contains('mobile-nav'):!workspace.classList.contains('left-closed');const aiOpen=innerWidth<=980?workspace.classList.contains('mobile-ai'):!workspace.classList.contains('right-closed');$('#navToggle').setAttribute('aria-expanded',String(navOpen));$('#aiToggle').setAttribute('aria-expanded',String(aiOpen));$('#sidebar').inert=!navOpen;$('#assistant').inert=!aiOpen}
function toggleNav(){workspace.classList.toggle(innerWidth<=700?'mobile-nav':'left-closed');workspace.classList.remove('mobile-ai');syncPanels()}
function toggleAI(){workspace.classList.toggle(innerWidth<=980?'mobile-ai':'right-closed');workspace.classList.remove('mobile-nav');syncPanels()}
$('#navToggle').onclick=toggleNav;$('#sideClose').onclick=()=>{toggleNav();$('#navToggle').focus()};$('#aiToggle').onclick=toggleAI;$('#aiClose').onclick=()=>{toggleAI();$('#aiToggle').focus()};$('#veil').onclick=()=>{workspace.classList.remove('mobile-nav','mobile-ai');syncPanels()};
$('#focusBtn').onclick=()=>{const on=app.classList.toggle('focus-mode');$('#focusLabel').textContent=on?'退出专注':'专注';$('#focusBtn').setAttribute('aria-pressed',String(on));$('#focusBtn').setAttribute('aria-label',on?'退出专注':'专注写作');workspace.classList.remove('mobile-nav','mobile-ai');syncPanels();if(on){$('#sidebar').inert=true;$('#assistant').inert=true}toast(on?'进入专注模式，让文字占据此刻。':'已返回写作工作室')};
function preview(on){app.classList.toggle('preview-mode',on);workspace.classList.remove('mobile-nav','mobile-ai');article.querySelectorAll('[contenteditable]').forEach(e=>e.contentEditable=String(!on));syncPanels();if(on){$('#sidebar').inert=true;$('#assistant').inert=true;$('#exitPreview').focus()}else{$('#previewBtn').focus()}updateProgress()}
$('#previewBtn').onclick=()=>preview(true);$('#exitPreview').onclick=()=>preview(false);
$('#toTop').onclick=()=>canvas.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});
canvas.addEventListener('scroll',updateProgress,{passive:true});window.addEventListener('resize',()=>{syncPanels();if(app.classList.contains('preview-mode')||app.classList.contains('focus-mode')){$('#sidebar').inert=true;$('#assistant').inert=true}closeInsert();updateProgress()});
$('#docSearch').addEventListener('input',e=>{const q=e.target.value.toLowerCase();let shown=0;$$('.doc-btn').forEach(b=>{b.hidden=!b.textContent.toLowerCase().includes(q);if(!b.hidden)shown++});$('#emptySearch').hidden=shown>0});
article.addEventListener('input',()=>{$('#saveLabel').textContent='已修改 · 当前会话';drafts[activeDoc]=article.innerHTML;updateStats();buildOutline()});
article.addEventListener('paste',e=>{if(!e.target.closest('[contenteditable="true"]'))return;e.preventDefault();const text=e.clipboardData.getData('text/plain');const selection=window.getSelection();if(!selection.rangeCount)return;const range=selection.getRangeAt(0);range.deleteContents();const node=document.createTextNode(text);range.insertNode(node);range.setStartAfter(node);range.collapse(true);selection.removeAllRanges();selection.addRange(range);article.dispatchEvent(new Event('input'))});
article.addEventListener('click',async e=>{const b=e.target.closest('.copy-btn');if(!b)return;const text=b.closest('.codeblock').querySelector('code').innerText;try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);else{const field=document.createElement('textarea');field.value=text;field.style.cssText='position:fixed;left:-9999px';document.body.append(field);field.select();const ok=document.execCommand('copy');field.remove();if(!ok)throw new Error('copy')}b.innerHTML=icon('check')+'已复制';setTimeout(()=>{if(b.isConnected)b.innerHTML=icon('copy')+'复制'},1600)}catch{toast('浏览器未允许复制，请选中代码后按 Ctrl+C。')}});
function closeInsert(){const menu=$('#insertMenu');if(!menu.hidden){menu.hidden=true;$('#insertBtn').setAttribute('aria-expanded','false')}}
function showInsert(button){const menu=$('#insertMenu');if(!menu.hidden){closeInsert();return}insertAnchor=button;const rect=button.getBoundingClientRect();menu.hidden=false;menu.style.left=Math.min(innerWidth-230,Math.max(10,rect.left))+'px';menu.style.top=Math.min(innerHeight-menu.offsetHeight-12,rect.bottom+8)+'px';$('#insertBtn').setAttribute('aria-expanded','true');menu.querySelector('button').focus()}
$('#insertBtn').onclick=e=>showInsert(e.currentTarget);$('#bottomInsert').onclick=e=>showInsert(e.currentTarget);
function insertHTML(html){const wrap=document.createElement('div');wrap.innerHTML=html;const children=[...wrap.childNodes];article.append(...children);const first=children.find(n=>n.nodeType===1);closeInsert();first?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'center'});const edit=first?.matches('[contenteditable]')?first:first?.querySelector('[contenteditable]');edit?.focus({preventScroll:true});drafts[activeDoc]=article.innerHTML;$('#saveLabel').textContent='已修改 · 当前会话';buildOutline();updateStats();toast('已在文末插入，可点击文字修改。')}
$$('[data-insert]').forEach(b=>b.onclick=()=>{const blocks={text:'<p contenteditable="true">从这里，写下新的想法。</p>',callout:`<div class="callout">${icon('info')}<div><b contenteditable="true">值得记住</b><p contenteditable="true">补充一条说明，让读者更容易理解。</p></div></div>`,code:codeBlock('<span contenteditable="true"># 在这里写下你的命令\npwd</span>'),fold:'<details open><summary contenteditable="true">一个值得展开的问题</summary><p contenteditable="true">把延伸说明放在这里，让正文保持轻盈。</p></details>'};insertHTML(blocks[b.dataset.insert])});
document.addEventListener('click',e=>{if(!e.target.closest('#insertMenu,#insertBtn,#bottomInsert'))closeInsert()});
document.addEventListener('keydown',e=>{const editing=e.target.matches('input,textarea')||e.target.isContentEditable;if(e.key==='Escape'){if(!$('#insertMenu').hidden){closeInsert();insertAnchor?.focus();return}if(app.classList.contains('preview-mode'))preview(false);else if(app.classList.contains('focus-mode'))$('#focusBtn').click();else{const hadAI=workspace.classList.contains('mobile-ai');workspace.classList.remove('mobile-nav','mobile-ai');syncPanels();(hadAI?$('#aiToggle'):$('#navToggle')).focus()}}if(e.key==='/'&&!editing){e.preventDefault();workspace.classList.remove('left-closed');if(innerWidth<=700)workspace.classList.add('mobile-nav');syncPanels();$('#docSearch').focus()}});
const promptInput=$('#promptInput'),sendBtn=$('#sendBtn');

promptInput.addEventListener('input',sendState);promptInput.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('#chatForm').requestSubmit()}});
const replyData={linux:{outline:{text:'这篇文章可以沿着一条由浅入深的路径展开：<ol><li>理解日志的来源</li><li>从本次启动建立时间线</li><li>按服务、时间和优先级筛选</li><li>持续观察，最后记录结论</li></ol><p>这条线索的重点，是从“看到日志”走向“理解现场”。</p>',insert:'排查路径：确认故障时间 → 锁定异常服务 → 阅读前后日志 → 验证并记录结论。'},polish:{text:'可以先把读者带到一个具体的现场：<p>“终端里的服务忽然没有了回应。先别急着重启——系统已经把刚刚发生的事，留在了日志里。”</p><p>从这个瞬间展开，再自然引出 journalctl，会更有代入感。</p>',insert:'终端里的服务忽然没有了回应。先别急着重启——系统已经把刚刚发生的事，留在了日志里。'},summary:{text:'<p>用 journalctl 读懂系统日志：先限定启动范围，再按服务和时间缩小现场；找到错误后回看上下文，用持续跟踪观察变化，最后记录原因与处理过程。</p><p>关键词：<code>journalctl</code>、时间线、上下文。</p>',insert:'本文从 journalctl 的基本查询出发，介绍如何按启动、服务、时间和优先级筛选日志，结合上下文还原故障现场，并留下可复用的排查记录。'}},short:{outline:{text:'<p>这篇短文有一条轻盈的线：从烧水时的片刻停留，走到记录日常的意义，最后回到泡茶这个小动作。</p><p>首尾呼应已经成立，可以保留现在的留白。</p>',insert:'记住今天的一件小事：它发生在哪里，又让我停留了多久？'},polish:{text:'<p>可以让开头更靠近一个动作：</p><p>“水壶还没响。我把计划本翻到新的一页，却先写下了窗外那声车铃。”</p><p>先有声音，再有想法，读者就跟着你坐下来了。</p>',insert:'水壶还没响。我把计划本翻到新的一页，却先写下了窗外那声车铃。'},summary:{text:'<p>写作不必总是为了完成任务。记下生活里的细小片刻，给想法留一点空白，也是在照顾自己。</p>',insert:'放慢一点，记下生活里的小事。写作可以没有任务，只为了在普通的一天里，重新听见自己。'}}};
function addReply(type,question){if(isBusy)return;isBusy=true;sendState();const docAtSend=activeDoc;$('#aiIntro').hidden=true;const log=$('#chatLog');const user=document.createElement('div');user.className='chat-message user';user.textContent=question;log.append(user);const answer=document.createElement('div');answer.className='chat-message';answer.innerHTML=`<div class="chat-author">${icon('leaf')}写作搭子 <span class="demo-tag">预设示例</span></div><p class="muted">正在展开这个想法…</p>`;log.append(answer);$('#assistantBody').scrollTop=$('#assistantBody').scrollHeight;setTimeout(()=>{isBusy=false;sendState();if(activeDoc!==docAtSend||!answer.isConnected)return;const data=replyData[docAtSend][type];answer.innerHTML=`<div class="chat-author">${icon('leaf')}写作搭子 <span class="demo-tag">预设示例</span></div>${data.text}<button class="insert-answer">${icon('plus')}将建议追加到文末</button>`;answer.querySelector('button').onclick=()=>{const p=document.createElement('p');p.contentEditable='true';p.textContent=data.insert;insertHTML(p.outerHTML)};$('#assistantBody').scrollTo({top:$('#assistantBody').scrollHeight,behavior:'smooth'})},650)}
$$('.suggestion').forEach(b=>b.onclick=()=>addReply(b.dataset.prompt,b.querySelector('span').textContent));
$('#chatForm').onsubmit=e=>{e.preventDefault();const q=promptInput.value.trim();if(!q||isBusy)return;promptInput.value='';const type=/开头|润色|吸引|改写/.test(q)?'polish':/大纲|结构|脉络|目录/.test(q)?'outline':'summary';addReply(type,q);sendState()};
$('#exportBtn').onclick=()=>{const clone=article.cloneNode(true);clone.querySelectorAll('[contenteditable]').forEach(e=>e.removeAttribute('contenteditable'));clone.querySelectorAll('button').forEach(e=>e.remove());const escape=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const css=$('style').textContent;const symbols=$('body>svg').outerHTML;const content='<!DOCTYPE html><html lang="zh-CN" data-theme="'+document.documentElement.dataset.theme+'"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+escape(documents[activeDoc].name)+'</title><style>'+css+'html,body{height:auto;overflow:auto}body{padding:32px 16px}.page{max-width:820px}.article{display:block}@media(max-width:700px){body{padding:0}.page{padding:32px 22px}}</style></head><body>'+symbols+'<main class="page">'+clone.outerHTML+'</main></body></html>';const url=URL.createObjectURL(new Blob([content],{type:'text/html;charset=utf-8'}));const link=document.createElement('a');link.href=url;link.download=documents[activeDoc].name+'.html';link.click();setTimeout(()=>URL.revokeObjectURL(url),15000);toast('已导出独立文章 HTML，图片和字体一并保留。')};
switchDoc('linux');syncPanels();document.fonts.ready.then(updateStats);
</script>
</body></html>
