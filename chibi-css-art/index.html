:root { color-scheme: light; background: #fff; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #fff; }
.picture { margin: 0; width: min(94vw, 750px); aspect-ratio: 1; container-type: inline-size; overflow: hidden; }
.art { position: relative; width: 375px; height: 375px; transform-origin: 0 0; transform: scale(calc(100cqw / 375px)); isolation: isolate; }
.part { position: absolute; inset: 0; pointer-events: none; }
.part::before { content: ""; position: absolute; inset: 0; background: var(--fill); clip-path: var(--contour); }
.outlined { filter: drop-shadow(.38px .35px 0 #6c555c) drop-shadow(-.38px -.35px 0 #6c555c); }
@supports not (transform: scale(calc(100cqw / 375px))) {
  .picture { width: 375px; height: 375px; }
  .art { transform: none; }
  @media(max-width: 390px) { .picture { width: 300px; height: 300px; } .art { transform: scale(.8); } }
