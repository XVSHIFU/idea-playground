<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1e1d">
<meta name="description" content="《大荒纪事》离线可玩的互动叙事页面原型，无需网络或 AI 模型。">
<title>大荒纪事 · 穿越荒域 | 离线互动原型</title>
<style>
:root{color-scheme:dark;--ink:#071a19;--paper:#f2ecdd;--muted:#c1cdc0;--gold:#d9bd82;--gold2:#f3dea6;--leaf:#9ec99f;--edge:rgba(220,207,164,.28)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#071a19;font-family:"Noto Serif SC","Songti SC","STSong","SimSun",serif;color:var(--paper)}
button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #e6c887;outline-offset:4px}
::selection{background:#d9bd82;color:#11211e}
.app{height:100svh;min-height:660px;position:relative;isolation:isolate;overflow:hidden;background:#081a1c}
.scene{position:absolute;inset:0;overflow:hidden;z-index:-4;transition:filter 1.1s ease,transform 1.2s ease}
.world-art{width:100%;height:100%;display:block;transform:scale(1.025);transform-origin:center 42%;animation:landscape-enter 1.8s ease-out both}
.app[data-scene="forest"] .scene{filter:hue-rotate(8deg) saturate(1.2) brightness(.79);transform:scale(1.025)}
.app[data-scene="shrine"] .scene{filter:saturate(1.15) brightness(1.08)}
.app[data-scene="night"] .scene{filter:hue-rotate(11deg) brightness(.70)}
.app[data-scene="eagle"] .scene{filter:saturate(.85) contrast(1.18) brightness(.7)}
.app[data-scene="academy"] .scene{filter:hue-rotate(30deg) brightness(1.1)}
.app[data-scene="dream"] .scene{filter:hue-rotate(-35deg) saturate(1.38)}
@keyframes landscape-enter{from{opacity:.2;transform:scale(1.08)}to{opacity:1;transform:scale(1.025)}}
.spark{animation:twinkle 7s ease-in-out infinite alternate;transform-origin:center}
@keyframes twinkle{0%{opacity:.08}50%{opacity:.6}100%{opacity:.15}}
.scene-vignette{position:absolute;inset:0;z-index:-2;pointer-events:none;background:linear-gradient(90deg,rgba(3,17,18,.29),transparent 37%,rgba(2,14,16,.19)),linear-gradient(180deg,rgba(5,18,19,.4) 0%,transparent 21%,rgba(4,14,16,.04) 41%,rgba(3,12,14,.70) 68%,#051315 98%)}
.scene-grain{position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:.14;background-image:url('data:image/svg+xml,%3Csvg viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="n"%3E%3CfeTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23n)" opacity=".30"/%3E%3C/svg%3E')}
.topline{position:absolute;left:clamp(23px,4.4vw,82px);top:clamp(21px,3.6vw,48px);right:clamp(23px,4.4vw,82px);display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.identity{display:flex;align-items:center;gap:12px;color:#efeadc}
.brand-seal{border:1px solid #d6b879b3;color:#f2d38f;width:40px;height:45px;display:grid;place-items:center;writing-mode:vertical-rl;letter-spacing:3px;font-size:12px;background:#0e24249e;box-shadow:inset 0 0 0 3px #102524}
.brandname{font-size:18px;font-weight:600;letter-spacing:.24em;line-height:1.45;text-shadow:0 2px 20px #041011}
.brandname small{display:block;font:10px/1.4 system-ui,sans-serif;letter-spacing:.28em;color:#d4c8a9;margin-top:3px;font-weight:400}
.season{display:flex;align-items:center;gap:8px;margin-top:8px;letter-spacing:.18em;color:#d5dbcb;font-size:12px;background:#0b25286e;border:1px solid #bbd0b332;padding:11px 15px;backdrop-filter:blur(8px)}
.season-dot{height:6px;width:6px;border-radius:50%;background:#d5bd83;box-shadow:0 0 12px #e3cb83}
.ambient-title{position:absolute;top:clamp(106px,19vh,190px);right:clamp(45px,12vw,210px);font-size:clamp(64px,8vw,146px);line-height:1.1;letter-spacing:.2em;writing-mode:vertical-rl;color:#e3e7cb15;font-weight:700;user-select:none;pointer-events:none;filter:drop-shadow(0 3px 25px #e8eab614)}
.scene-caption{position:absolute;top:37%;right:7.5%;text-align:right;color:#e4eddd9c;letter-spacing:.38em;font-size:12px;max-width:280px;line-height:2;text-shadow:0 2px 12px #09171a;transition:opacity .5s}
.scene-caption:before{content:"";display:block;width:34px;height:1px;background:#e9d4a26e;margin:0 0 13px auto}
.story-stage{position:absolute;inset:auto 0 0;z-index:2;padding:70px clamp(23px,4.4vw,82px) clamp(22px,3vh,36px);background:linear-gradient(180deg,transparent 0%,rgba(4,16,18,.48) 14%,rgba(4,15,17,.92) 44%,#061619 100%)}
.story-stage:before{content:"";position:absolute;left:0;right:0;top:26%;height:1px;opacity:.3;pointer-events:none;background:linear-gradient(90deg,transparent,#aeb89a27 50%,transparent)}
.story-shell{max-width:1550px;margin:auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(330px,500px);gap:clamp(40px,8vw,132px);align-items:end;position:relative}
.story-copy{min-width:0;padding-bottom:1px}
.kicker{display:flex;align-items:center;gap:12px;letter-spacing:.29em;color:#cbb68b;font:11px/1.45 system-ui,sans-serif;text-transform:uppercase;margin-bottom:13px}
.kicker:before{content:"";width:22px;height:1px;background:#bea370}
.story-title{font-size:clamp(30px,3.5vw,49px);font-weight:500;line-height:1.26;letter-spacing:.06em;margin:0 0 16px;color:#faf5e5;text-shadow:0 3px 24px #001115;max-width:660px}
.story-text{font-size:clamp(14px,1.19vw,17px);line-height:1.85;color:#dfdfd2;letter-spacing:.045em;max-width:650px;min-height:114px;text-wrap:pretty}
.story-text p{margin:0 0 10px}.story-text p:last-child{margin-bottom:0}
.story-text .voice{border-left:2px solid #ceb17a87;padding-left:13px;margin:8px 0 12px;color:#f1e9cd}
.voice b{color:#e5c789;font-weight:500;margin-right:8px}
.story-text .note{color:#bed2b6;font-size:15px}
.afterword{display:flex;gap:8px;align-items:center;color:#cdb484;font-size:13px;min-height:24px;margin-top:5px}
.afterword:empty{display:none}
.quickbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:26px}
.quick{display:flex;align-items:center;gap:7px;padding:8px 12px;background:transparent;border:1px solid transparent;color:#bfcbbf;font-family:system-ui,sans-serif;font-size:12px;letter-spacing:.09em;border-radius:2px;transition:all .2s}
.quick:hover{border-color:#d2bb8a6a;background:#f4dfaa10;color:#f4e4bc}
.quick svg{width:15px;height:15px;stroke:#c3c8a6;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.bar-divider{width:1px;height:15px;background:#e4d4ae39;margin:0 4px}
.choice-wrap{padding:5px 0 0}
.choice-head{display:flex;align-items:center;justify-content:space-between;color:#d5c69e;font:11px/1.4 system-ui,sans-serif;letter-spacing:.2em;margin-bottom:12px}
.choice-head span:last-child{font-size:10px;color:#829993}
.choices{display:grid;gap:2px}
.choice{position:relative;display:grid;grid-template-columns:38px 1fr 15px;align-items:center;gap:8px;width:100%;min-height:64px;text-align:left;padding:11px 16px 11px 14px;border:1px solid transparent;border-bottom:1px solid #a3ae9b33;background:linear-gradient(90deg,#ffffff09,transparent 80%);color:#e5e7d8;transition:background .18s,border .18s,transform .18s}
.choice:first-child{border-top-color:#a3ae9b33}
.choice:hover{border-color:#d9bd827c;background:linear-gradient(90deg,#d4c08f27,#d4c08f05);transform:translateX(3px)}
.choice:active{transform:translateX(1px)}
.choice-index{font:20px/1 Georgia,serif;color:#c7a975;letter-spacing:.025em}
.choice-text{min-width:0;display:grid;gap:5px}
.choice-label{font-size:15px;line-height:1.35;letter-spacing:.03em;font-weight:500;color:#f1e8ce}
.choice-hint{font:11px/1.4 system-ui,sans-serif;color:#9daea5;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arrow{color:#bba777;font-size:17px;opacity:.55;transition:transform .2s}.choice:hover .arrow{transform:translateX(4px);opacity:1}
.choice.free{background:linear-gradient(90deg,#b89b6e1b,transparent);border-bottom-color:#d2be8b61}
.phase-name .choices{display:none}
.name-entry{display:none}.phase-name .name-entry{display:block}
.name-entry label{display:block;color:#c8b991;margin-bottom:13px;font-size:13px;letter-spacing:.1em}
.name-form{display:flex;border-bottom:1px solid #bfa771a3;gap:9px;align-items:center;padding-bottom:10px}
.name-form input{background:none;border:0;outline:none!important;color:#fff3d5;min-width:0;flex:1;font-size:25px;letter-spacing:.12em}
.name-form input::placeholder{color:#b9c5ba6b}
.name-form button{padding:11px 18px;background:#c6aa70;color:#1d2825;border:0;letter-spacing:.1em;font-size:13px;white-space:nowrap}
.name-form button:hover{background:#e0c792}
.name-sub{font:11px/1.7 system-ui,sans-serif;color:#8fa39b;margin-top:12px}
.hero-hud{position:absolute;right:clamp(23px,4.4vw,82px);top:110px;min-width:210px;display:none;text-align:right;pointer-events:none;text-shadow:0 1px 12px #011010}
.hero-hud.show{display:block}.hero-hud .mini-name{font-size:17px;letter-spacing:.16em;color:#efe8d1}.hero-hud .mini-stats{margin-top:10px;color:#c4ccb8;font-size:12px;letter-spacing:.06em}.hero-hud .mini-stats b{color:#e6cf98;font-weight:500}
.hero-hud .mini-progress{height:2px;background:#81928940;margin-top:12px;margin-left:auto;width:170px}.hero-hud .mini-progress i{display:block;background:#d6c38e;height:2px;width:40%;transition:width .5s}
.corner-detail{position:absolute;left:clamp(23px,4.4vw,82px);top:105px;writing-mode:vertical-rl;letter-spacing:.27em;color:#d7e5d660;font-size:12px;max-height:220px}
.modal-backdrop{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(2,11,13,.73);backdrop-filter:blur(12px);padding:22px;animation:fadein .25s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.modal{width:min(100%,660px);max-height:min(86svh,810px);overflow:auto;background:linear-gradient(150deg,#1c302c,#0e2324 80%);border:1px solid #c0b08966;box-shadow:0 25px 100px #0009, inset 0 0 0 7px #09201f;position:relative;padding:clamp(25px,4vw,43px)}
.modal:before,.modal:after{content:"◆";position:absolute;font-size:10px;color:#bb9e67}.modal:before{left:14px;top:14px}.modal:after{bottom:14px;right:14px}
.modal-close{position:absolute;right:20px;top:15px;background:transparent;border:0;color:#d9c99f;font:28px/1 sans-serif;padding:8px}
.modal-small{font:11px/1.4 system-ui,sans-serif;letter-spacing:.32em;color:#bda978;margin-bottom:11px}
.modal h2{font-weight:500;letter-spacing:.12em;font-size:29px;margin:0 0 24px;color:#f4eacb}.modal h3{font-weight:500;margin:26px 0 9px;color:#ebdbb0;font-size:17px}
.modal p{line-height:1.8;color:#cdd7c9;font-size:14px}.modal hr{border:0;border-top:1px solid #c3b68c35;margin:19px 0}.modal .sub{color:#9bafa5;font:12px/1.75 system-ui,sans-serif}
.sheet-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 22px}.sheet-cell{border-bottom:1px solid #aabb9e36;padding-bottom:12px}.sheet-cell small{color:#a8b5a2;font-size:12px;display:block;margin-bottom:7px}.sheet-cell strong{font-weight:500;color:#f1e6c8;font-size:16px}
.stat-line{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid #aabb9e36;gap:20px}.stat-line span{color:#c4d2c4}.stat-line b{color:#f4dda5;font-weight:500}
.task-status{display:inline-block;color:#e2c88c;font-size:12px;margin-left:9px}.chip-line{display:flex;flex-wrap:wrap;gap:9px;margin-top:16px}
.chip{background:#d9c08d0e;border:1px solid #cab88853;color:#f5e7c5;padding:9px 13px;font-size:13px;letter-spacing:.03em}.chip:hover{background:#e2c18635;border-color:#dec893}
.free-input{width:100%;min-height:115px;resize:vertical;background:#06191980;border:1px solid #b9b18f53;color:#f9ecd0;padding:16px;outline:0;font-size:16px;line-height:1.6}.free-input::placeholder{color:#889f93}
.primary-btn{border:1px solid #e2c68c;background:#cbb27d;color:#142422;padding:12px 19px;letter-spacing:.13em;font-size:14px}.primary-btn:hover{background:#ead4a6}
.plain-btn{border:1px solid #c7ba905c;background:transparent;color:#e6d4aa;padding:12px 17px;letter-spacing:.1em;font-size:13px}.plain-btn:hover{border-color:#d8c38b;background:#d2b57918}
.btn-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:22px}.inline-err{font-size:13px;color:#edab9b;margin:12px 0 0}.notice{color:#b5c6af;font-size:13px}
.area-map{position:relative;height:260px;border:1px solid #c1bb9652;background:radial-gradient(ellipse at 30% 25%,#385449,#112f30 67%,#0a1f23);overflow:hidden;margin:18px 0}
.area-map svg{width:100%;height:100%}.map-actions{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;z-index:40;top:21px;left:50%;transform:translate(-50%,-90px);background:#132e2aeb;border:1px solid #d3be877c;box-shadow:0 12px 40px #071515b3;color:#eedfb7;padding:12px 22px;font-size:13px;line-height:1.5;max-width:min(94vw,590px);text-align:center;transition:transform .35s ease}.toast.show{transform:translate(-50%,0)}
@media(min-width:1450px){.story-stage{padding-bottom:38px}.story-text{min-height:122px}.choice{min-height:68px}}
@media(max-width:960px){.app{min-height:740px}.story-shell{grid-template-columns:minmax(0,1fr);gap:20px}.story-stage{padding:70px 6vw 25px}.story-title{font-size:35px;margin-bottom:11px}.story-text{min-height:0;max-height:136px;overflow:auto;font-size:15px}.choice-wrap{max-width:none}.choices{display:grid;grid-template-columns:1fr 1fr;gap:6px}.choice{min-height:65px;padding:10px;grid-template-columns:27px 1fr 10px;border:1px solid #a3ae9b33}.choice-label{font-size:14px}.choice-hint{font-size:10px}.quickbar{margin-top:13px}.ambient-title{top:13%;right:14%;font-size:95px}.scene-caption{top:32%}.hero-hud{top:100px}.corner-detail{display:none}}
@media(max-width:560px){.app{height:100dvh;min-height:650px}.scene .world-art{width:100%;max-width:none;position:relative;left:0}.topline{left:20px;right:20px;top:20px}.brandname{font-size:15px}.brand-seal{width:34px;height:39px;font-size:11px}.season{font-size:10px;padding:9px 10px;white-space:nowrap}.ambient-title{top:13%;right:10%;font-size:69px}.scene-caption{top:28%;right:8%;font-size:10px}.story-stage{padding:50px 19px max(17px,env(safe-area-inset-bottom))}.story-shell{gap:15px}.story-title{font-size:29px;margin-bottom:10px}.kicker{font-size:10px;margin-bottom:10px}.story-text{font-size:13px;line-height:1.65;max-height:120px;overflow:auto}.choice-head{margin-bottom:7px}.choices{gap:5px}.choice{min-height:67px;grid-template-columns:24px 1fr;align-items:start;gap:5px;padding:9px 8px}.choice-index{font-size:15px;margin-top:2px}.choice-label{font-size:12.5px}.choice-hint{font-size:10px;white-space:normal;line-height:1.3}.choice .arrow{display:none}.quickbar{margin-top:10px;gap:2px}.quick{padding:7px 8px;font-size:11px}.quick svg{width:13px}.bar-divider{margin:0}.hero-hud{right:19px;top:83px;min-width:160px}.hero-hud .mini-name{font-size:14px}.hero-hud .mini-stats{font-size:10px}.hero-hud .mini-progress{width:125px}.scene-grain{opacity:.08}.sheet-list{grid-template-columns:1fr 1fr}.modal{padding:29px 23px}.modal h2{font-size:24px}}
@media(max-width:560px) and (max-height:700px){.scene-caption{display:none}.ambient-title{opacity:.55}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>

case 'spar':power=42;hp=-4;trust=1;msg='你与小不点较量了一番，筋骨发热，满头是汗。';break;
case 'gather':power=18;trust=2;collect='黑角兽骨片';msg='你将收集到的一块兽骨收入背囊。';break;
case 'study':power=26;state.flags.studied=true;willow=1;msg='错综复杂的纹路在脑海里留下了痕迹。';break;
case 'explore':power=30;hp=-6;loc='村外山林';msg='你拨开长草走进山林，发现了不寻常的脚印。';break;
case 'talk':trust=1;msg='你听到一些传闻，也记下了对方的神色。';break;
case 'hunt':power=64;hp=-17;loc='大荒林缘';if(state.power<300)hp=-31;collect='凶兽精血';msg='猎物终于倒下。你带回精血，身上也添了伤口。';break;
case 'train':power=65;hp=-3;msg='血气如溪奔涌，掌心留下细密的汗珠。';break;
case 'willow':willow=2;power=16;loc='柳神树下';msg='嫩枝轻轻一动，像有一道目光从你身上扫过。';break;
case 'returnEgg':state.flags.eggSaved=true;trust=3;hp=-5;msg='你护着鸟蛋将它归还。远处鹰啸一声，终于没有继续逼近。';break;
case 'takeEgg':state.flags.eggSaved=false;collect='裂纹鸟蛋';hp=-14;power=37;msg='蛋壳上传来一阵剧烈震动，你忽然意识到自己惹下了麻烦。';break;
case 'observeEgg':state.flags.eggSaved=false;state.flags.studied=true;power=36;msg='你看清几笔灵动的符文，但鹰鸣已经近在头顶。';break;
case 'fight':if(state.power<430){hp=-52;power=85;msg='你迎面承受巨大的冲击，血气震荡，险些倒下。'}else{hp=-19;power=105;msg='你扛住一次凌厉的冲击，骨血翻涌，身形未退。'}break;
case 'learnEagle':if(n>=10||state.flags.studied){skill='青鳞鹰宝术·雷霆爪';power=110;msg='雷光如细蛇缠绕指尖。你参悟了青鳞鹰的一式宝术！'}else{power=28;msg='你尚未摸清雷纹，只记下几段残缺的骨文。'}break;
case 'lift':if(state.power<380){hp=-13;power=86;msg='黑鼎纹丝不动，你咬牙发力，气血却在这一刻有所精进。'}else{power=106;trust=2;msg='铁鼎被你挪动寸许，周围传来一片惊呼。'}break;
case 'rest':hp=24;msg='你在草屋歇息，伤口结痂，身心稍稍恢复。';break;
case 'pray':willow=2;trust=1;msg='你向祭灵献上朴素供品。叶尖一缕微光缓缓亮起。';break;
default:power=12;msg='你在村中走过一遭，又听到几句新的传闻。';break;
}
state.power=Math.max(0,state.power+power);state.hp=Math.min(100,Math.max(0,state.hp+hp));state.trust=Math.max(-5,state.trust+trust);state.willow+=willow;
if(skill&&!state.skills.includes(skill))state.skills.push(skill);if(collect&&!state.inventory.includes(collect))state.inventory.push(collect);if(loc)state.location=loc;else if(['help','willow','rest','pray','returnEgg','train','study'].includes(a))state.location=a==='willow'?'柳神树下':'石村';
state.history.unshift({turn:n,action:a,note:msg});state.history=state.history.slice(0,35);
if(state.hp<=0){state.phase='dead';state.feedback='';save();render();notify('你的生命归于荒域。');return}
if(n===1&&!state.quests.includes('探索石村'))state.quests.push('探索石村');
if(n>=6&&!state.quests.includes('青鳞鹰之祸'))state.quests.push('青鳞鹰之祸');
if(n>=10&&state.skills.includes('青鳞鹰宝术·雷霆爪'))state.quests=state.quests.filter(q=>q!=='青鳞鹰之祸');
if(n>=11&&!state.quests.includes('千斤鼎的考验'))state.quests.push('千斤鼎的考验');
state.turn++;state.day=1+Math.floor((state.turn-1)/3);state.feedback='✧ '+msg;
save();render();
}
function reset(){if(!confirm('确定开始新的轮回？当前本机存档将被覆盖。'))return;state=fresh();save();closeModal();render();notify('新轮回已开启')}
function startGame(name){name=name.trim();if(!name){notify('请输入角色名字');return}state.name=name.slice(0,10);state.phase='playing';state.location=ERAS[state.era].place;state.power=ORIGINS[state.origin].power;state.inventory=state.origin==='d'?['脱落的骨片']:state.origin==='c'?['粗布衣','商队腰牌']:['粗布衣','一枚石币'];state.skills=state.origin==='d'?['本命宝术·初醒']:[];state.feedback='✧ 你在这个世界留下了自己的名字。';save();render();notify(`欢迎来到大荒，${name}`)}
function closeModal(){$('#modal-root').innerHTML=''}
function modalShell(kicker,title,content){$('#modal-root').innerHTML=`<div class="modal-backdrop" id="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><button class="modal-close" id="modal-close" title="关闭">×</button><div class="modal-small">${esc(kicker)}</div><h2>${esc(title)}</h2>${content}</section></div>`;$('#modal-close').addEventListener('click',closeModal);$('#modal-backdrop').addEventListener('click',e=>{if(e.target.id==='modal-backdrop')closeModal()})}
function openPanel(name){if(name==='free'){modalShell('FREE ACTION / 自由行动','你想做什么？',`<p>输入一个具体的行动，离线规则引擎会尝试理解。此版本支持常见修炼、狩猎、探索和交谈等动作。</p><textarea id="free-input" class="free-input" placeholder="例如：去村外狩猎，寻找凶兽的踪迹……"></textarea><div class="chip-line" id="free-chips">${['前往山林狩猎','在柳神树下修炼','找石昊交谈','探查村外','休息疗伤','向祭灵献祭','参悟雷霆爪'].map(x=>`<button class="chip" type="button" data-suggestion="${x}">${x}</button>`).join('')}</div><p class="inline-err" id="free-err" style="display:none"></p><div class="btn-row"><button class="primary-btn" id="free-submit">确认行动 ↗</button><button class="plain-btn" id="free-cancel">返回剧情</button></div>`);$('#free-submit').addEventListener('click',submitFree);$('#free-cancel').addEventListener('click',closeModal);$$('[data-suggestion]').forEach(b=>b.addEventListener('click',()=>{$('#free-input').value=b.dataset.suggestion;$('#free-input').focus()}));$('#free-input').focus();return}
if(name==='hero'){modalShell('CULTIVATOR / 修士面板',`${state.name||'尚未留名'} · ${realm()}`,`<div class="sheet-list"><div class="sheet-cell"><small>身份</small><strong>${esc(ORIGINS[state.origin]?.title||'未选择')}</strong></div><div class="sheet-cell"><small>当前位置</small><strong>${esc(state.location)}</strong></div><div class="sheet-cell"><small>肉身力量</small><strong>单臂 ${state.power} 斤</strong></div><div class="sheet-cell"><small>气血状态</small><strong>${state.hp} / 100</strong></div><div class="sheet-cell"><small>村中声望</small><strong>${Math.max(0,state.trust)} 点</strong></div><div class="sheet-cell"><small>祭灵感应</small><strong>${state.willow} 点</strong></div></div><h3>随身之物</h3><p>${state.inventory.map(esc).join('　·　')||'无'}</p><p class="sub">数值由离线规则计算，不依赖模型。突破条件：肉身积累并触发相应机缘。</p>`);return}
if(name==='tasks'){let q=state.quests.length?state.quests:['活下去'];modalShell('QUEST LOG / 任务', '荒域见闻',`<p>任务随剧情和玩家选择更新。离线事件会根据当前轮次与世界标记判断是否触发。</p>${q.map((x,i)=>`<div class="stat-line"><span>${['主线','支线','事件'][Math.min(i,2)]} · ${esc(x)}</span><b>${i===0?'进行中':'已记录'}</b></div>`).join('')}<h3>最近的回响</h3>${state.history.length?state.history.slice(0,5).map(x=>`<p class="sub">第${x.turn}回 · ${esc(x.note)}</p>`).join(''):'<p class="sub">你尚未踏出第一步。</p>'}`);return}
if(name==='skills'){modalShell('ARTS COLLECTION / 宝术图鉴', '骨文与宝术',`<p>狩猎、观察与传承均有机会获得宝术。图鉴由游戏状态决定，不能凭空获取。</p>${state.skills.length?state.skills.map(x=>`<div class="stat-line"><span>${esc(x)}</span><b>已领悟</b></div>`).join(''):'<div class="stat-line"><span>尚未习得宝术</span><b>0 / ？</b></div>'}<h3>参悟线索</h3><p>${state.flags.studied?'你已经观察过骨文。第十回可尝试参悟青鳞鹰宝术。':'凶禽羽翼上的雷纹，或许能成为你第一门宝术的起点。'}</p>`);return}
if(name==='map'){modalShell('WORLD MAP / 荒域图卷','此身所处之地',`<div class="area-map"><svg viewBox="0 0 580 260"><path d="M-10 75Q105 4 216 74T390 80T590 31M0 139Q140 63 240 134T580 120" fill="none" stroke="#90ad9e" stroke-width="25" opacity=".13"/><path d="M30 258L155 133L224 187L308 87L420 179L547 59L610 260" fill="#547966" opacity=".17"/><path d="M-20 244Q164 204 280 242T600 196" stroke="#c6bb8c" stroke-width="3" stroke-dasharray="7 8" fill="none" opacity=".57"/><circle cx="252" cy="160" r="8" fill="#d8c28a"/><circle cx="252" cy="160" r="23" fill="none" stroke="#d8c28a" opacity=".6"/><text x="268" y="150" font-size="16" fill="#f4e9c7">石村</text><circle cx="91" cy="102" r="5" fill="#bacaae"/><text x="45" y="88" font-size="14" fill="#d4dec9">苍莽山林</text><circle cx="467" cy="111" r="5" fill="#bacaae"/><text x="482" y="111" font-size="14" fill="#d4dec9">远山遗迹</text><text x="325" y="232" font-size="12" fill="#cdbd8e">脚下的大荒，远不止一座村庄</text></svg></div><div class="map-actions"><button class="chip" data-travel="石村">返回石村</button><button class="chip" data-travel="柳神树下">走近柳神</button><button class="chip" data-travel="村外山林">探索山林</button></div><p class="sub">原型中的地点切换使用基础规则；后续可接入真实地图、视野与事件系统。</p>`);$$('[data-travel]').forEach(b=>b.addEventListener('click',()=>{if(state.phase!=='playing'){notify('请先完成角色创建');return}let dest=b.dataset.travel;state.location=dest;closeModal();applyChoice(dest==='柳神树下'?'willow':dest==='村外山林'?'explore':'rest')}));return}
if(name==='save'){modalShell('CHRONICLE / 离线存档','这一世的足迹',`<p>当前进度自动保存在本机浏览器。无需联网，不会发送任何数据至服务器。</p><div class="sheet-list"><div class="sheet-cell"><small>游玩阶段</small><strong>${state.phase==='playing'?'第 '+state.turn+' 回':state.phase==='dead'?'已结束':'序幕'}</strong></div><div class="sheet-cell"><small>最近存档</small><strong>${esc(state.lastSave||'尚未保存')}</strong></div></div><div class="btn-row"><button class="primary-btn" id="manual-save">立即保存</button><button class="plain-btn" id="export-save">导出 JSON 存档</button><button class="plain-btn" id="reset-save">重新开始</button></div><hr><label class="sub" for="import-save">从本地 JSON 恢复存档：</label><input type="file" accept=".json,application/json" id="import-save" style="display:block;margin-top:10px;color:#d4d3bb;max-width:100%"><p class="sub">提示：清除浏览器站点数据可能删除自动存档。重要进度建议导出备份。</p>`);$('#manual-save').addEventListener('click',()=>{save(false);closeModal()});$('#export-save').addEventListener('click',()=>{save();const data=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(data);const a=document.createElement('a');a.href=url;a.download=`大荒纪事-${state.name||'存档'}-第${state.turn}回.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});$('#reset-save').addEventListener('click',reset);$('#import-save').addEventListener('change',async e=>{let f=e.target.files?.[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!d||!d.phase||!['era','origin','name','playing','dead'].includes(d.phase))throw Error('不是有效的游戏存档');state={...fresh(),...d,flags:{...(d.flags||{})}};save();closeModal();render();notify('存档恢复成功')}catch(ex){notify('导入失败：'+ex.message)}});return}
}
function submitFree(){const input=$('#free-input').value.trim();if(!input){$('#free-err').style.display='block';$('#free-err').textContent='请先输入一个行动。';return}
const commands=[[/雷霆爪|参悟|骨文/,state.turn>=10||state.flags.studied?'learnEagle':'study'],[/狩猎|猎杀|打猎|猎兽|追踪凶兽/,'hunt'],[/修炼|练功|打坐|闭关|淬炼/,'train'],[/柳神|祭灵|祭祀|供奉/,'willow'],[/村长|石昊|聊天|交谈|询问|打听|说服/,'talk'],[/帮助|保护|救人|照顾/,'help'],[/睡觉|休息|疗伤|恢复/,'rest'],[/探索|探查|调查|森林|山林|出村/,'explore'],[/铁鼎|举鼎|比武/,'lift']];let found=commands.find(([r])=>r.test(input));if(!found){$('#free-err').style.display='block';$('#free-err').textContent='当前离线原型尚不支持理解这项自由行动。试试「狩猎、修炼、找人交谈、探查、休息、参悟」等。';return}closeModal();applyChoice(found[1])}
document.addEventListener('click',e=>{const a=e.target.closest('[data-action]');if(a){applyChoice(a.dataset.action);return}const p=e.target.closest('[data-panel]');if(p){openPanel(p.dataset.panel);return}});
$('#name-form').addEventListener('submit',e=>{e.preventDefault();startGame($('#name-input').value)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)&&$('#free-input'))submitFree();if(e.key>='1'&&e.key<='4'&&!$('#modal-root').firstChild&&document.activeElement?.tagName!=='INPUT'&&document.activeElement?.tagName!=='TEXTAREA'){let buttons=$$('.choice');let b=buttons[Number(e.key)-1];if(b)b.click()}});
function adjustArt(){const art=$('.world-art');const narrow=window.innerWidth<=560;art.setAttribute('viewBox',narrow?'145 0 1600 900':'0 0 1600 900');art.setAttribute('preserveAspectRatio',narrow?'xMinYMid slice':'xMidYMid slice')}
window.addEventListener('resize',adjustArt,{passive:true});adjustArt();
render();
</script>
</body>
</html>
