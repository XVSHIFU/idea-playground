<body>
<div class="universe"><canvas id="sky" aria-label="可交互的星光粒子画布。移动鼠标或手指吸引粒子，点按释放星光。"></canvas></div>
<header><div class="brand"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="m16 2 2.9 10.9L30 16l-11.1 3.1L16 30l-2.9-10.9L2 16l11.1-3.1L16 2Z" stroke="currentColor"/><circle cx="16" cy="16" r="3" fill="currentColor"/></svg>星海<span>PARTICLE LAB</span></div><div class="live"><span class="pulse"></span><span id="render-status">实时粒子演算</span></div></header>
<main>
<section class="intro" aria-labelledby="title"><div class="eyebrow">EXPERIMENT / 001</div><h1 id="title">把星光，<br><span>握在手里。</span></h1><p>移动指尖，让星河向你汇聚<br>每一次触碰，都是一场小小的宇宙</p></section>
<div class="scene-label" id="scene-label">01 / SPIRAL NEBULA</div><div class="coordinates">FIELD&nbsp; <b id="field-name">螺旋星云</b><br>PARTICLES&nbsp; <b id="particle-readout">4,800</b></div>

<div class="status" id="status" role="status" aria-live="polite"></div>
<section class="dock" aria-label="粒子控制台">
<div class="mode-section"><div class="control-label">形态 / FORM</div><div class="modes" role="group" aria-label="选择粒子形态"><button class="mode" data-mode="nebula" aria-pressed="true"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><ellipse cx="10" cy="10" rx="8" ry="3.7" transform="rotate(-30 10 10)" stroke="currentColor"/><circle cx="10" cy="10" r="1.5" fill="currentColor"/></svg>星云</button><button class="mode" data-mode="sea" aria-pressed="false"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 2v4M10 14v4M2 10h4M14 10h4M4 4l3 3m6 6 3 3M4 16l3-3m6-6 3-3" stroke="currentColor"/></svg>星海</button><button class="mode" data-mode="text" aria-pressed="false"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4 4h12M10 4v12M7 16h6" stroke="currentColor" stroke-width="1.4"/></svg>文字</button></div></div>
<div class="speed"><label class="control-label" for="speed">流动速度<output id="speed-value" for="speed">0.8×</output></label><input class="slider" id="speed" type="range" min="0" max="2" step=".1" value=".8"><div class="sliderrange"><span>静谧</span><span>灵动</span></div></div>

<button class="pause" id="pause" aria-label="暂停动画" title="暂停动画（空格）"><svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><rect x="5" y="4" width="3" height="12" rx="1"/><rect x="12" y="4" width="3" height="12" rx="1"/></svg></button>
<div class="dock-caption"><span class="hint"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="m5 2 11 10-6 .5-3.5 5L5 2Z" stroke="currentColor"/></svg><span class="standard-note">移动吸引 · 点按绽放</span><span class="reduced-note">已减少动态 · 可手动播放</span></span><span class="keyboard"><span class="kbd">1</span> <span class="kbd">2</span> <span class="kbd">3</span> 切换形态&nbsp; · &nbsp;<span class="kbd">SPACE</span> 暂停</span></div>
</section>
</main>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),canvas=$('#sky'),ctx=canvas.getContext('2d',{alpha:true});
if(!ctx){$('#render-status').textContent='浏览器不支持画布';return;}
let W=innerWidth,H=innerHeight,dpr=Math.min(devicePixelRatio||1,2),mode='nebula',count=4800,speed=.8,time=0,last=0,paused=matchMedia('(prefers-reduced-motion: reduce)').matches,reduced=paused,points=[],textTargets=[],burst=0,raf=0;
let pointer={x:-9999,y:-9999,active:false},mobile=W<761;
const colors=['#b3caff','#dbe7ff','#778fff','#cc9cee','#a997ef','#79beed'];
const sprites=colors.map(c=>{const a=document.createElement('canvas');a.width=a.height=32;const g=a.getContext('2d');let r=g.createRadialGradient(16,16,0,16,16,16);r.addColorStop(0,'#fff');r.addColorStop(.1,c);r.addColorStop(.35,c+'6f');r.addColorStop(1,c+'00');g.fillStyle=r;g.fillRect(0,0,32,32);return a});
const bgStars=Array.from({length:150},()=>({x:Math.random(),y:Math.random(),s:Math.random(),a:Math.random()}));
function makePoint(i){const r=Math.pow(Math.random(),.68),arm=i%3;return{r,a:r*8.7+arm*Math.PI*2/3+(Math.random()-.5)*.62,z:(Math.random()-.5)*.20*(1-r*.75),j:Math.random(),k:Math.random(),c:Math.floor(Math.random()*colors.length),x:W*.64,y:H*.44,vx:0,vy:0};}
function makeParticles(){while(points.length<count)points.push(makePoint(points.length));points.length=count;$('#particle-readout').textContent=count.toLocaleString();$('#density-value').value=count.toLocaleString();}
function scene(){return{cx:mobile?W*.52:W*.64,cy:mobile?H*.45:H*.43,scale:Math.min(W*(mobile?.61:.34),H*.57)}}
function buildText(){const a=document.createElement('canvas'),g=a.getContext('2d',{willReadFrequently:true});a.width=1000;a.height=250;const text=$('#phrase').value.trim()||'星海';const fs=Math.min(178,870/Math.max(text.length,1));g.textAlign='center';g.textBaseline='middle';g.font=`700 ${fs}px "Noto Sans CJK SC","Microsoft YaHei",sans-serif`;g.fillStyle='#fff';g.fillText(text,500,125);const im=g.getImageData(0,0,1000,250).data;textTargets=[];for(let y=0;y<250;y+=3)for(let x=0;x<1000;x+=3)if(im[(y*1000+x)*4+3]>100)textTargets.push({x:(x-500)/1000,y:(y-125)/1000});for(let i=textTargets.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[textTargets[i],textTargets[j]]=[textTargets[j],textTargets[i]]}}
function target(p,i){const s=scene();if(mode==='nebula'){const a=p.a+time*(.055+.045*(1-p.r)),r=p.r*s.scale;const x=Math.cos(a)*r,y=Math.sin(a)*r*.50+p.z*s.scale;const tilt=-.27;return{x:s.cx+x*Math.cos(tilt)-y*Math.sin(tilt),y:s.cy+x*Math.sin(tilt)+y*Math.cos(tilt),size:(.45+p.k*.9)*(1-p.r*.35)}}
if(mode==='sea'){const a=p.a+time*.038,r=Math.sqrt(p.r)*s.scale;return{x:s.cx+Math.cos(a)*r*1.4+Math.sin(time*.24+p.k*16)*12,y:s.cy+Math.sin(a)*r*.71+Math.cos(time*.19+p.j*12)*16,size:.55+p.k*1.25}}
const t=textTargets[i%textTargets.length]||{x:0,y:0},scale=mobile?W*.98:Math.min(W*.87,1150);return{x:W*.5+t.x*scale+Math.sin(time*.4+p.k*8)*1.2,y:H*(mobile?.48:.43)+t.y*scale+Math.cos(time*.5+p.j*8)*1.2,size:.7+p.k*.65}}
function resetPositions(){points.forEach((p,i)=>{const t=target(p,i);p.x=t.x;p.y=t.y;p.vx=p.vy=0})}
function resize(){W=innerWidth;H=Math.max(innerHeight,mobile?700:0);mobile=W<761;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);if(paused){resetPositions();draw(0)}}
function draw(dt){ctx.clearRect(0,0,W,H);const s=scene();ctx.globalCompositeOperation='source-over';for(const star of bgStars){ctx.globalAlpha=.12+star.a*.45;ctx.fillStyle='#b8c8e9';ctx.fillRect(star.x*W,star.y*H,star.s+0.25,star.s+0.25)}ctx.globalAlpha=1;
if(mode==='nebula'){const r=s.scale*.66,g=ctx.createRadialGradient(s.cx,s.cy,0,s.cx,s.cy,r);g.addColorStop(0,'#aaaaff27');g.addColorStop(.06,'#a5a9ff21');g.addColorStop(.4,'#666de910');g.addColorStop(1,'#6060cc00');ctx.fillStyle=g;ctx.fillRect(s.cx-r,s.cy-r,r*2,r*2);ctx.save();ctx.translate(s.cx,s.cy);ctx.rotate(-.27);ctx.strokeStyle='#737eae13';ctx.lineWidth=.6;[.55,.91,1.14].forEach(r=>{ctx.beginPath();ctx.ellipse(0,0,s.scale*r,s.scale*r*.50,0,0,Math.PI*2);ctx.stroke()});ctx.restore()}
ctx.globalCompositeOperation='lighter';const step=Math.min(dt*60,2)||0;
points.forEach((p,i)=>{let t=target(p,i);if(step){let dx=t.x-p.x,dy=t.y-p.y;p.vx+=dx*.018*step;p.vy+=dy*.018*step;if(pointer.active){let px=pointer.x-p.x,py=pointer.y-p.y,d2=px*px+py*py;if(d2<50000){let f=(1-Math.sqrt(d2)/224)*.021; p.vx+=px*f*step;p.vy+=py*f*step}}p.vx*=Math.pow(.81,step);p.vy*=Math.pow(.81,step);p.x+=p.vx*step;p.y+=p.vy*step;}const flicker=.68+Math.sin(time*.8+p.j*25)*.20;ctx.globalAlpha=flicker*(mode==='text'?.78:.72);ctx.fillStyle=colors[p.c];const size=t.size;ctx.fillRect(p.x,p.y,size,size);if(i%7===0){ctx.globalAlpha=flicker*.68;let z=size*(p.k>.8?9:5.5);ctx.drawImage(sprites[p.c],p.x-z/2,p.y-z/2,z,z)}});
if(mode==='nebula'){ctx.globalAlpha=.7;ctx.drawImage(sprites[1],s.cx-29,s.cy-29,58,58);ctx.globalAlpha=.15;ctx.fillStyle='#bfd4ff';ctx.fillRect(s.cx-56,s.cy-.4,112,.8)}
if(pointer.active&&!paused){ctx.globalAlpha=.3;ctx.strokeStyle='#b3caff';ctx.lineWidth=.6;ctx.beginPath();ctx.arc(pointer.x,pointer.y,18,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=.08;ctx.drawImage(sprites[0],pointer.x-65,pointer.y-65,130,130)}ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';}
function frame(stamp){const dt=last?Math.min((stamp-last)/1000,.034):.016;last=stamp;if(!paused){time+=dt*speed;draw(dt)}raf=requestAnimationFrame(frame)}
let statusTimer;function notify(msg){$('#status').textContent=msg;$('#status').classList.add('visible');clearTimeout(statusTimer);statusTimer=setTimeout(()=>$('#status').classList.remove('visible'),2200)}
function setMode(next){if(!['nebula','sea','text'].includes(next))throw new Error('不支持的形态');mode=next;document.querySelectorAll('.mode').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));$('#text-form').hidden=mode!=='text';document.body.classList.toggle('text-mode',mode==='text');const names={nebula:['螺旋星云','01 / SPIRAL NEBULA'],sea:['自由星海','02 / INFINITE STARS'],text:['文字星光','03 / WORDS IN LIGHT']};$('#field-name').textContent=names[mode][0];$('#scene-label').textContent=names[mode][1];pointer.active=false;if(mode==='text')buildText();if(paused){resetPositions();draw(0)}notify(names[mode][0]);return state()}
function updatePause(){const b=$('#pause');b.setAttribute('aria-label',paused?'播放动画':'暂停动画');b.title=paused?'播放动画（空格）':'暂停动画（空格）';b.innerHTML=paused?'<svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="m6 3 11 7-11 7Z"/></svg>':'<svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><rect x="5" y="4" width="3" height="12" rx="1"/><rect x="12" y="4" width="3" height="12" rx="1"/></svg>';$('#render-status').textContent=paused?'星光已暂停':'实时粒子演算';}
function state(){return{mode,particles:count,speed,paused,text:$('#phrase').value}}
$('#pause').onclick=()=>{paused=!paused;updatePause();notify(paused?'时间暂停，星光仍在':'让星光继续流动')};document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
$('#speed').oninput=e=>{speed=+e.target.value;$('#speed-value').value=speed.toFixed(1)+'×'};$('#density').oninput=e=>{count=+e.target.value;makeParticles();if(paused){resetPositions();draw(0)}};$('#text-form').onsubmit=e=>{e.preventDefault();if(!$('#phrase').value.trim())$('#phrase').value='星海';buildText();if(paused){resetPositions();draw(0)}notify('你的文字，已化作星光')};
canvas.addEventListener('pointermove',e=>{pointer={x:e.clientX,y:e.clientY,active:true}});canvas.addEventListener('pointerleave',()=>pointer.active=false);canvas.addEventListener('pointerup',e=>{if(e.pointerType==='touch')pointer.active=false});canvas.addEventListener('pointerdown',e=>{if(paused)return;pointer={x:e.clientX,y:e.clientY,active:true};points.forEach(p=>{let dx=p.x-e.clientX,dy=p.y-e.clientY,d=Math.hypot(dx,dy);if(d<250){const f=(1-d/250)*23;p.vx+=dx/(d||1)*f;p.vy+=dy/(d||1)*f}})});
