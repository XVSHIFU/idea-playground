renderer.domElement.addEventListener('pointermove',e=>{const p=hit(e);hover=!!p;if(p){mousePoint.copy(p);if(!hoverReady){hoverX.value=p.x;hoverZ.value=p.z;hoverReady=true;}}if(!gesture||gesture.id!==e.pointerId||touches.size>1||gesture.removed)return;const distance=Math.hypot(e.clientX-gesture.x,e.clientY-gesture.y);if(distance>7){clearTimeout(longTimer);gesture.drag=true;if(!gesture.last){if(putTorch(gesture.p.x,gesture.p.z))gesture.last=gesture.p.clone();}if(p&&(!gesture.last||p.distanceTo(gesture.last)>radius*1.35)){if(putTorch(p.x,p.z))gesture.last=p.clone();}}});
function release(e){clearTimeout(longTimer);touches.delete(e.pointerId);if(gesture&&gesture.id===e.pointerId){if(!gesture.drag&&!gesture.removed&&e.type==='pointerup'&&e.button!==2){const p=hit(e);if(p)putTorch(p.x,p.z);}gesture=null;}}
renderer.domElement.addEventListener('pointerup',release);renderer.domElement.addEventListener('pointercancel',release);renderer.domElement.addEventListener('pointerleave',()=>{hover=false;});renderer.domElement.addEventListener('contextmenu',e=>e.preventDefault());
function setFast(value){fast=value&&mode==='playing';$('fastButton').setAttribute('aria-pressed',String(fast));}
$('fastButton').addEventListener('pointerdown',e=>{e.preventDefault();initAudio();e.currentTarget.setPointerCapture(e.pointerId);setFast(true);});for(const event of ['pointerup','pointercancel','lostpointercapture'])$('fastButton').addEventListener(event,()=>setFast(false));
window.addEventListener('keydown',e=>{if(/INPUT|SELECT|BUTTON/.test(e.target.tagName))return;if(e.key==='Alt')controls.mouseButtons.LEFT=THREE.MOUSE.ROTATE;if(e.code==='ShiftLeft'||e.code==='ShiftRight')setFast(true);if(e.code==='Space'){e.preventDefault();loadLevel(levelIndex,true);}if(e.code==='KeyR')regenerate();if(e.code==='Escape'){cancelled=true;hover=false;}});window.addEventListener('keyup',e=>{if(e.key==='Alt')controls.mouseButtons.LEFT=null;if(e.key==='Shift')setFast(false);});window.addEventListener('blur',()=>{setFast(false);clearTimeout(longTimer);gesture=null;touches.clear();});
$('seedButton').addEventListener('click',regenerate);function regenerate(){decorSeed=(decorSeed+7919)>>>0;makeDecor();}
$('outlineButton').addEventListener('click',()=>{outlineOn=!outlineOn;setOutlines();$('outlineButton').textContent='描边 '+(outlineOn?'开':'关');$('outlineButton').setAttribute('aria-pressed',String(outlineOn));});$('rotateButton').addEventListener('click',()=>{controls.autoRotate=!controls.autoRotate;$('rotateButton').textContent=controls.autoRotate?'缓慢自转':'固定视角';$('rotateButton').setAttribute('aria-pressed',String(controls.autoRotate));});$('soundButton').addEventListener('click',async()=>{soundOn=!soundOn;await initAudio();$('soundButton').textContent='音效 '+(soundOn?'开':'关');$('soundButton').setAttribute('aria-pressed',String(soundOn));if(soundOn)tone(330,.18,.035);});$('resetButton').addEventListener('click',()=>loadLevel(levelIndex,true));$('helpButton').addEventListener('click',help);$('autoButton').addEventListener('click',()=>{manual=false;$('timeMode').textContent='自动';});$('daySlider').addEventListener('input',e=>{manual=true;$('timeMode').textContent='手动';remainingTime=level.duration*(1-Number(e.target.value));updateHUD();if(remainingTime<=0)finish(false);});$('radiusSlider').addEventListener('input',e=>{const old=radius;radius=Number(e.target.value);for(const t of torches)markRegion(t.x,t.z,Math.max(old,radius)+.5);pathDirty=true;});$('pauseButton').addEventListener('click',()=>{paused=!paused;$('pauseButton').textContent=paused?'▶':'Ⅱ';$('pauseButton').setAttribute('aria-pressed',String(paused));});
LEVELS.forEach((l,i)=>{const o=document.createElement('option');o.value=i;o.textContent=l.name;$('levelSelect').append(o);});const option=document.createElement('option');option.value=12;option.textContent='无尽夜路';$('levelSelect').append(option);$('levelSelect').addEventListener('change',e=>loadLevel(Number(e.target.value)));
$('modal').addEventListener('cancel',e=>{e.preventDefault();$('modal').close();paused=false;});
function resize(){const w=innerWidth,h=innerHeight,aspect=w/h,vertical=aspect<1?12.5/aspect:11.4;camera.left=-vertical*aspect;camera.right=vertical*aspect;camera.top=vertical;camera.bottom=-vertical;camera.updateProjectionMatrix();renderer.setSize(w,h);if(w<700)$('settingsPanel').open=false;}window.addEventListener('resize',resize);resize();
let last=performance.now(),hudAt=0,skyAt=0,frameCount=0,perfSum=0,perfMax=0,lastPerf=performance.now();
function animate(now){requestAnimationFrame(animate);const begin=performance.now(),realDt=Math.min((now-last)/1000,.05);last=now;const dt=(paused||document.hidden)?0:realDt*(fast?1.6:1);age+=realDt;elapsed+=dt;island.position.y=entrySpring.step(0,realDt,7,.85);entryUniform.value=age;
 if(mode==='playing'&&started&&!manual&&dt){remainingTime=Math.max(0,remainingTime-dt);if(remainingTime===0)finish(false);}updateTorches(dt);updateTerrainLight();updatePerson(dt);updateEffects(dt);if(now-hudAt>100){updateHUD();hudAt=now;if(mode==='playing'&&started)$('hint').textContent=fear>.55?'他有些害怕。把光，放近一点。':!path.length?'光连起来，他就会继续走。':'把下一束光，留在他前面。';}if(now-skyAt>80){updateSky();skyAt=now;}
 ghost.visible=ring.visible=hover&&!cancelled&&mode==='playing'&&!paused;const hx=hoverX.step(mousePoint.x,realDt,30,1),hz=hoverZ.step(mousePoint.z,realDt,30,1);if(ghost.visible){ghost.position.set(hx,height(hx,hz)+island.position.y,hz);ghostFire.scale.y=1.6+Math.sin(now*.003)*.08;const p=ringGeo.attributes.position;for(let i=0;i<97;i++){const a=i/96*Math.PI*2,x=hx+Math.cos(a)*radius,z=hz+Math.sin(a)*radius;p.setXYZ(i,x,height(x,z)+island.position.y+.045,z);}p.needsUpdate=true;ringGeo.computeBoundingSphere();ring.material.color.set(blocked(hx,hz)?0x4a6fa5:0xffb347);}
 if(mode==='won'){const z=zoomSpring.step(1.1,realDt,14,1);camera.zoom=z;camera.updateProjectionMatrix();}controls.update();const jsMs=performance.now()-begin;renderer.render(scene,camera);perfSum+=jsMs;perfMax=Math.max(perfMax,jsMs);frameCount++;if(now-lastPerf>1000){$('perf').textContent=renderer.info.render.calls+' calls · '+(perfSum/frameCount).toFixed(2)+' ms JS · '+Math.round(frameCount*1000/(now-lastPerf))+' fps';window.lanternMetrics={drawCalls:renderer.info.render.calls,jsAverage:perfSum/frameCount,jsMax:perfMax,fps:frameCount*1000/(now-lastPerf)};frameCount=perfSum=perfMax=0;lastPerf=now;}}
if(new URLSearchParams(location.search).has('debug'))document.body.dataset.debug='';
loadLevel(0);requestAnimationFrame(animate);
// Read-only diagnostics and deterministic level validation, useful without changing player state.
window.lanternAudit=()=>({level:level.name,status:mode,torches:torches.length,remaining:remainingTime,fear,position:{x:person.position.x,z:person.position.z},drawCalls:renderer.info.render.calls,seed:decorSeed,routeLength:findPath(...level.start).length,metrics:window.lanternMetrics});
}
</script>
