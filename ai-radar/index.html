<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Radar MVP</title>
<style>
:root{--bg:#f5f6f8;--p:#fff;--s:#f9fafb;--i:#17191d;--m:#6b7280;--l:#e5e7eb;--a:#5b5cf0;--as:#eeeeff}html.dark{--bg:#0d0f12;--p:#14171b;--s:#191d22;--i:#f4f4f5;--m:#969da8;--l:#2a2f36;--a:#8587ff;--as:#252650;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--i);font:14px/1.5 Inter,"Noto Sans SC","PingFang SC",system-ui,sans-serif}button,input{font:inherit;color:inherit}.top{height:64px;position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:0 20px;background:var(--p);border-bottom:1px solid var(--l)}.brand{font-weight:800;white-space:nowrap}.brand:before{content:"◉";color:var(--a);margin-right:9px}.search{flex:1;max-width:620px;margin:auto}.search input{width:100%;height:40px;padding:0 14px;border:1px solid var(--l);border-radius:10px;background:var(--s);outline:none}.search input:focus{border-color:var(--a);box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 14%,transparent)}.icon{width:38px;height:38px;border:1px solid var(--l);border-radius:10px;background:var(--p);cursor:pointer}.offline{display:none;padding:7px 20px;background:#fff1bd;color:#664d00;font-size:12px}.offline.show{display:block}.shell{display:grid;grid-template-columns:170px minmax(420px,1fr) minmax(300px,380px);min-height:calc(100vh - 64px)}.rail{display:flex;flex-direction:column;gap:4px;padding:18px 12px;background:var(--p);border-right:1px solid var(--l)}.rail button{height:40px;border:0;border-radius:9px;background:transparent;text-align:left;padding:0 12px;cursor:pointer}.rail button.active{background:var(--as);color:var(--a);font-weight:700}.rail .bottom{margin-top:auto}.main{padding:28px 30px 70px;min-width:0}.head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:20px}.head h1{margin:0 0 5px;font-size:28px;letter-spacing:-.04em}.head p,.count{margin:0;color:var(--m);font-size:12px}.filters{display:flex;gap:7px;flex-wrap:wrap;padding:10px 0 18px;border-bottom:1px solid var(--l)}.chip{padding:6px 11px;border:1px solid var(--l);border-radius:999px;background:var(--p);font-size:12px;cursor:pointer}.chip.active{background:var(--i);border-color:var(--i);color:var(--p)}.day{margin-top:23px}.dayhead{display:flex;align-items:center;gap:9px;color:var(--m);font-size:11px}.dayhead strong{color:var(--i);font-size:13px}.dayhead:after{content:"";height:1px;flex:1;background:var(--l)}.item{display:grid;grid-template-columns:11px 1fr auto;gap:12px;padding:16px 6px;border-bottom:1px solid var(--l);border-radius:8px;cursor:pointer}.item:hover,.item.active{background:var(--p)}.dot{width:8px;height:8px;margin-top:7px;border:2px solid var(--a);border-radius:50%}.item.active .dot{background:var(--a);box-shadow:0 0 0 4px var(--as)}.item h2{margin:0 0 5px;font-size:15px}.excerpt{margin:0 0 8px;color:var(--m);font-size:13px}.meta{display:flex;gap:7px;flex-wrap:wrap;color:var(--m);font-size:11px}.tag{padding:2px 7px;border:1px solid var(--l);border-radius:999px;background:var(--s)}.time{color:var(--m);font-size:11px;white-space:nowrap}.detail{position:sticky;top:64px;height:calc(100vh - 64px);overflow:auto;padding:25px 23px;background:var(--p);border-left:1px solid var(--l)}.eyebrow{color:var(--a);font-size:10px;font-weight:800;letter-spacing:.08em}.detail h2{margin:9px 0 11px;font-size:22px;line-height:1.35}.lead{color:var(--m);line-height:1.65}.facts{padding:10px 0;margin:20px 0;border-block:1px solid var(--l)}.fact{display:grid;grid-template-columns:72px 1fr;gap:10px;padding:6px 0;font-size:12px}.fact span{color:var(--m)}.actions{display:flex;gap:8px;flex-wrap:wrap}.primary,.secondary{height:38px;padding:0 13px;border-radius:9px;cursor:pointer}.primary{border:1px solid var(--a);background:var(--a);color:#fff;font-weight:700}.secondary{border:1px solid var(--l);background:var(--p)}.note{margin-top:24px;padding-top:16px;border-top:1px solid var(--l);color:var(--m);font-size:12px}.empty{padding:48px 8px;text-align:center;color:var(--m)}.back{display:none}.toast{position:fixed;left:50%;bottom:22px;z-index:50;opacity:0;transform:translate(-50%,16px);padding:8px 12px;border-radius:8px;background:var(--i);color:var(--p);font-size:12px;transition:.18s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:980px){.shell{grid-template-columns:72px 1fr}.rail{align-items:center}.rail button{width:48px;padding:0;font-size:0;text-align:center}.rail button:before{content:attr(data-short);font-size:12px}.detail{position:fixed;inset:64px 0 0 72px;z-index:15;transform:translateX(100%);transition:.2s}.detail.open{transform:none}.back{display:inline-block}.main{padding-inline:24px}}@media(max-width:640px){.top{padding:0 12px}.brand{font-size:0}.brand:before{font-size:20px;margin:0}.shell{display:block}.rail{position:fixed;left:0;right:0;bottom:0;z-index:30;height:58px;flex-direction:row;justify-content:space-around;padding:7px;border:0;border-top:1px solid var(--l)}.rail .bottom{margin:0}.main{padding:20px 16px 80px}.detail{inset:64px 0 58px 0}.time{display:none}.item{grid-template-columns:10px 1fr}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div id="offline" class="offline">当前处于离线状态。已加载内容仍可浏览，外部链接可能不可用。</div>
<header class="top"><div class="brand">AI Radar</div><label class="search"><input id="q" placeholder="搜索标题、来源、摘要…" aria-label="搜索 AI 动态"></label><button id="theme" class="icon" aria-label="切换深浅色">◐</button></header>
<div class="shell"><nav class="rail"><button class="active" data-short="动态">动态</button><button data-short="研究">研究</button><button data-short="来源">数据源</button><button data-short="今天">今天</button><button data-short="7天">最近 7 天</button><button class="bottom" data-short="设置">设置</button></nav>
<main class="main"><div class="head"><div><h1>AI 动态</h1><p>快速判断今天发生了什么，再决定是否深入阅读或加入研究。</p></div><span id="count" class="count"></span></div><div id="filters" class="filters"></div><div id="feed"></div></main><aside id="detail" class="detail"></aside></div><div id="toast" class="toast"></div>
<script>
const items=[
{id:1,day:"今天",time:"2 小时前",cat:"模型",source:"OpenAI",title:"新一代推理模型更新工具调用与长上下文能力",excerpt:"官方更新聚焦更稳定的工具使用、更长上下文和开发者控制能力。",date:"2026-09-20",kind:"模型发布",status:"已核对",url:"https://openai.com/"},
{id:2,day:"今天",time:"4 小时前",cat:"Agent",source:"Anthropic",title:"Claude Code 工作流新增更细粒度的自动化能力",excerpt:"开发者工具继续向长期任务、代码理解与可组合工作流演进。",date:"2026-09-20",kind:"Agent 工具",status:"来源可用",url:"https://www.anthropic.com/"},
{id:3,day:"今天",time:"6 小时前",cat:"研究",source:"arXiv",title:"新研究比较多智能体系统在复杂协作任务中的可靠性",excerpt:"论文关注协作策略、错误传播与任务拆分方式对最终表现的影响。",date:"2026-09-20",kind:"研究",status:"预印本",url:"https://arxiv.org/"},
{id:4,day:"昨天",time:"昨天 18:20",cat:"产品",source:"Google DeepMind",title:"生成式 AI 产品继续扩展多模态创作工作流",excerpt:"更新将图像、文本与视频能力进一步放进连续的创作体验中。",date:"2026-09-19",kind:"产品",status:"已核对",url:"https://deepmind.google/"},
{id:5,day:"昨天",time:"昨天 12:05",cat:"SDK",source:"GitHub",title:"热门 AI SDK 更新结构化输出与流式响应接口",excerpt:"面向应用开发的接口继续收敛，重点改善类型安全与流式交互体验。",date:"2026-09-19",kind:"框架与 SDK",status:"来源可用",url:"https://github.com/"},
{id:6,day:"9 月 18 日",time:"9 月 18 日",cat:"产业",source:"AI Radar",title:"本周企业 AI 基础设施动态集中在推理成本与部署效率",excerpt:"多家厂商的更新共同指向更低延迟、更高吞吐与更灵活的部署选择。",date:"2026-09-18",kind:"产业",status:"聚合摘要",url:"#"}];
let active=items[0],cat="全部",query="";const cats=["全部","模型","Agent","SDK","研究","产品","产业"],feed=document.querySelector("#feed"),detail=document.querySelector("#detail");
const esc=s=>String(s).replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
function rows(){return items.filter(x=>(cat==="全部"||x.cat===cat)&&(!query||(`${x.title} ${x.excerpt} ${x.source}`).toLowerCase().includes(query.toLowerCase())))}
function render(){document.querySelector("#filters").innerHTML=cats.map(c=>`<button class="chip ${c===cat?"active":""}" data-cat="${c}">${c}</button>`).join("");const r=rows();document.querySelector("#count").textContent=`${r.length} 条结果`;if(!r.length){feed.innerHTML='<div class="empty">没有匹配内容。尝试减少筛选条件或更换关键词。</div>';return}const g={};r.forEach(x=>(g[x.day]??=[]).push(x));feed.innerHTML=Object.entries(g).map(([d,a])=>`<section class="day"><div class="dayhead"><strong>${d}</strong><span>${a.length} 条</span></div>${a.map(x=>`<article class="item ${active.id===x.id?"active":""}" tabindex="0" data-id="${x.id}"><span class="dot"></span><div><h2>${esc(x.title)}</h2><p class="excerpt">${esc(x.excerpt)}</p><div class="meta"><strong>${esc(x.source)}</strong><span class="tag">${esc(x.kind)}</span><span>${esc(x.status)}</span></div></div><span class="time">${x.time}</span></article>`).join("")}</section>`).join("")}
function show(x){active=x;detail.innerHTML=`<button class="secondary back" onclick="detail.classList.remove('open')">← 返回列表</button><div class="eyebrow">${esc(x.kind)} · ${esc(x.source)}</div><h2>${esc(x.title)}</h2><p class="lead">${esc(x.excerpt)}</p><div class="facts"><div class="fact"><span>发布时间</span><b>${x.date}</b></div><div class="fact"><span>来源</span><b>${esc(x.source)}</b></div><div class="fact"><span>分类</span><b>${esc(x.cat)}</b></div><div class="fact"><span>状态</span><b>${esc(x.status)}</b></div></div><div class="actions"><button class="primary" onclick="openSource(${x.id})">打开原文 ↗</button><button class="secondary" onclick="notify('已加入当前研究上下文（MVP 演示）')">＋ 加入研究</button></div><div class="note">MVP 详情保持来源边界：展示聚合信息与来源元数据，不伪造原文正文。</div>`;render();if(innerWidth<=980)detail.classList.add("open")}
function openSource(id){const x=items.find(v=>v.id===id);if(x.url==="#")return notify("该聚合条目没有单一原文链接");window.open(x.url,"_blank","noopener")}
function notify(t){const e=document.querySelector("#toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1500)}
document.addEventListener("click",e=>{const c=e.target.closest("[data-cat]");if(c){cat=c.dataset.cat;render()}const i=e.target.closest("[data-id]");if(i)show(items.find(x=>x.id==i.dataset.id))});
document.addEventListener("keydown",e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();document.querySelector("#q").focus()}if(e.key==="Enter"&&e.target.closest("[data-id]"))e.target.click();if(e.key==="Escape")detail.classList.remove("open")});
document.querySelector("#q").addEventListener("input",e=>{query=e.target.value;render()});document.querySelector("#theme").onclick=()=>document.documentElement.classList.toggle("dark");
function online(){document.querySelector("#offline").classList.toggle("show",!navigator.onLine)}addEventListener("online",online);addEventListener("offline",online);online();render();show(active);
</script></body></html>
